    const a = b.t * 0.8 + (i / n) * TAU;
    return { x: b.x + Math.cos(a) * 74, y: b.y + Math.sin(a) * 54, a: a };
  }

  // 子弹打中盾牌就返回 true（这颗子弹消失，Boss 不掉血）
  function hitBossShield(bullet) {
    const b = boss;
    if (!b || !b.shields || b.broken > 0) return false;
    for (let i = 0; i < b.shields.length; i++) {
      const s = b.shields[i];
      if (s.dead) continue;
      const p = bossShieldPos(b, i);
      const rr = bullet.r + s.r;
      if (dist2(bullet, p) < rr * rr) {
        s.hp -= bullet.dmg;
        explode(p.x, p.y, '#c9f6ff', 6, 0.7);
        sfx.hit();
        if (s.hp <= 0) {
          s.dead = true;
          explode(p.x, p.y, '#9fe8ff', 26, 1.9);
          rings.push({ x: p.x, y: p.y, r: 8, maxR: 70, life: 0.35, max: 0.35, color: '#c9f6ff' });
          sfx.shieldBreak();
          floaters.push({ x: p.x, y: p.y - 12, text: '盾牌破碎', life: 1.1, max: 1.1, color: '#9fe8ff' });
          let allDead = true;
          for (let k = 0; k < b.shields.length; k++) if (!b.shields[k].dead) allDead = false;
          if (allDead) {
            b.broken = 12;
            floaters.push({ x: b.x, y: b.y - 62, text: '★ 护盾全破 · 伤害 ×1.5', life: 2.0, max: 2.0, color: '#ffe45e' });
            shake.mag = 14; shake.t = shake.dur;
            vibrate([40, 30, 40]);
          }
        }
        return true;
      }
    }
    return false;
  }

  // ---- 幽灵母舰：幻影分身 ----
  function spawnBossGhosts(b) {
    const n = b.phase >= 3 ? 4 : b.phase === 2 ? 3 : 2;
    b.ghosts = [];
    for (let i = 0; i < n; i++) {
      b.ghosts.push({
        off: (i / n) * TAU,
        rx: 78 + i * 10, ry: 40 + i * 6,
        t: 0, life: 6.5, fireCd: 1.0
      });
    }
    floaters.push({ x: b.x, y: b.y - 58, text: '幻影分身 ×' + n, life: 1.6, max: 1.6, color: b.hot });
    sfx.warn();
  }

  // ---- 吞噬者：张嘴时才吞子弹 ----
  function devourOpen(b) {
    const cyc = b.phase >= 3 ? 5.0 : 6.0;
    const dur = b.phase >= 3 ? 3.0 : 2.0;
    return (b.mouthT % cyc) < dur;
  }

  function devourRadius(b) {
    return b.phase >= 3 ? 120 : b.phase === 2 ? 108 : 96;
  }

  // 子弹是否落进吞噬领域（只在张嘴时生效；正面朝下的扇形）
  function bossDevours(bullet) {
    const b = boss;
    if (!b || b.kind !== 'devourer' || !devourOpen(b)) return false;
    const R = devourRadius(b);
    const dy = bullet.y - b.y;
    if (dy < -24) return false;                 // 从上方打进来的不吞（留住绕后的收益）
    if (dist2(bullet, b) > R * R) return false;
    b.eaten++;
    explode(bullet.x, bullet.y, '#ff8a3d', 4, 0.6);
    if (b.eaten % 25 === 0) {
      b.hp = Math.min(b.maxHp, b.hp + b.maxHp * 0.004);
      floaters.push({ x: b.x, y: b.y + 34, text: '+吞噬', life: 0.9, max: 0.9, color: '#ff8a3d' });
    }
    return true;
  }

  function spawnBoss() {
    const bl = Math.min(level, 200);
    const def = BOSS_TYPES[bossRotation % BOSS_TYPES.length];
    bossRotation++;
    const bhp = Math.round((150 + bl * bl * 0.2) * def.hpMul);
    sfx.bossIn();
    boss = {
      x: W / 2, y: -90,
      w: 96, h: 78, r: 42,
      hp: bhp, maxHp: bhp,
      vx: def.vx,
      fireCd: 1.6,
      t: 0,
      flash: 0,
      phase: 1,
      invuln: 0,
      summonCd: 9,
      spiral: 0,
      kind: def.id,
      name: def.name,
      body: def.body,
      hot: def.hot,
      shot: def.shot,
      accent: def.accent,
      marks: [0, 0, 0],
      // ---- v1.6 专属机制 ----
      shields: null,
      broken: 0,
      ghosts: [],
      ghostCd: 7.5,
      eaten: 0,
      mouthT: 0
    };
    if (def.id === 'sentinel') makeBossShields(boss);
    toasts.push({ text: '⚠ ' + def.name + ' 来袭 · ' + def.mech, life: 2.8, max: 2.8, color: def.shot });
    vibrate([40, 60, 40]);
  }

  // Boss 进入下一阶段（v1.6：进阶段时专属机制会强化）
  function enterPhase(b, ph) {
    b.phase = ph;
    b.invuln = ph === 3 ? 1.2 : 1.6;
    const col = ph === 3 ? '#ffe45e' : b.hot;
    explode(b.x, b.y, col, ph === 3 ? 56 : 40, 2.2);
    rings.push({ x: b.x, y: b.y, r: 20, maxR: ph === 3 ? 500 : 420, life: 0.85, max: 0.85, color: col });
    floaters.push({
      x: b.x, y: b.y - 46,
      text: ph === 3 ? '⚠ 终局形态！' : '第二阶段！',
      life: 1.7, max: 1.7, color: col
    });
    if (b.kind === 'sentinel') {
      // 破甲期间进阶段不白送新盾：清空 leftovers，等破甲结束再按新阶段重建
      if (b.broken > 0) b.shields = [];
      else makeBossShields(b);
    }
    if (b.kind === 'wraith') { b.ghostCd = Math.min(b.ghostCd, 1.2); b.ghosts = []; }
    shake.mag = ph === 3 ? 26 : 20; shake.t = shake.dur;
    screenFlash = Math.min(0.18, screenFlash + (ph === 3 ? 0.14 : 0.1));
    vibrate(ph === 3 ? [60, 40, 90] : [40, 40]);
    if (ph === 3) sfx.bossFinal(); else sfx.bossIn();
  }

  // Boss 伤害统一入口：蓄力无敌时免疫；局外「破甲弹头」在这里统一加成；
  // v1.6：圣盾要塞护盾全破后进入 12 秒「破甲」，受到伤害 ×1.5
  function hurtBoss(dmg) {
    if (!boss || boss.invuln > 0) return;
    const brokenMul = boss.broken > 0 ? 1.5 : 1;
    boss.hp -= dmg * (1 + 0.1 * mlv('bossDmg')) * brokenMul;
    boss.flash = 0.09;
    if (boss.hp <= 0) killBoss();
  }

  function updateBoss(dt) {
    if (!boss) return;
    const b = boss;
    b.t += dt;
    if (b.flash > 0) b.flash -= dt;
    if (b.invuln > 0) b.invuln -= dt;
    if (b.marks) for (let m = 0; m < 3; m++) if (b.marks[m] > 0) b.marks[m] -= dt;

    // 66% 进二阶段、33% 进终局形态
    if (b.phase === 1 && b.hp <= b.maxHp * 0.66) enterPhase(b, 2);
    else if (b.phase === 2 && b.hp <= b.maxHp * 0.33) enterPhase(b, 3);

    if (b.y < 120) {
      b.y += 55 * dt;
    } else {
      const php = b.phase;
      const sp = b.vx * (php === 3 ? 1.75 : php === 2 ? 1.45 : 1);
      b.x += sp * dt;
      if (b.x < 90) { b.x = 90; b.vx = Math.abs(b.vx); }
      if (b.x > W - 90) { b.x = W - 90; b.vx = -Math.abs(b.vx); }
      const swing = php === 3 ? 34 : php === 2 ? 26 : 10;
      const rate = php === 3 ? 2.2 : 1.2;
      b.y = 120 + Math.sin(b.t * rate) * swing;
    }

    b.fireCd -= dt;
    if (b.fireCd <= 0 && b.y > 40) {
      bossFire(b);
      b.fireCd = b.phase === 3 ? Math.max(0.62, 1.05 - b.t * 0.006)
               : b.phase === 2 ? Math.max(0.9, 1.5 - b.t * 0.006)
               : Math.max(1.15, 2.0 - b.t * 0.008);
    }

    // 二阶段起定期召唤；终局每次多召一只
    if (b.phase >= 2) {
      b.summonCd -= dt;
      if (b.summonCd <= 0) {
        b.summonCd = b.phase === 3 ? 6.5 : 9;
        const cnt = b.phase === 3 ? 3 : 2;
        for (let i = 0; i < cnt; i++) {
          const t = b.phase === 3 && i === 2 ? 'bomber' : 'scout';
          const e = makeEnemy(t, b.x + (i - (cnt - 1) / 2) * 54, b.y + 30);
          e.hp = Math.max(3, Math.round(b.maxHp * 0.03));
          e.maxHp = e.hp;
          spawnQueue.push(e);
        }
        sfx.warn();
      }
    }

    // ---------- v1.6 专属机制 ----------
    if (b.kind === 'sentinel') {
      // 护盾全破 → 破甲 12 秒（伤害 ×1.5），结束后盾牌重生
      if (b.broken > 0) {
        b.broken -= dt;
        if (b.broken <= 0) {
          b.broken = 0;
          makeBossShields(b);
          floaters.push({ x: b.x, y: b.y - 56, text: '护盾重启', life: 1.3, max: 1.3, color: '#6fe2ff' });
          sfx.shieldUp();
        }
      }
    } else if (b.kind === 'wraith') {
      // 幻影分身：定期召一批，围着 Boss 摆动并射击
      b.ghostCd -= dt;
      if (b.ghostCd <= 0 && b.y > 60) {
        b.ghostCd = b.phase >= 3 ? 6 : b.phase === 2 ? 7 : 8.5;
        spawnBossGhosts(b);
      }
      for (let i = 0; i < b.ghosts.length; i++) {
        const g = b.ghosts[i];
        g.t += dt;
        g.life -= dt;
        g.x = b.x + Math.cos(g.off + g.t * 1.6) * g.rx;
        g.y = b.y + Math.sin(g.off + g.t * 1.6) * g.ry;
        g.fireCd -= dt;
        if (g.fireCd <= 0 && g.life > 0.5) {
          g.fireCd = 1.5;
          const a = Math.atan2(player.y - g.y, player.x - g.x);
          enemyBullets.push({ x: g.x, y: g.y, vx: Math.cos(a) * 165, vy: Math.sin(a) * 165, r: 5, color: '#ffb3e6' });
        }
      }
      if (b.ghosts.length) b.ghosts = b.ghosts.filter(function (g) { return g.life > 0; });
    } else if (b.kind === 'devourer') {
      b.mouthT += dt;
    }
  }

  function bossFire(b) {
    const px = b.x, py = b.y + 10;

    if (b.phase === 3) {
      // 终局形态：旋转环 + 三向螺旋 + 按 Boss 种类追加一套
      const n = 16;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * TAU + b.t * 0.9;
        enemyBullets.push({ x: px, y: py, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, r: 5, color: b.shot });
      }
      b.spiral += 0.42;
      for (let k = 0; k < 3; k++) {
        const a = b.spiral + k * (TAU / 3);
        enemyBullets.push({ x: px, y: py, vx: Math.cos(a) * 225, vy: Math.sin(a) * 225, r: 6.5, color: b.accent });
      }
      const base = Math.atan2(player.y - b.y, player.x - b.x);

      if (b.kind === 'sentinel') {
        for (let i = 0; i < 4; i++) {
          const a = i * (Math.PI / 2) + b.t * 0.6;
          enemyBullets.push({ x: px, y: py, vx: Math.cos(a) * 265, vy: Math.sin(a) * 265, r: 7, color: b.shot });
        }
        for (let i = -2; i <= 2; i++) {
          const a = base + i * 0.14;
          enemyBullets.push({ x: px, y: py, vx: Math.cos(a) * 305, vy: Math.sin(a) * 305, r: 5.5, color: '#ffffff' });
        }
      } else if (b.kind === 'devourer') {
        for (let i = -1; i <= 1; i++) {
          const a = base + i * 0.26;
          enemyBullets.push({
            x: px, y: py, vx: Math.cos(a) * 175, vy: Math.sin(a) * 175,
            r: 7, color: b.accent, homing: true
          });
        }
        enemyBullets.push({ x: px, y: py - 18, vx: 0, vy: 205, r: 11, color: b.hot, homing: true });
      } else {
        for (let i = -3; i <= 3; i++) {
          const a = base + i * 0.17;
          enemyBullets.push({ x: px, y: py, vx: Math.cos(a) * 285, vy: Math.sin(a) * 285, r: 5.5, color: b.hot });
        }
      }
    } else if (b.phase === 2) {
      // 二阶段：旋转环形弹幕 + 瞄准三连
      const n = 14;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * TAU + b.t * 0.7;
        enemyBullets.push({ x: b.x, y: b.y + 10, vx: Math.cos(a) * 165, vy: Math.sin(a) * 165, r: 5.5, color: b.hot });
      }
      const base = Math.atan2(player.y - b.y, player.x - b.x);
      for (let i = -1; i <= 1; i++) {
        const a = base + i * 0.18;
        enemyBullets.push({ x: b.x, y: b.y + 32, vx: Math.cos(a) * 250, vy: Math.sin(a) * 250, r: 6, color: b.accent });
      }
    } else {
      const n = 5;
      const base = Math.PI / 2;
      for (let i = 0; i < n; i++) {
        const a = base + (i - (n - 1) / 2) * 0.26;
        enemyBullets.push({ x: b.x, y: b.y + 32, vx: Math.cos(a) * 195, vy: Math.sin(a) * 195, r: 6, color: b.shot });
      }
      const a2 = Math.atan2(player.y - b.y, player.x - b.x);
      enemyBullets.push({ x: b.x, y: b.y + 32, vx: Math.cos(a2) * 235, vy: Math.sin(a2) * 235, r: 7, color: b.accent });
    }
    sfx.bossShot();
  }

  function killBoss() {
    const b = boss;
    const final = b.phase === 3;
    totalBosses++;
    bossesThisRun++;
    missionAdd('boss', 1);
    combo += 4;
    comboTimer = comboDuration() + 0.4;
    bombCharge = Math.min(300, bombCharge + (final ? 150 : 100));

    const gain = Math.round(800 * (final ? 2 : 1) * Math.min(10, 1 + Math.floor(combo / 3)));
    score += gain;
    addXp(final ? 260 : 160);
    const dustGain = addDust(final ? 480 : 240);   // Boss 星元（v1.6 从 800/400 下调）
    saveMeta();

    floaters.push({ x: b.x, y: b.y - 30, text: '+' + gain, life: 1.4, max: 1.4, color: '#ffe45e' });
    floaters.push({ x: b.x, y: b.y - 74, text: '+' + dustGain + ' ★', life: 1.6, max: 1.6, color: '#8affc1' });
    if (final) {
      floaters.push({ x: b.x, y: b.y - 58, text: '★ 终局击破 ★', life: 2.0, max: 2.0, color: '#ffffff' });
      unlock('finalForm');
      vibrate([80, 40, 120]);
    }
    explode(b.x, b.y, final ? '#ffffff' : '#ffb3e6', 90, 2.7);
    explode(b.x, b.y, '#ffd166', 60, 1.9);
    explode(b.x, b.y, '#ffffff', 34, 1.4);
    rings.push({ x: b.x, y: b.y, r: 10, maxR: final ? 420 : 300, life: 0.9, max: 0.9, color: '#ffd166' });

    hitstop = final ? 0.22 : 0.16;
    slowmo = final ? 1.7 : 1.2;
    shake.mag = final ? 32 : 26; shake.t = shake.dur;
    sfx.boom(0.45, 1.1, 1100);

    dropPowerup(b.x - 44, b.y);
    dropPowerup(b.x, b.y);
    dropPowerup(b.x + 44, b.y);
    if (final) {
      dropPowerup(b.x - 22, b.y + 22);
      dropPowerup(b.x + 22, b.y + 22);
    }
    boss = null;
    checkAchv();
  }

  // ============================================================
  //  子弹 / 导弹 / 激光
  // ============================================================
  function updateBullets(dt) {
    bullets = bullets.filter(function (b) {
      if (b.dead) return false;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      return b.y > -30 && b.y < H + 30 && b.x > -30 && b.x < W + 30;
    });
    const es = enemyBulletScale();
    enemyBullets = enemyBullets.filter(function (b) {
      if (b.dead) return false;
      if (b.homing) {
        const want = Math.atan2(player.y - b.y, player.x - b.x);
        const cur = Math.atan2(b.vy, b.vx);
        let diff = ((want - cur + Math.PI) % TAU + TAU) % TAU - Math.PI;
        const sp = Math.hypot(b.vx, b.vy) || 1;
        const na = cur + clamp(diff, -1.15 * dt, 1.15 * dt);
        b.vx = Math.cos(na) * sp;
        b.vy = Math.sin(na) * sp;
      }
      b.x += b.vx * dt * es;
      b.y += b.vy * dt * es;
      return b.y > -40 && b.y < H + 40 && b.x > -40 && b.x < W + 40;
    });
  }

  function spawnMissile(i, total) {
    const off = (i - (total - 1) / 2) * 13;
    missiles.push({
      x: player.x + off, y: player.y - 6,
      vx: off * 6, vy: -320,
      r: 6, life: 2.6, t: 0,
      trail: []
    });
    if (i === 0) sfx.missile();   // 连发只播一声，避免糊成噪音
  }

  function updateMissiles(dt) {
    const stacks = perk('missile');
    if (stacks > 0) {
      missileCd -= dt;
      if (missileCd <= 0) {
        if (missileLeft > 0) {
          spawnMissile(missileSide, stacks + 1);
          missileSide++;
          missileLeft--;
          missileCd = 0.10;
        } else {
          missileLeft = stacks + 1;   // 每轮多打一发：1→2、2→3、3→4
          missileSide = 0;
          missileCd = Math.max(1.2, 2.3 - 0.3 * (stacks - 1));
        }
      }
    }

    for (let i = 0; i < missiles.length; i++) {
      const m = missiles[i];
      m.t += dt;
      m.life -= dt;

      let tx = null, ty = null;
      if (boss) { tx = boss.x; ty = boss.y; }
      else if (enemies.length) {
        let bestE = null, bd = 1e9;
        for (let j = 0; j < enemies.length; j++) {
          const e = enemies[j];
          if (e.dead) continue;
          const d = dist2(e, m);
          if (d < bd) { bd = d; bestE = e; }
        }
        if (bestE) { tx = bestE.x; ty = bestE.y; }
      }

      const speed = 440;
      if (tx !== null) {
        const want = Math.atan2(ty - m.y, tx - m.x);
        let cur = Math.atan2(m.vy, m.vx);
        let diff = ((want - cur + Math.PI) % TAU + TAU) % TAU - Math.PI;
        cur += clamp(diff, -7 * dt, 7 * dt);
        m.vx = Math.cos(cur) * speed;
        m.vy = Math.sin(cur) * speed;
      } else {
        m.vy -= 300 * dt;
        m.vx *= 0.98;
      }

      m.x += m.vx * dt;
      m.y += m.vy * dt;
      if (m.trail.length > 9) m.trail.shift();
      m.trail.push({ x: m.x, y: m.y });
      if (m.y < -40 || m.x < -40 || m.x > W + 40) m.life = 0;
    }

    missiles = missiles.filter(function (m) { return m.life > 0; });
  }

  // 激光半宽（「弹药强化」每层 +9）；updateLaser / drawLaser 共用
  function laserHalfW() { return 26 + 9 * perk('bombUp'); }

  function updateLaser(dt) {
    if (laserTime <= 0) return;
    laserTime -= dt;
    // 「弹药强化」每层让激光更宽、更疼（这解决了旧的炸弹卡和激光卡互相排斥的问题）
    const up = perk('bombUp');
    const halfW = laserHalfW();
    const dmgK = 1 + 0.6 * up;

    // 激光扫到的敌弹直接烧掉
    for (let i = 0; i < enemyBullets.length; i++) {
      const b = enemyBullets[i];
      if (b.dead) continue;
      if (Math.abs(b.x - player.x) < halfW + b.r && b.y < player.y) {
        b.dead = true;
        explode(b.x, b.y, '#9fe8ff', 3, 0.5);
      }
    }

    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e.dead) continue;
      if (Math.abs(e.x - player.x) < halfW + e.r && e.y < player.y) {
        applyDamage(e, 55 * dmgK * dt);
        e.flash = 0.05;
        if (e.hp <= 0) { e.dead = true; killEnemy(e); }
      }
    }
    if (boss && Math.abs(boss.x - player.x) < halfW + boss.r) hurtBoss(70 * dmgK * dt);
  }

  // ============================================================
  //  道具
  // ============================================================
  function dropPowerup(x, y) {
    const r = gRandom();
    const type = r < 0.60 ? 'P' : r < 0.85 ? 'S' : 'H';
    powerups.push({ x: x, y: y, vy: 95, type: type, t: 0, r: 15, dead: false });
  }

  function maybeDrop(e) {
    const base = e.type === 'scout' ? 0.14 : e.type === 'fighter' ? 0.42 : 0.75;
    if (runMods.drop <= 0) return;
    if (gRandom() < base * (1 + 0.6 * perk('luck')) * (1 + 0.15 * mlv('luck')) * runMods.drop) dropPowerup(e.x, e.y);
  }

  function updatePowerups(dt) {
    const magnet = perk('magnet') * 70;
    for (let i = 0; i < powerups.length; i++) {
      const p = powerups[i];
      p.t += dt;
      if (magnet > 0) {
        const d = Math.sqrt(dist2(p, player));
        if (d < 160 + magnet) {
          const k = Math.min(1, dt * 7);
          p.x += (player.x - p.x) * k;
          p.y += (player.y - p.y) * k;
        } else {
          p.y += p.vy * dt;
        }
      } else {
        p.y += p.vy * dt;
      }
      if (p.y > H + 30) p.dead = true;
    }
    powerups = powerups.filter(function (p) { return !p.dead; });
  }

  function applyPowerup(type) {
    missionAdd('powerup', 1);
    if (type === 'P') {
      addXp(45);
      floaters.push({ x: player.x, y: player.y - 56, text: '+45 XP', life: 0.9, max: 0.9, color: '#5fd0ff' });
    } else if (type === 'S') {
      player.shield = 6;
    } else if (type === 'H') {
      if (player.lives < player.maxLives) player.lives++;
      else score += 300;
    }
    sfx.pickup();
  }

  // ============================================================
  //  粒子 / 冲击波 / 飘字
  // ============================================================
  function explode(x, y, color, count, power) {
    for (let i = 0; i < count; i++) {
      const a = vrand(0, TAU);
      const sp = vrand(40, 250) * power;
      const life = vrand(0.28, 0.75);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: life, max: life,
        color: color, size: vrand(1.4, 3.6) * power
      });
    }
  }

  function updateParticles(dt) {
    const damp = Math.pow(0.10, dt);
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= damp;
      p.vy *= damp;
      p.life -= dt;
    }
    particles = particles.filter(function (p) { return p.life > 0; });
  }

  function updateRings(dt) {
    for (let i = 0; i < rings.length; i++) {
      const r = rings[i];
      r.r += (r.maxR - r.r) * Math.min(1, dt * 9);
      r.life -= dt;
    }
    rings = rings.filter(function (r) { return r.life > 0; });
  }

  function updateFloaters(dt) {
    for (let i = 0; i < floaters.length; i++) {
      const f = floaters[i];
      f.y -= 44 * dt;
      f.life -= dt;
    }
    floaters = floaters.filter(function (f) { return f.life > 0; });
  }

  // ============================================================
  //  特殊武器（炸弹 / 激光）
  // ============================================================
  function triggerSpecial() {
    if (gameState !== 'playing' || bombCharge < 100) return;

    specialsUsed++;
    missionAdd('special', 1);
    vibrate([30, 25, 45]);
    if (perk('laser') > 0) {
      // 「弹药强化」也强化激光：3 秒 → 3.9 / 4.8 秒，宽度和伤害在 updateLaser / drawLaser 里跟着涨
      laserTime = 3 + 0.9 * perk('bombUp');
      bombCharge -= 100;
      sfx.laser();
      shake.mag = 10; shake.t = shake.dur;
      return;
    }
    releaseBomb();
  }

  function releaseBomb() {
    bombCharge = Math.max(0, bombCharge - 100);
    enemyBullets = [];

    const power = 1 + perk('bombUp');
    const dmg = 60 * power;
    const radius = 520 * (1 + 0.35 * perk('bombUp'));

    explode(player.x, player.y, '#ffe45e', 70, 2.5);
    rings.push({ x: player.x, y: player.y, r: 24, maxR: radius, life: 0.75, max: 0.75, color: '#ffe45e' });
    shake.mag = 22; shake.t = shake.dur;
    sfx.bomb();

    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e.dead) continue;
      applyDamage(e, dmg);
      e.flash = 0.15;
      if (e.hp <= 0) { e.dead = true; killEnemy(e); }
    }
    if (boss) hurtBoss(dmg * 1.3);
    hitstop = 0.14;
  }

  // ============================================================
  //  碰撞
  // ============================================================
  function hitPlayer() {
    if (player.invuln > 0) return;

    if (player.shield > 0) {
      player.shield = 0;
      player.invuln = 1.2;
      lastHurtAt = gameTime;
      explode(player.x, player.y, '#5fd0ff', 26, 1.7);
      shake.mag = 9; shake.t = shake.dur;
      sfx.shieldBreak();
      vibrate([20, 30, 20]);
      return;
    }

    // 局外「开局装甲」：每局前 N 次受伤直接免疫（先于应急装甲消耗）
    if (player.guard > 0) {
      player.guard--;
      player.invuln = 1.8;
      lastHurtAt = gameTime;
      explode(player.x, player.y, '#ffd34d', 28, 1.8);
      rings.push({ x: player.x, y: player.y, r: 14, maxR: 170, life: 0.45, max: 0.45, color: '#ffd34d' });
      floaters.push({
        x: player.x, y: player.y - 62,
        text: '开局装甲 · 剩 ' + player.guard, life: 1.3, max: 1.3, color: '#ffd34d'
      });
      sfx.shieldBreak();
      vibrate([20, 25, 20]);
      return;
    }

    // 应急装甲：每局第一次致命伤免疫
    if (perk('bulwark') > 0 && !bulwarkUsed) {
      bulwarkUsed = true;
      player.invuln = 2.2;
      player.shield = 2;
      lastHurtAt = gameTime;
      explode(player.x, player.y, '#7fd0ff', 30, 1.9);
      rings.push({ x: player.x, y: player.y, r: 16, maxR: 190, life: 0.5, max: 0.5, color: '#7fd0ff' });
      floaters.push({ x: player.x, y: player.y - 64, text: '应急装甲！', life: 1.4, max: 1.4, color: '#7fd0ff' });
      sfx.shieldBreak();
      vibrate([30, 40, 30]);
      return;
    }

    combo = 0;
    comboTimer = 0;
    player.lives--;
    player.invuln = 2.6 + 1.0 * perk('slowmo');
    coolantTime = 2.5;
    lastHurtAt = gameTime;
    explode(player.x, player.y, '#ff6a6a', 36, 2);
    shake.mag = 15; shake.t = shake.dur;
    sfx.hurt();
    vibrate(70);
    enemyBullets = [];
    if (player.lives === 1) sfx.lowHp();
    if (player.lives <= 0) gameOver();
  }

  function collisions() {
    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      if (b.dead) continue;

      for (let j = 0; j < enemies.length; j++) {
        const e = enemies[j];
        if (e.dead) continue;
        if (b.hitList.indexOf(e) >= 0) continue;
        if (dist2(b, e) < (b.r + e.r) * (b.r + e.r)) {
          b.hitList.push(e);
          const hadBurn = e.burn > 0;
          applyDamage(e, b.dmg);
          e.flash = 0.08;
          sfx.hit();
          explode(b.x, b.y - 4, '#bfe9ff', 4, 0.5);

          // 只有带元素的子弹才触发对应效果；叠满 3 层会「进化」
          if (b.elem === 'burn') {
            markElem(e, 'burn');
            e.burn = Math.max(e.burn, 2.6);
            e.burnDps = (3 + 2.2 * perk('burn')) * elemPower();
            if (perk('burn') >= 3) fireballBlast(b.x, b.y, e);
          } else if (b.elem === 'poison') {
            markElem(e, 'poison');
            const up = perk('poison') >= 3;
            if (poisonCd <= 0) {
              poisonCd = up ? 0.30 : 0.4;
              poisonClouds.push({
                x: b.x, y: b.y,
                r: up ? 84 : 62,
                life: up ? 3.2 : 2.6,
                max: up ? 3.2 : 2.6,
                dps: (5 + 2.5 * perk('poison')) * elemPower() * (up ? 1.5 : 1),
                seed: gRandom() * 10
              });
            }
            if (hadBurn) reaction('毒爆', b.x, b.y, e);
          } else if (b.elem === 'chain') {
            markElem(e, 'chain');
            tryChain(e, b.x, b.y);
          }
          // 三种元素印记同时在身 → 元素奇点（在毒爆/燃链/导电之后再判，不冲突）
          if (b.elem) checkTrinity(e, b.x, b.y);

          if (e.hp <= 0) {
            e.dead = true;
            killEnemy(e);
          }

          if (b.pierce > 0) b.pierce--;
          else { b.dead = true; break; }
        }
      }

      // v1.6 Boss 专属机制：圣盾要塞先用盾牌挡，吞噬者张嘴时把子弹吃掉
      if (!b.dead && boss && dist2(b, boss) < 220 * 220) {
        if (boss.kind === 'sentinel' && hitBossShield(b)) { b.dead = true; continue; }
        if (boss.kind === 'devourer' && bossDevours(b)) { b.dead = true; continue; }
      }

      if (!b.dead && boss && dist2(b, boss) < (b.r + boss.r) * (b.r + boss.r)) {
        b.dead = true;
        const bs = boss;
        hurtBoss(b.dmg);          // 这一下可能打死 Boss 并把 boss 置 null
        explode(b.x, b.y + 4, '#ffd0e8', 4, 0.5);
        if (b.elem && boss) { markElem(bs, b.elem); checkTrinity(bs, b.x, b.y); }
      }
    }

    for (let i = 0; i < missiles.length; i++) {
      const m = missiles[i];
      if (m.life <= 0) continue;

      for (let j = 0; j < enemies.length; j++) {
        const e = enemies[j];
        if (e.dead) continue;
        if (dist2(m, e) < (m.r + e.r) * (m.r + e.r)) {
          m.life = 0;
          applyDamage(e, 5);
          e.flash = 0.1;
          if (missileHitCd <= 0) { missileHitCd = 0.06; sfx.missileHit(); }
          explode(m.x, m.y, '#ffb06a', 20, 1.3);
          rings.push({ x: m.x, y: m.y, r: 4, maxR: 46, life: 0.25, max: 0.25, color: '#ffb06a' });
          if (e.hp <= 0) { e.dead = true; killEnemy(e); }
          tryChain(e, m.x, m.y);
          break;
        }
      }
      if (m.life > 0 && boss && dist2(m, boss) < (m.r + boss.r) * (m.r + boss.r)) {
        m.life = 0;
        hurtBoss(6);
        if (missileHitCd <= 0) { missileHitCd = 0.06; sfx.missileHit(); }
        explode(m.x, m.y, '#ffb06a', 22, 1.4);
      }
    }

    for (let i = 0; i < enemyBullets.length; i++) {
      const b = enemyBullets[i];
      if (b.dead) continue;
      if (dist2(b, player) < (b.r + player.r) * (b.r + player.r)) {
        b.dead = true;
        hitPlayer();
      }
    }

    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e.dead) continue;
      if (dist2(e, player) < (e.r + player.r) * (e.r + player.r)) {
        if (e.type === 'bomber') { e.dead = true; bomberBlast(e); continue; }
        hitPlayer();
        applyDamage(e, 30);
        if (e.hp <= 0) { e.dead = true; killEnemy(e); }
      }
    }

    if (boss && dist2(boss, player) < (boss.r + player.r) * (boss.r + player.r)) {
      hitPlayer();
    }

    const magnetBonus = perk('magnet') * 70;
    for (let i = 0; i < powerups.length; i++) {
      const p = powerups[i];
      if (p.dead) continue;
      const rr = p.r + player.r + 8 + magnetBonus;
      if (dist2(p, player) < rr * rr) {
        p.dead = true;
        applyPowerup(p.type);
        explode(p.x, p.y, '#ffffff', 10, 0.8);
      }
    }
  }

  // ============================================================
  //  主更新
  // ============================================================
  function update(dt) {
    // 音乐分层跟着连击走（v1.2）：放在 hitstop 判断之前，命中冻结时音乐也不掉层
    bgmLayer = (combo >= 60 || comboRush > 0) ? 3
             : (combo >= 30 || comboBuff > 0) ? 2
             : combo >= 15 ? 1 : 0;

    if (screenFlash > 0) screenFlash -= dt;
    if (reactionCd > 0) reactionCd -= dt;
    if (trinityCd > 0) trinityCd -= dt;
    if (coolantTime > 0) coolantTime -= dt;

    if (hitstop > 0) {
      hitstop -= dt;
      return;
    }

    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) { combo = 0; cm30 = false; cm60 = false; cm100 = false; }
    }
    if (comboBuff > 0) comboBuff -= dt;
    if (comboRush > 0) comboRush -= dt;

    updatePlayer(dt);
    if (chainCd > 0) chainCd -= dt;
    if (missileHitCd > 0) missileHitCd -= dt;

    // 自动维修：定时回命
    if (perk('regen') > 0) {
      regenTimer -= dt;
      if (regenTimer <= 0) {
        regenTimer = Math.max(30, 45 - 8 * (perk('regen') - 1));
        if (player.lives < player.maxLives) {
          player.lives++;
          sfx.heal();
          floaters.push({ x: player.x, y: player.y - 60, text: '+1 命', life: 1.1, max: 1.1, color: '#ff7ab8' });
        }
      }
    }

    const shieldStacks = perk('shieldGen');
    if (shieldStacks > 0) {
      shieldTimer -= dt;
      if (shieldTimer <= 0) {
        shieldTimer = Math.max(10, 18 - 4 * (shieldStacks - 1));
        if (player.shield <= 0) { player.shield = 3; sfx.shieldUp(); }
      }
    }

    player.fireCd -= dt;
    if (player.fireCd <= 0) {
      playerShoot();
      player.fireCd = fireInterval();
    }

    if (!boss) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnEnemy();
        spawnTimer = Math.max(0.42, 1.30 - gameTime * 0.010) / Math.max(0.4, settings.density * runMods.density);
      }
      formationTimer -= dt;
      if (formationTimer <= 0) spawnFormation();
      if (gameTime >= nextBossAt) {
        spawnBoss();
        nextBossAt = gameTime + 60;
      }
    }

    updateEnemies(dt);
    updateDrones(dt);
    updateRailgun(dt);
    updateBoss(dt);
    updateBullets(dt);
    updateMissiles(dt);
    updateLaser(dt);
    updatePowerups(dt);
    updateParticles(dt);
    updateRings(dt);
    updateFloaters(dt);
    updateBolts(dt);
    updatePoison(dt);
    if (spawnQueue.length) { for (let i = 0; i < spawnQueue.length; i++) enemies.push(spawnQueue[i]); spawnQueue = []; }
    collisions();

    achvCd -= dt;
    if (achvCd <= 0) { achvCd = 0.25; checkAchv(); missionTick(); }

    if (pendingCards > 0 && gameState === 'playing') openCards();
  }

  // ============================================================
  //  绘制：世界
  // ============================================================
  function drawStars() {
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const r = 0.6 + s.z * 1.7;
      ctx.fillStyle = 'rgba(170,215,255,' + (0.15 + s.z * 0.65).toFixed(3) + ')';
      ctx.fillRect(s.x - r / 2, s.y - r / 2, r, r);
    }
  }

  // 皮肤专属装饰（v1.6）：每款一个，画在机身之后、护盾之前
  function drawSkinDeco(sk, alpha, now) {
    const d = sk.deco;
    if (!d) return;
    ctx.save();
    if (d === 'ring') {              // 极光：慢转虚线光环
      ctx.globalAlpha = alpha * 0.55;
      ctx.strokeStyle = sk.trim;
      ctx.lineWidth = 1.4;
      ctx.setLineDash([6, 9]);
      ctx.lineDashOffset = -now / 45;
      ctx.beginPath();
      ctx.arc(0, -2, 31, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
    } else if (d === 'blade') {      // 赤焰：前掠刃线
      ctx.globalAlpha = alpha * 0.85;
      ctx.strokeStyle = sk.trim;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-24, 3); ctx.lineTo(-14, -12);
      ctx.moveTo(24, 3); ctx.lineTo(14, -12);
      ctx.stroke();
    } else if (d === 'orb') {        // 翡翠：两侧能量球 + 连线
      const p = 0.6 + Math.sin(now / 220) * 0.4;
      ctx.globalAlpha = alpha * 0.35;
      ctx.strokeStyle = sk.trim;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-17, 2); ctx.lineTo(17, 2);
      ctx.stroke();
      ctx.globalAlpha = alpha * p;
      ctx.fillStyle = sk.trim;
      ctx.beginPath(); ctx.arc(-17, 2, 3.2, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(17, 2, 3.2, 0, TAU); ctx.fill();
    } else if (d === 'wing') {       // 金鹰：延长金翼
      ctx.globalAlpha = alpha * 0.75;
      ctx.fillStyle = sk.trim;
      ctx.beginPath();
      ctx.moveTo(-23, 3); ctx.lineTo(-35, -1); ctx.lineTo(-22, 10);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(23, 3); ctx.lineTo(35, -1); ctx.lineTo(22, 10);
      ctx.closePath(); ctx.fill();
    } else if (d === 'voidring') {   // 虚空：暗环 + 三点环绕
      ctx.globalAlpha = alpha * 0.5;
      ctx.strokeStyle = sk.trim;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(0, -2, 27, now / 700, now / 700 + 4.4);
      ctx.stroke();
      ctx.fillStyle = sk.trim;
      for (let i = 0; i < 3; i++) {
        const a = now / 500 + i * (TAU / 3);
        ctx.beginPath();
        ctx.arc(Math.cos(a) * 27, -2 + Math.sin(a) * 27, 1.8, 0, TAU);
        ctx.fill();
      }
    } else if (d === 'neon') {       // 霓虹：发光霓虹管
      ctx.globalAlpha = alpha * 0.9;
      ctx.shadowColor = sk.trim;
      ctx.shadowBlur = 14;
      ctx.strokeStyle = sk.trim;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(0, -26); ctx.lineTo(11, -8); ctx.lineTo(20, 4);
      ctx.moveTo(0, -26); ctx.lineTo(-11, -8); ctx.lineTo(-20, 4);
      ctx.stroke();
      ctx.shadowBlur = 0;
    } else if (d === 'crystal') {    // 寒霜：翼上冰晶
      ctx.globalAlpha = alpha * 0.8;
      ctx.strokeStyle = sk.trim;
      ctx.lineWidth = 1.2;
      for (let s = -1; s <= 1; s += 2) {
        const cx = s * 16, cy = 2;
        ctx.beginPath();
        for (let k = 0; k < 6; k++) {
          const a = k * TAU / 6 + Math.PI / 6;
          const px = cx + Math.cos(a) * 5, py = cy + Math.sin(a) * 5;
          if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
      }
    } else if (d === 'crack') {      // 熔岩：机身裂纹
      ctx.globalAlpha = alpha * 0.9;
      ctx.strokeStyle = sk.trim;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-6, -14); ctx.lineTo(-2, -4); ctx.lineTo(-7, 3); ctx.lineTo(-3, 11);
      ctx.moveTo(6, -10); ctx.lineTo(3, -1); ctx.lineTo(7, 6);
      ctx.stroke();
    } else if (d === 'after') {      // 幻影：两层残影
      ctx.globalAlpha = alpha * 0.22;
      ctx.fillStyle = sk.body;
      for (let k = 1; k <= 2; k++) {
        ctx.beginPath();
        ctx.moveTo(0, -24 + k * 6);
        ctx.lineTo(14 - k * 2, 5 + k * 5);
        ctx.lineTo(5 - k, 15 + k * 4);
        ctx.lineTo(-5 + k, 15 + k * 4);
        ctx.lineTo(-14 + k * 2, 5 + k * 5);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawPlayer() {
    const blink = player.invuln > 0 && Math.floor(player.invuln * 12) % 2 === 0;
    const sk = curSkin();
    const now = performance.now();
    const alpha = blink ? 0.32 : 1;

    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.globalAlpha = alpha;

    // ---- 双引擎尾焰（颜色跟皮肤走）----
    const f = 0.8 + Math.sin(now / 45) * 0.28;
    for (let s = -1; s <= 1; s += 2) {
      const grad = ctx.createLinearGradient(0, 12, 0, 46);
      grad.addColorStop(0, sk.flame);
      grad.addColorStop(0.45, sk.glow);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(s * 1.4, 12);
      ctx.lineTo(s * 6, 15);
      ctx.lineTo(s * 3.4, 16 + 24 * f);
      ctx.closePath();
      ctx.fill();
    }

    // ---- 机身：左右对称路径 + 自上而下渐变 + 描边 ----
    const RP = [[0, -27], [5, -11], [12, -7], [23, 3], [22, 11], [9, 9], [7, 19]];
    const bodyGrad = ctx.createLinearGradient(0, -27, 0, 19);
    bodyGrad.addColorStop(0, sk.trim);
    bodyGrad.addColorStop(0.2, sk.body);
    bodyGrad.addColorStop(1, sk.core);

    ctx.shadowColor = sk.glow;
    ctx.shadowBlur = 15;
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(RP[0][0], RP[0][1]);
    for (let i = 1; i < RP.length; i++) ctx.lineTo(RP[i][0], RP[i][1]);
    ctx.lineTo(0, 15.5);
    for (let i = RP.length - 1; i >= 1; i--) ctx.lineTo(-RP[i][0], RP[i][1]);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = sk.trim;
    ctx.lineWidth = 1.3;
    ctx.globalAlpha = alpha * 0.9;
    ctx.stroke();
    ctx.globalAlpha = alpha;

    // 机翼分割线
    ctx.strokeStyle = 'rgba(0,0,0,0.30)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(12, -7); ctx.lineTo(9, 9);
    ctx.moveTo(-12, -7); ctx.lineTo(-9, 9);
    ctx.moveTo(0, -20); ctx.lineTo(0, 13);
    ctx.stroke();

    // 座舱
    ctx.fillStyle = sk.core;
    ctx.beginPath();
    ctx.ellipse(0, -8, 4.6, 8.2, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = sk.glow;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = sk.eye;
    ctx.beginPath();
    ctx.ellipse(-1.3, -10.5, 1.7, 3.2, 0, 0, TAU);
    ctx.fill();

    // 翼尖航行灯（脉动）
    const lamp = 0.55 + Math.abs(Math.sin(now / 260)) * 0.45;
    ctx.fillStyle = sk.trim;
    ctx.globalAlpha = alpha * lamp;
    ctx.beginPath(); ctx.arc(22.5, 5, 2.1, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(-22.5, 5, 2.1, 0, TAU); ctx.fill();
    ctx.globalAlpha = alpha;

    // 皮肤专属装饰
    drawSkinDeco(sk, alpha, now);

    if (player.shield > 0) {
      const a = 0.25 + Math.abs(Math.sin(now / 180)) * 0.25;
      ctx.strokeStyle = 'rgba(110,215,255,' + a.toFixed(3) + ')';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, 27, 0, TAU);
      ctx.stroke();
      ctx.fillStyle = 'rgba(80,190,255,0.10)';
      ctx.fill();
    }

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawEnemies() {
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      ctx.save();
      ctx.translate(e.x, e.y);
      const white = e.flash > 0;

      if (e.type === 'scout') {
        ctx.fillStyle = white ? '#ffffff' : e.color;
        ctx.beginPath();
        ctx.moveTo(0, 13);
        ctx.lineTo(-11, -8);
        ctx.lineTo(0, -3);
        ctx.lineTo(11, -8);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = white ? '#ffffff' : 'rgba(255,180,190,0.9)';
        ctx.beginPath();
        ctx.arc(0, 2, 3, 0, TAU);
        ctx.fill();
      } else if (e.type === 'fighter') {
        ctx.fillStyle = white ? '#ffffff' : e.color;
        ctx.beginPath();
        ctx.moveTo(0, 16);
        ctx.lineTo(-9, 8);
        ctx.lineTo(-16, 2);
        ctx.lineTo(-12, -6);
        ctx.lineTo(0, -10);
        ctx.lineTo(12, -6);
        ctx.lineTo(16, 2);
        ctx.lineTo(9, 8);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = white ? '#ffffff' : 'rgba(40,10,60,0.85)';
        ctx.beginPath();
        ctx.arc(0, 2, 4.5, 0, TAU);
        ctx.fill();
      } else if (e.type === 'splitter') {
        ctx.rotate(e.t * 0.6);
        ctx.fillStyle = white ? '#ffffff' : e.color;
        ctx.beginPath();
        ctx.moveTo(0, -20); ctx.lineTo(20, 0); ctx.lineTo(0, 20); ctx.lineTo(-20, 0);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = white ? '#ffffff' : '#0d3b22';
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, TAU);
        ctx.fill();
        ctx.fillStyle = white ? '#ffffff' : '#a8ffd0';
        ctx.beginPath();
        ctx.arc(0, 0, 3.5, 0, TAU);
        ctx.fill();
      } else if (e.type === 'sniper') {
        ctx.fillStyle = white ? '#ffffff' : e.color;
        ctx.beginPath();
        ctx.moveTo(0, 21); ctx.lineTo(9, 2); ctx.lineTo(15, -8);
        ctx.lineTo(7, -6); ctx.lineTo(4, -18); ctx.lineTo(-4, -18);
        ctx.lineTo(-7, -6); ctx.lineTo(-15, -8); ctx.lineTo(-9, 2);
        ctx.closePath();
        ctx.fill();
        const gl = e.charge > 0 ? 1 : 0.25;
        ctx.fillStyle = 'rgba(255,120,60,' + gl + ')';
        ctx.beginPath();
        ctx.arc(0, 14, 4.5, 0, TAU);
        ctx.fill();
      } else if (e.type === 'guard') {
        // 六边形装甲 + 环形护盾
        ctx.fillStyle = white ? '#ffffff' : e.color;
        ctx.beginPath();
        for (let k = 0; k < 6; k++) {
          const a = -Math.PI / 2 + k * TAU / 6;
          const px = Math.cos(a) * 21, py = Math.sin(a) * 21;
          if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = white ? '#ffffff' : '#062033';
        ctx.beginPath();
        ctx.arc(0, 0, 9, 0, TAU);
        ctx.fill();
        ctx.fillStyle = white ? '#ffffff' : '#9fe8ff';
        ctx.beginPath();
        ctx.arc(0, 0, 4.5, 0, TAU);
        ctx.fill();

        if (e.shieldHp > 0) {
          const ratio = Math.max(0, e.shieldHp / (e.shieldMax || 1));
          const pulse = 0.5 + 0.5 * Math.sin(e.t * 6);
          ctx.strokeStyle = 'rgba(99,210,255,' + (0.32 + pulse * 0.34).toFixed(2) + ')';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(0, 0, 29, -Math.PI / 2, -Math.PI / 2 + TAU * ratio);
          ctx.stroke();
          ctx.strokeStyle = 'rgba(99,210,255,0.12)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(0, 0, 29, 0, TAU);
          ctx.stroke();
        }
      } else if (e.type === 'bomber') {
        ctx.rotate(Math.sin(e.t * 3) * 0.12);
        ctx.fillStyle = white ? '#ffffff' : e.color;
        ctx.beginPath();
        ctx.moveTo(0, 18); ctx.lineTo(15, 4); ctx.lineTo(11, -14);
        ctx.lineTo(-11, -14); ctx.lineTo(-15, 4);
        ctx.closePath();
        ctx.fill();
        const glow = e.armed > 0 ? 1 : 0.35 + 0.25 * Math.sin(e.t * 8);
        ctx.fillStyle = 'rgba(255,90,40,' + glow.toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(0, 2, 7, 0, TAU);
        ctx.fill();
        ctx.fillStyle = '#fff0d0';
        ctx.beginPath();
        ctx.arc(0, 2, 3, 0, TAU);
        ctx.fill();
        if (e.armed > 0) {
          ctx.strokeStyle = 'rgba(255,90,60,0.55)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, 26 + (0.95 - Math.max(0, e.armed)) * 30, 0, TAU);
          ctx.stroke();
        }
      } else if (e.type === 'healer') {
        ctx.fillStyle = white ? '#ffffff' : e.color;
        ctx.beginPath();
        ctx.ellipse(-9, 0, 20, 9, -0.5, 0, TAU);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(9, 0, 20, 9, 0.5, 0, TAU);
        ctx.fill();
        ctx.fillStyle = white ? '#ffffff' : '#0b3a1e';
        ctx.fillRect(-2.5, -8, 5, 16);
        ctx.fillRect(-8, -2.5, 16, 5);
        const hp2 = e.healPulse > 0 ? 1 : 0.2;
        ctx.fillStyle = 'rgba(125,255,158,' + hp2.toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, TAU);
        ctx.fill();
      } else {
        ctx.fillStyle = white ? '#ffffff' : e.color;
        ctx.beginPath();
        ctx.moveTo(0, 22);
        ctx.lineTo(-16, 14);
        ctx.lineTo(-26, 2);
        ctx.lineTo(-22, -14);
        ctx.lineTo(-8, -10);
        ctx.lineTo(8, -10);
        ctx.lineTo(22, -14);
        ctx.lineTo(26, 2);
        ctx.lineTo(16, 14);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = white ? '#ffffff' : '#2b1400';
        ctx.fillRect(-10, -6, 20, 8);
        ctx.fillStyle = white ? '#ffffff' : 'rgba(255,90,40,0.95)';
        ctx.fillRect(-10, 6, 20, 3);

        if (e.hp < e.maxHp) {
          const w = 36;
          ctx.fillStyle = 'rgba(0,0,0,0.55)';
          ctx.fillRect(-w / 2, -26, w, 4);
          ctx.fillStyle = '#ff8a3d';
          ctx.fillRect(-w / 2, -26, w * Math.max(0, e.hp / e.maxHp), 4);
        }
      }

      ctx.restore();

      // 治疗机：绿色治疗光束
      if (e.type === 'healer' && e.healPulse > 0) {
        ctx.globalAlpha = Math.max(0, e.healPulse / 0.5) * 0.45;
        ctx.strokeStyle = '#7dff9e';
        ctx.lineWidth = 1.5;
        for (let j = 0; j < enemies.length; j++) {
          const o = enemies[j];
          if (o === e || o.dead || o.hp >= o.maxHp) continue;
          if (dist2(o, e) > 210 * 210) continue;
          ctx.beginPath();
          ctx.moveTo(e.x, e.y);
          ctx.lineTo(o.x, o.y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }

      if (e.type === 'sniper' && e.charge > 0) {
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        ctx.strokeStyle = 'rgba(255,90,60,' + (0.25 + (1 - e.charge / 0.65) * 0.55).toFixed(2) + ')';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([7, 9]);
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.x + Math.cos(a) * 520, e.y + Math.sin(a) * 520);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 护盾机：破盾后才显示血条
      if (e.type === 'guard' && e.shieldHp <= 0 && e.hp < e.maxHp) {
        const w = 36;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(e.x - w / 2, e.y - 36, w, 4);
        ctx.fillStyle = '#63d2ff';
        ctx.fillRect(e.x - w / 2, e.y - 36, w * Math.max(0, e.hp / e.maxHp), 4);
      }
    }
  }

  // 幽灵母舰的幻影分身（画在主体下层，半透明）
  function drawBossGhost(b, lx, ly, life) {
    const a = Math.min(0.55, Math.max(0, life) * 0.16);
    ctx.save();
    ctx.translate(lx, ly);
    ctx.globalAlpha = a;
    ctx.fillStyle = b.hot;
    ctx.beginPath();
    ctx.moveTo(0, 26);
    ctx.lineTo(-14, 8);
    ctx.lineTo(-26, 2);
    ctx.lineTo(-16, -12);
    ctx.lineTo(16, -12);
    ctx.lineTo(26, 2);
    ctx.lineTo(14, 8);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = a * 1.2;
    ctx.fillStyle = '#fff0f8';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawBoss() {
    if (!boss) return;
    const b = boss;
    const p3 = b.phase === 3;
    const p2 = b.phase >= 2;
    const blink = b.invuln > 0 && Math.floor(b.t * 16) % 2 === 0;
    const body = p3 ? '#ffe45e' : p2 ? b.hot : b.body;

    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.globalAlpha = blink ? 0.5 : 1;
    const white = b.flash > 0;

    // 幻影分身（v1.6）
    if (b.kind === 'wraith' && b.ghosts && b.ghosts.length) {
      for (let i = 0; i < b.ghosts.length; i++) {
        const g = b.ghosts[i];
        drawBossGhost(b, g.x - b.x, g.y - b.y, g.life);
      }
    }

    ctx.shadowColor = p3 ? 'rgba(255,220,110,0.98)' : p2 ? 'rgba(255,120,220,0.9)' : 'rgba(255,80,160,0.8)';
    ctx.shadowBlur = p3 ? 34 : p2 ? 28 : 20;
    ctx.fillStyle = white ? '#ffffff' : body;

    // 三种 Boss 三种轮廓
    if (b.kind === 'sentinel') {
      ctx.beginPath();
      for (let k = 0; k < 6; k++) {
        const a = -Math.PI / 2 + k * TAU / 6;
        const px = Math.cos(a) * 48, py = Math.sin(a) * 40;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    } else if (b.kind === 'devourer') {
      ctx.beginPath();
      ctx.moveTo(0, 44);
      ctx.lineTo(-20, 28);
      ctx.lineTo(-46, 20);
      ctx.lineTo(-38, -4);
      ctx.lineTo(-48, -22);
      ctx.lineTo(-16, -16);
      ctx.lineTo(0, -26);
      ctx.lineTo(16, -16);
      ctx.lineTo(48, -22);
      ctx.lineTo(38, -4);
      ctx.lineTo(46, 20);
      ctx.lineTo(20, 28);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(0, 40);
      ctx.lineTo(-22, 26);
      ctx.lineTo(-46, 14);
      ctx.lineTo(-40, -16);
      ctx.lineTo(-14, -22);
      ctx.lineTo(14, -22);
      ctx.lineTo(40, -16);
      ctx.lineTo(46, 14);
      ctx.lineTo(22, 26);
      ctx.closePath();
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // 环身盾牌（圣盾要塞，v1.6）
    if (b.kind === 'sentinel' && b.shields && b.broken <= 0) {
      for (let i = 0; i < b.shields.length; i++) {
        const s = b.shields[i];
        if (s.dead) continue;
        const p = bossShieldPos(b, i);
        const k = Math.max(0, s.hp / s.maxHp);
        ctx.save();
        ctx.translate(p.x - b.x, p.y - b.y);
        ctx.rotate(p.a + Math.PI / 2);
        ctx.shadowColor = '#9fe8ff';
        ctx.shadowBlur = 12;
        ctx.fillStyle = 'rgba(16,52,80,0.88)';
        ctx.strokeStyle = k > 0.55 ? '#c9f6ff' : k > 0.28 ? '#8fd8ff' : '#ff8fa3';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let q = 0; q < 6; q++) {
          const a2 = (q / 6) * TAU;
          const px = Math.cos(a2) * s.r, py = Math.sin(a2) * s.r;
          if (q === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;
        // 盾块自己的小血条
        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.fillRect(-12, s.r + 3, 24, 3);
        ctx.fillStyle = k > 0.35 ? '#9fe8ff' : '#ff8fa3';
        ctx.fillRect(-12, s.r + 3, 24 * k, 3);
        ctx.restore();
      }
    }

    // 吞噬领域（吞噬者张嘴时，v1.6）
    if (b.kind === 'devourer' && devourOpen(b)) {
      const R = devourRadius(b);
      const gr = ctx.createRadialGradient(0, 8, 8, 0, 8, R);
      gr.addColorStop(0, 'rgba(255,150,70,0.34)');
      gr.addColorStop(0.6, 'rgba(255,110,40,0.16)');
      gr.addColorStop(1, 'rgba(255,90,30,0)');
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.moveTo(0, 8);
      ctx.arc(0, 8, R, 0, Math.PI);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,180,90,0.75)';
      ctx.lineWidth = 2;
      for (let q = 0; q < 3; q++) {
        const a0 = b.t * 2.2 + q * 1.5;
        ctx.beginPath();
        ctx.arc(0, 8, R * (0.5 + 0.16 * q), a0, a0 + 0.85);
        ctx.stroke();
      }
    }

    // 二阶段外圈能量环 / 终局再加一层滚动虚线环
    if (p2) {
      const ring = 0.3 + Math.abs(Math.sin(b.t * (p3 ? 7 : 5))) * 0.4;
      ctx.strokeStyle = (p3 ? 'rgba(255,225,120,' : 'rgba(255,120,235,') + ring.toFixed(2) + ')';
      ctx.lineWidth = p3 ? 3.5 : 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, p3 ? 62 : 52, 0, TAU);
      ctx.stroke();
      if (p3) {
        ctx.strokeStyle = 'rgba(255,140,60,0.5)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([14, 10]);
        ctx.lineDashOffset = -b.t * 40;
        ctx.beginPath();
        ctx.arc(0, 0, 74, 0, TAU);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.lineDashOffset = 0;
      }
    }

    const pulse = 0.6 + Math.abs(Math.sin(b.t * (p3 ? 8 : 4))) * 0.4;
    ctx.fillStyle = white ? '#ffffff' : (p3 ? 'rgba(255,120,50,' : 'rgba(255,235,120,') + pulse.toFixed(2) + ')';
    ctx.beginPath();
    ctx.arc(0, 2, p3 ? 14 : 11, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#3a0a22';
    ctx.beginPath();
    ctx.arc(0, 2, p3 ? 6 : 5, 0, TAU);
    ctx.fill();

    ctx.fillStyle = '#2a0a1a';
    ctx.fillRect(-34, 8, 10, 14);
    ctx.fillRect(24, 8, 10, 14);
    if (p3) { ctx.fillRect(-14, 22, 8, 12); ctx.fillRect(6, 22, 8, 12); }

    ctx.restore();

    const bw = 300, bh = 9;
    const bx = (W - bw) / 2, by = 76;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(bx, by, bw, bh);
    const hpRatio = Math.max(0, b.hp / b.maxHp);
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    if (p3) { g.addColorStop(0, '#ffe45e'); g.addColorStop(1, '#ff6b3d'); }
    else if (p2) { g.addColorStop(0, b.hot); g.addColorStop(1, '#b46bff'); }
    else { g.addColorStop(0, b.body); g.addColorStop(1, b.accent); }
    ctx.fillStyle = g;
    ctx.fillRect(bx, by, bw * hpRatio, bh);

    // 66% / 33% 阶段分界线
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(bx + bw * 0.33 - 1, by, 2, bh);
    ctx.fillRect(bx + bw * 0.66 - 1, by, 2, bh);

    ctx.fillStyle = p3 ? '#fff0b0' : p2 ? '#ffd6f5' : '#ffd9e8';
    ctx.font = 'bold 11px ' + MONO;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('BOSS · ' + b.name + (p3 ? ' · 终局形态' : p2 ? ' · 第二阶段' : ''), W / 2, by - 6);
  }

  function drawBullets() {
    const hot = player.fireLevel >= 4 || combo >= 15;
    const hotCore = hot ? '#fff3c0' : '#eafcff';
    const hotGlow = hot ? 'rgba(255,205,90,0.34)' : 'rgba(120,230,255,0.30)';
    const hotTrail = hot ? 'rgba(255,205,90,0.45)' : 'rgba(150,240,255,0.45)';

    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      // 蓄力主炮：一根白色光柱（v1.2 新武器）
      if (b.rail) {
        const rg = ctx.createLinearGradient(0, b.y, 0, b.y + 150);
        rg.addColorStop(0, 'rgba(255,255,255,0.95)');
        rg.addColorStop(0.4, 'rgba(160,235,255,0.55)');
        rg.addColorStop(1, 'rgba(110,200,255,0)');
        ctx.fillStyle = rg;
        ctx.fillRect(b.x - 10, b.y, 20, 150);
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.fillRect(b.x - 3, b.y - 16, 6, 150);
        continue;
      }
      const tr = curTrail().id;
      let core = hotCore, glow = hotGlow, trail = hotTrail, ring = null;

      if (b.elem === 'burn') {
        core = '#ffe0b0'; glow = 'rgba(255,140,50,0.46)'; trail = 'rgba(255,110,40,0.58)'; ring = '#ff7a2f';
      } else if (b.elem === 'poison') {
        core = '#e2ffe8'; glow = 'rgba(110,255,140,0.46)'; trail = 'rgba(80,225,110,0.58)'; ring = '#4dff7a';
      } else if (b.elem === 'chain') {
        core = '#eafbff'; glow = 'rgba(110,210,255,0.52)'; trail = 'rgba(80,190,255,0.62)'; ring = '#5fd0ff';
      }

      ctx.fillStyle = trail;
      ctx.fillRect(b.x - b.r * 0.55, b.y, b.r * 1.1, 24);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r + (ring ? 6 : 4), 0, TAU);
      ctx.fill();
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.ellipse(b.x, b.y, b.r * 0.8, b.r * 1.6, 0, 0, TAU);
      ctx.fill();

      if (ring) {
        ctx.strokeStyle = ring;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r + 4, 0, TAU);
        ctx.stroke();

        // 叠满 3 层的进化弹：外圈脉动光环
        const up = (b.elem === 'burn' && perk('burn') >= 3)
          || (b.elem === 'poison' && perk('poison') >= 3)
          || (b.elem === 'chain' && perk('chain') >= 3);
        if (up) {
          ctx.globalAlpha = 0.8;
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r + 9 + Math.sin(performance.now() / 80) * 2, 0, TAU);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }

      // 弹道特效（成就奖励）：等离子拖尾光点 / 棱镜彩虹环
      if (tr === 'plasma') {
        for (let k = 1; k <= 3; k++) {
          ctx.globalAlpha = 0.30 / k;
          ctx.fillStyle = ring || '#bfeeff';
          ctx.beginPath();
          ctx.arc(b.x, b.y + k * 9, Math.max(1.5, b.r - k * 1.2), 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      } else if (tr === 'prism') {
        const hue = (performance.now() / 12 + i * 41) % 360;
        ctx.strokeStyle = 'hsl(' + hue.toFixed(0) + ',100%,70%)';
        ctx.lineWidth = 1.6;
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r + 7, 0, TAU);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawEnemyBullets() {
    for (let i = 0; i < enemyBullets.length; i++) {
      const b = enemyBullets[i];
      ctx.fillStyle = b.color;
      ctx.globalAlpha = 0.28;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r + 4, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.25, b.y - b.r * 0.25, b.r * 0.42, 0, TAU);
      ctx.fill();
    }
  }

  function drawMissiles() {
    for (let i = 0; i < missiles.length; i++) {
      const m = missiles[i];

      // 拖尾光点（越靠后越小越淡）
      const tr = m.trail || [];
      for (let k = 0; k < tr.length; k++) {
        const a = (k + 1) / tr.length;
        ctx.fillStyle = 'rgba(255,175,95,' + (a * 0.30).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(tr[k].x, tr[k].y, 1.4 + a * 3, 0, TAU);
        ctx.fill();
      }

      const ang = Math.atan2(m.vy, m.vx);
      ctx.save();
      ctx.translate(m.x, m.y);
      ctx.rotate(ang + Math.PI / 2);

      // 尾焰比原来长一截
      const g = ctx.createLinearGradient(0, 2, 0, 34);
      g.addColorStop(0, 'rgba(255,240,175,0.95)');
      g.addColorStop(0.45, 'rgba(255,150,60,0.75)');
      g.addColorStop(1, 'rgba(255,70,40,0)');
      ctx.fillStyle = g;
      ctx.fillRect(-4, 2, 8, 32);

      ctx.shadowColor = '#ffb060';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#ffe8c0';
      ctx.beginPath();
      ctx.moveTo(0, -9);
      ctx.lineTo(4.5, 4);
      ctx.lineTo(-4.5, 4);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }

  function drawLaser() {
    if (laserTime <= 0) return;
    const up = perk('bombUp');
    const w = laserHalfW() * 2 + Math.sin(performance.now() / 35) * 7;
    const top = 0;
    const bottom = player.y;

    const g = ctx.createLinearGradient(0, bottom, 0, top);
    g.addColorStop(0, up > 0 ? 'rgba(255,250,210,0.98)' : 'rgba(200,255,255,0.95)');
    g.addColorStop(0.35, up > 0 ? 'rgba(255,220,120,0.72)' : 'rgba(110,225,255,0.7)');
    g.addColorStop(1, up > 0 ? 'rgba(255,170,60,0.12)' : 'rgba(90,190,255,0.10)');
    ctx.fillStyle = g;
    ctx.fillRect(player.x - w / 2, top, w, bottom);

    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.fillRect(player.x - w / 7, top, (w / 7) * 2, bottom);

    ctx.globalAlpha = 0.3;
    ctx.fillStyle = up > 0 ? 'rgba(255,200,80,0.6)' : 'rgba(120,230,255,0.6)';
    ctx.fillRect(player.x - w, top, w * 2, bottom);
    ctx.globalAlpha = 1;

    // 弹药强化后的金色边缘
    if (up > 0) {
      ctx.strokeStyle = 'rgba(255,225,120,0.85)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(player.x - w / 2, top);
      ctx.lineTo(player.x - w / 2, bottom);
      ctx.moveTo(player.x + w / 2, top);
      ctx.lineTo(player.x + w / 2, bottom);
      ctx.stroke();
    }
  }

  function drawPowerups() {
    for (let i = 0; i < powerups.length; i++) {
      const p = powerups[i];
      const color = p.type === 'P' ? '#5fd0ff' : p.type === 'S' ? '#8affc1' : '#ff7ab8';
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.sin(p.t * 2.4) * 0.25);

      ctx.shadowColor = color;
      ctx.shadowBlur = 14;
      ctx.fillStyle = 'rgba(8,16,30,0.9)';
      ctx.beginPath();
      ctx.moveTo(0, -p.r);
      ctx.lineTo(p.r, 0);
      ctx.lineTo(0, p.r);
      ctx.lineTo(-p.r, 0);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.fillStyle = color;
      ctx.font = 'bold 14px ' + MONO;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.type, 0, 1);
      ctx.restore();
    }
  }

  function drawParticles() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      const s = p.size * (p.life / p.max);
      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
  }

  function drawRings() {
    for (let i = 0; i < rings.length; i++) {
      const r = rings[i];
      const a = Math.max(0, r.life / r.max);
      ctx.strokeStyle = r.color;
      ctx.globalAlpha = a * 0.8;
      ctx.lineWidth = 1.5 + a * 3.5;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, TAU);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawFloaters() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 15px ' + MONO;
    for (let i = 0; i < floaters.length; i++) {
      const f = floaters[i];
      ctx.globalAlpha = Math.max(0, f.life / f.max);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawPoison() {
    const now = performance.now() / 1000;
    for (let i = 0; i < poisonClouds.length; i++) {
      const c = poisonClouds[i];
      const a = Math.max(0, c.life / c.max);

      // 内部浓度
      const g = ctx.createRadialGradient(c.x, c.y, 4, c.x, c.y, c.r);
      g.addColorStop(0, 'rgba(120,255,140,' + (0.22 * a).toFixed(3) + ')');
      g.addColorStop(0.6, 'rgba(90,235,120,' + (0.10 * a).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(60,200,90,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, TAU);
      ctx.fill();

      // 边界：外圈实线 + 内圈滚动虚线，一眼看清范围
      ctx.strokeStyle = 'rgba(150,255,170,' + (0.55 * a).toFixed(3) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r - 1, 0, TAU);
      ctx.stroke();

      ctx.setLineDash([11, 9]);
      ctx.lineDashOffset = -now * 46 - (c.seed || 0) * 6;
      ctx.strokeStyle = 'rgba(205,255,215,' + (0.85 * a).toFixed(3) + ')';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r - 6, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineDashOffset = 0;

      // 边缘游走的孢子光点
      const n = 10;
      for (let k = 0; k < n; k++) {
        const ang = now * 0.9 + (k * TAU) / n + (c.seed || 0);
        const px = c.x + Math.cos(ang) * c.r;
        const py = c.y + Math.sin(ang) * c.r;
        const pr = 1.8 + Math.sin(now * 3 + k) * 0.9;
        ctx.fillStyle = 'rgba(190,255,205,' + (0.6 * a).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(px, py, pr, 0, TAU);
        ctx.fill();
      }
    }
  }

  function drawBolts() {
    ctx.lineJoin = 'round';
    for (let i = 0; i < bolts.length; i++) {
      const b = bolts[i];
      const a = Math.max(0, b.life / b.max);
      for (let L = 0; L < 3; L++) {
        ctx.strokeStyle = L === 0 ? '#3aa8ff' : L === 1 ? '#8fe6ff' : '#ffffff';
        ctx.globalAlpha = a * (L === 0 ? 0.18 : L === 1 ? 0.55 : 0.95);
        ctx.lineWidth = L === 0 ? 9 : L === 1 ? 4 : 1.6;
        ctx.beginPath();
        for (let s = 0; s < b.pts.length; s++) {
          const p = b.pts[s];
          if (s === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        for (let k = 0; k < b.branches.length; k++) {
          const br = b.branches[k];
          ctx.beginPath();
          ctx.moveTo(br.x1, br.y1);
          ctx.lineTo(br.x2, br.y2);
          ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  // ============================================================
  //  HUD
  // ============================================================
  function drawHUD() {
    const g = ctx.createLinearGradient(0, 0, 0, 112);
    g.addColorStop(0, 'rgba(3,8,20,0.88)');
    g.addColorStop(1, 'rgba(3,8,20,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, 112);

    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#eaf6ff';
    ctx.font = 'bold 24px ' + MONO;
    ctx.fillText(pad5(score), 16, 10);

    ctx.fillStyle = '#5f8bb0';
    ctx.font = '11px ' + MONO;
    ctx.fillText('BEST ' + pad5(best), 17, 38);

    ctx.fillStyle = '#8affc1';
    ctx.font = 'bold 12px ' + MONO;
    ctx.fillText('LV.' + level, 16, 60);

    const px = 62, py = 63, pw = 84, ph = 5;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = level >= MAX_LEVEL ? '#ffd34d' : '#8affc1';
    ctx.fillRect(px, py, pw * Math.min(1, xp / xpNext), ph);

    ctx.textAlign = 'right';
    ctx.fillStyle = player.fireLevel > 1 ? '#ffd34d' : '#5f8bb0';
    ctx.font = 'bold 12px ' + MONO;
    ctx.fillText('WPN ' + player.fireLevel, W - 16, 12);

    for (let i = 0; i < player.lives; i++) {
      const lx = W - 24 - i * 20;
      const ly = 40;
      ctx.save();
      ctx.translate(lx, ly);
      ctx.scale(0.42, 0.42);
      ctx.fillStyle = '#9fe8ff';
      ctx.beginPath();
      ctx.moveTo(0, -24);
      ctx.lineTo(8, -4);
      ctx.lineTo(19, 9);
      ctx.lineTo(8, 6);
      ctx.lineTo(6, 17);
      ctx.lineTo(-6, 17);
      ctx.lineTo(-8, 6);
      ctx.lineTo(-19, 9);
      ctx.lineTo(-8, -4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    if (player.shield > 0) {
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(110,215,255,0.9)';
      ctx.font = 'bold 11px ' + MONO;
      ctx.fillText('SHIELD ' + player.shield.toFixed(1) + 's', W / 2, 12);
    }

    // 局外「开局装甲」剩余次数（v1.6）
    if (player.guard > 0) {
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,211,77,0.92)';
      ctx.font = 'bold 11px ' + MONO;
      ctx.fillText('ARMOR ' + player.guard, W / 2, player.shield > 0 ? 26 : 12);
    }

    const cells = 3, cellW = 30, cellGap = 3, ebx = 16, eby = 78, ebh = 8;
    const isLaser = perk('laser') > 0;
    const ready = Math.floor(bombCharge / 100);
    const color = isLaser ? '#9fe8ff' : '#ffe45e';

    for (let i = 0; i < cells; i++) {
      const x = ebx + i * (cellW + cellGap);
      const c = clamp((bombCharge - i * 100) / 100, 0, 1);
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.fillRect(x, eby, cellW, ebh);
      if (c > 0) {
        ctx.fillStyle = color;
        ctx.fillRect(x, eby, cellW * c, ebh);
      }
      ctx.strokeStyle = c >= 1 ? color : 'rgba(120,180,220,0.30)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, eby + 0.5, cellW - 1, ebh - 1);
    }

    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = 'bold 10px ' + MONO;
    ctx.fillStyle = ready > 0 ? color : '#5f8bb0';
    ctx.fillText(
      ready > 0 ? (isLaser ? 'LASER x' + ready + '  [空格]' : 'BOMB x' + ready + '  [空格]')
                : (isLaser ? 'LASER ' : 'BOMB ') + Math.floor(bombCharge % 100) + '%',
      ebx, eby + 11
    );

    // 元素弹概率
    const elemStacks = perk('burn') + perk('poison') + perk('chain');

  function wrapText(text, maxChars) {
    const out = [];
    let line = '';
    for (let i = 0; i < text.length; i++) {
      line += text[i];
      if (line.length >= maxChars) { out.push(line); line = ''; }
    }
    if (line) out.push(line);
    return out;
  }

  function adjustSetting(dir) {
    if (settingIndex === 0) {
      settings.volume = clamp(settings.volume + dir * 0.1, 0, 1);
      if (masterGain) masterGain.gain.value = settings.volume;
      sfx.pickup();
    } else if (settingIndex === 1) {
      settings.music = !settings.music;
      bgmOn = settings.music;
      if (bgmOn) startBGM(); else stopBGM();
    } else if (settingIndex === 2) {
      settings.density = clamp(settings.density + dir * 0.25, 0.5, 2);
    } else {
      settings.vibrate = !settings.vibrate;
      vibrate(40);   // 开启后立刻抖一下，方便确认
    }
  }

  // ============================================================
  //  渲染
  // ============================================================
  // 僚机
  function drawDrones() {
    const n = droneCount();
    if (n <= 0) return;
    for (let i = 0; i < n; i++) {
      const a = droneAngle + i * (TAU / n);
      const dx = player.x + Math.cos(a) * 36;
      const dy = player.y + Math.sin(a) * 24 - 4;
      ctx.save();
      ctx.translate(dx, dy);
      ctx.rotate(a + Math.PI / 2);
      ctx.fillStyle = '#8affc1';
      ctx.shadowColor = '#8affc1';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(0, -8); ctx.lineTo(6, 6); ctx.lineTo(0, 3); ctx.lineTo(-6, 6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.shadowBlur = 0;
  }

  // 蓄力主炮（v1.2 新武器）
  function drawRailCharge() {
    if (railCharge <= 0) return;
    const R = 16 + railCharge * 22;
    ctx.save();
    ctx.globalAlpha = 0.22 + railCharge * 0.6;
    ctx.strokeStyle = '#9fe8ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.x, player.y - 6, R, -Math.PI / 2, -Math.PI / 2 + TAU * railCharge);
    ctx.stroke();
    ctx.fillStyle = 'rgba(180,240,255,0.85)';
    ctx.beginPath();
    ctx.arc(player.x, player.y - 26, 2 + railCharge * 4, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // 成就提示条
  function drawToasts() {
    // 技能树 / 商店 / 每日任务内容占满上半屏，提示条改到下方，避免挡住卡片
    const baseY = (gameState === 'meta' || gameState === 'shop' || gameState === 'missions')
      ? Math.round(H - 140) : 168;
    for (let i = 0; i < toasts.length; i++) {
      const t = toasts[i];
      const a = Math.max(0, Math.min(1, t.life / 0.5));
      ctx.globalAlpha = a;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const w = Math.min(540, 40 + t.text.length * 13);
      const y = baseY + i * 34;
      ctx.fillStyle = 'rgba(8,16,30,0.94)';
      ctx.fillRect(W / 2 - w / 2, y - 13, w, 26);
      ctx.strokeStyle = t.color;
      ctx.lineWidth = 1.2;
      ctx.strokeRect(W / 2 - w / 2 + 0.5, y - 12.5, w - 1, 25);
      ctx.fillStyle = t.color;
      ctx.font = 'bold 13px ' + FONT;
      ctx.fillText(t.text, W / 2, y);
    }
    ctx.globalAlpha = 1;
  }

    ctx.beginPath();
    ctx.arc(W - 34, 34, 20, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(180,225,255,0.9)';
    ctx.fillRect(W - 41, 26, 5, 16);
    ctx.fillRect(W - 32, 26, 5, 16);
