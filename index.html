  // 成就 + 本地排行榜 + 每日 7 天（v1.2 分两页，← → 切换）
  function drawStats() {
    ctx.fillStyle = 'rgba(3,7,16,0.96)';
    ctx.fillRect(0, 0, W, H);

    const page = statsPage % 3;
    const title = page === 0 ? '排行榜' : page === 1 ? '成就墙' : '每日挑战 · 近 7 天';

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#a9ecff';
    ctx.font = 'bold 26px ' + FONT;
    ctx.fillText(title, W / 2, 42);

    ctx.fillStyle = '#5f8bb0';
    ctx.font = '11px ' + MONO;
    ctx.fillText('成就 ' + achvCount() + '/' + ACHIEVEMENTS.length
      + '   ·   皮肤 ' + ownedSkinCount() + '/' + SKINS.length
      + '   ·   弹道 ' + ownedTrailCount() + '/' + TRAILS.length
      + '   ·   战绩 ' + runs.length + ' 场', W / 2, 70);

    // 右下角页码点（放顶部，避免和每日页的底部统计撞车）
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i === page ? '#ffd34d' : 'rgba(120,180,220,0.28)';
      ctx.beginPath();
      ctx.arc(W - 58 + i * 13, 34, 3.2, 0, TAU);
      ctx.fill();
    }

    if (page === 0) drawStatsBoard();
    else if (page === 1) drawStatsAchievements();
    else drawStatsDaily();

    ctx.textAlign = 'center';
    ctx.fillStyle = '#5f8bb0';
    ctx.font = '12px ' + FONT;
    ctx.fillText('← / → 翻页' + (page === 0 ? '  ·  1 / 2 / 3 切换榜单' : '')
      + '  ·  Tab / Esc 返回', W / 2, H - 22);
  }

  // 第 1 页：排行榜（总分 / 击杀 / 连击 三个榜共用一份战绩）
  function drawStatsBoard() {
    const tabW = 118, tabH = 30, gap = 9;
    const tx0 = Math.round((W - (BOARD_TABS.length * tabW + (BOARD_TABS.length - 1) * gap)) / 2);
    boardTabs = [];
    for (let i = 0; i < BOARD_TABS.length; i++) {
      const r = { x: tx0 + i * (tabW + gap), y: 90, w: tabW, h: tabH };
      boardTabs.push(r);
      const on = i === boardTab;
      const c = BOARD_TABS[i].color;
      ctx.fillStyle = on ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.03)';
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.strokeStyle = on ? c : 'rgba(120,180,220,0.30)';
      ctx.lineWidth = on ? 2 : 1;
      ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = on ? c : '#7d9ab3';
      ctx.font = 'bold 13px ' + FONT;
      ctx.fillText(BOARD_TABS[i].name + '榜', r.x + r.w / 2, r.y + 15);
    }

    const tabInfo = BOARD_TABS[boardTab];
    const key = tabInfo.id;
    const list = boardTop(key, BOARD_SIZE);
    const hx = 46, hw = W - 92;

    // 表头
    ctx.textBaseline = 'middle';
    ctx.font = '10px ' + MONO;
    ctx.fillStyle = '#3d5a75';
    ctx.textAlign = 'left';
    ctx.fillText('名次', 54, 132);
    ctx.textAlign = 'right';
    ctx.fillText(tabInfo.name, 196, 132);
    ctx.textAlign = 'left';
    ctx.fillText('等级', 228, 132);
    ctx.fillText('用时', 286, 132);
    ctx.fillText('日期', 356, 132);
    ctx.fillText('击杀 / Boss / 连击', 440, 132);

    const rowH = 26;
    const y0 = 150;
    for (let i = 0; i < BOARD_SIZE; i++) {
      const y = y0 + i * rowH;
      const r = list[i];
      const mine = !!r && lastRunId > 0 && r.id === lastRunId;

      ctx.fillStyle = mine ? 'rgba(255,211,77,0.18)'
        : i === 0 ? 'rgba(255,211,77,0.08)'
        : (i % 2 ? 'rgba(255,255,255,0.022)' : 'rgba(255,255,255,0.05)');
      ctx.fillRect(hx, y - rowH / 2 + 1, hw, rowH - 2);
      if (mine) {
        ctx.strokeStyle = 'rgba(255,211,77,0.85)';
        ctx.lineWidth = 1.4;
        ctx.strokeRect(hx + 0.5, y - rowH / 2 + 1.5, hw - 1, rowH - 3);
      }

      if (!r) {
        ctx.textAlign = 'center';
        ctx.fillStyle = '#2b4257';
        ctx.font = '11px ' + MONO;
        ctx.fillText(i === 0 ? '还没有战绩，开一局吧' : '· · ·', hx + hw / 2, y);
        continue;
      }

      // 名次（前三名金/银/铜）
      const rankCol = i === 0 ? '#ffd34d' : i === 1 ? '#cfe6ff' : i === 2 ? '#ff9a3c' : '#5f8bb0';
      ctx.textAlign = 'left';
      ctx.font = 'bold 13px ' + MONO;
      ctx.fillStyle = rankCol;
      ctx.fillText('#' + (i + 1), 54, y);

      // 主数值：按当前榜不同
      let main, unit = '';
      if (key === 'score') main = pad5(r.score);
      else if (key === 'kills') { main = String(r.kills); unit = '杀'; }
      else { main = String(r.combo); unit = '连'; }
      ctx.textAlign = 'right';
      ctx.font = 'bold 14px ' + MONO;
      ctx.fillStyle = i < 3 ? '#ffffff' : '#cfe6ff';
      ctx.fillText(main, 196, y);
      if (unit) {
        ctx.textAlign = 'left';
        ctx.font = '10px ' + MONO;
        ctx.fillStyle = '#7d9ab3';
        ctx.fillText(unit, 198, y + 1);
      }

      ctx.textAlign = 'left';
      ctx.font = '11px ' + MONO;
      ctx.fillStyle = '#8affc1';
      ctx.fillText('LV.' + r.level, 228, y);

      ctx.fillStyle = '#5f8bb0';
      ctx.fillText(Math.floor(r.time / 60) + 'm' + (r.time % 60) + 's', 286, y);
      ctx.fillText(r.date ? r.date.slice(5) : '—', 356, y);

      ctx.fillStyle = '#cfe6ff';
      ctx.font = '10px ' + MONO;
      ctx.fillText(r.kills + ' / ' + r.boss + ' / ' + r.combo, 440, y);

      // 皮肤色标
      const si = findIdx(SKINS, r.skin);
      ctx.fillStyle = si >= 0 ? SKINS[si].body : '#7d9ab3';
      ctx.beginPath();
      ctx.arc(548, y, 3.4, 0, TAU);
      ctx.fill();

      // 每日局标记
      if (r.daily) {
        ctx.textAlign = 'center';
        ctx.font = 'bold 9px ' + MONO;
        ctx.fillStyle = '#ffd34d';
        ctx.fillText('D', 570, y);
      }
    }

    // 底部汇总
    const statY = y0 + BOARD_SIZE * rowH + 18;
    ctx.textAlign = 'center';
    ctx.font = '11px ' + MONO;
    ctx.fillStyle = '#5f8bb0';
    ctx.fillText('累计击杀 ' + totalKills + ' · Boss ' + totalBosses
      + ' · 最高分 ' + pad5(best) + ' · 战绩 ' + runs.length + ' 场', W / 2, statY);

    if (lastRunRank > 0 && lastRunRank <= BOARD_SIZE) {
      ctx.fillStyle = '#ffd34d';
      ctx.font = 'bold 12px ' + FONT;
      ctx.fillText('★ 本局总分榜第 ' + lastRunRank + ' 名', W / 2, statY + 22);
    }
  }

  // 第 2 页：成就墙（20 条两列，带描述）
  function drawStatsAchievements() {
    const perCol = Math.ceil(ACHIEVEMENTS.length / 2);
    const gridTop = Math.max(110, Math.round(H * 0.17));
    const rowH = Math.min(40, Math.floor((H - 100 - gridTop) / perCol));

    for (let i = 0; i < ACHIEVEMENTS.length; i++) {
      const a = ACHIEVEMENTS[i];
      const got = !!achvSet[a.id];
      const col = i >= perCol ? 1 : 0;
      const row = i % perCol;
      const x = 50 + col * 254;
      const y = gridTop + row * rowH;

      ctx.fillStyle = got ? 'rgba(255,211,77,0.10)' : 'rgba(255,255,255,0.03)';
      ctx.fillRect(x, y - 15, 240, Math.max(28, rowH - 4));
      if (got) {
        ctx.strokeStyle = 'rgba(255,211,77,0.35)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y - 14.5, 239, Math.max(28, rowH - 4) - 1);
      }
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 12px ' + FONT;
      ctx.fillStyle = got ? '#ffd34d' : '#4a657d';
      ctx.fillText((got ? '★ ' : '☆ ') + a.name, x + 8, y - 2);
      ctx.font = '10px ' + FONT;
      ctx.fillStyle = got ? '#a8c4dd' : '#33495c';
      ctx.fillText(a.desc, x + 8, y + 13);
    }

    const done = achvCount();
    ctx.textAlign = 'center';
    ctx.font = 'bold 12px ' + MONO;
    ctx.fillStyle = done >= ACHIEVEMENTS.length ? '#ffd34d' : '#5f8bb0';
    ctx.fillText('成就完成 ' + done + ' / ' + ACHIEVEMENTS.length, W / 2, H - 58);
  }

  function drawStatsDaily() {
    const rec = dailyRec();
    const hist = dailyHistory(rec);
    const range = dailyRange(rec);
    const today = dayKey();
    const streak = dailyStreak(rec);

    let total = 0, bestScore = 0, bestDate = '';
    for (let i = 0; i < hist.length; i++) {
      total += hist[i].score;
      if (hist[i].score >= bestScore) { bestScore = hist[i].score; bestDate = hist[i].date; }
    }

    const x = 46, w = W - 92;

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffd34d';
    ctx.font = 'bold 12px ' + MONO;
    ctx.fillText('近 7 天记录（今天 → 6 天前）', x, 100);

    const slotTop = 126;
    for (let i = 0; i < DAILY_KEEP; i++) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const key = dayKey(d);
      const v = rec[key];
      const y = slotTop + i * 34;
      const isToday = key === today;

      ctx.fillStyle = isToday ? 'rgba(255,211,77,0.12)' : 'rgba(255,255,255,0.035)';
      ctx.fillRect(x, y - 14, w, 28);

      ctx.textAlign = 'left';
      ctx.font = 'bold 12px ' + MONO;
      ctx.fillStyle = v ? (isToday ? '#ffd34d' : '#cfe6ff') : '#2b4257';
      ctx.fillText(key.slice(5) + (isToday ? ' · 今天' : ''), x + 12, y);

      if (v) {
        const rk = range.find(function (o) { return o.date === key; });
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(pad5(v.score), x + w - 128, y);

        ctx.textAlign = 'left';
        ctx.font = '11px ' + MONO;
        ctx.fillStyle = '#8affc1';
        ctx.fillText('LV.' + (v.level || 1), x + w - 114, y);

        ctx.textAlign = 'right';
        ctx.fillStyle = rk && rk.rank === 1 ? '#ffd34d' : '#5f8bb0';
        ctx.fillText(rk ? ('区间 #' + rk.rank) : '—', x + w - 12, y);
      } else {
        ctx.textAlign = 'right';
        ctx.fillStyle = '#2b4257';
        ctx.fillText('未挑战', x + w - 12, y);
      }
    }

    const ry = slotTop + DAILY_KEEP * 34 + 16;
    ctx.textAlign = 'left';
    ctx.font = 'bold 12px ' + MONO;
    ctx.fillStyle = '#ffd34d';
    ctx.fillText('区间排行（近 7 天按分数）', x, ry);

    const maxS = Math.max(1, range.length ? range[0].score : 1);
    for (let i = 0; i < range.length; i++) {
      const o = range[i];
      const y = ry + 26 + i * 30;
      ctx.fillStyle = i === 0 ? 'rgba(255,211,77,0.14)' : 'rgba(255,255,255,0.04)';
      ctx.fillRect(x, y - 13, w, 26);
      ctx.textAlign = 'left';
      ctx.font = 'bold 12px ' + MONO;
      ctx.fillStyle = i === 0 ? '#ffd34d' : '#8ab0cc';
      ctx.fillText('#' + (i + 1), x + 12, y);
      ctx.fillStyle = '#cfe6ff';
      ctx.fillText(o.date.slice(5), x + 46, y);

      const bw2 = Math.round(230 * (o.score / maxS));
      ctx.fillStyle = i === 0 ? 'rgba(255,211,77,0.55)' : 'rgba(110,215,255,0.35)';
      ctx.fillRect(x + 116, y - 6, Math.max(2, bw2), 12);

      ctx.textAlign = 'right';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(pad5(o.score), x + w - 12, y);
    }

    if (!range.length) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#2b4257';
      ctx.font = '12px ' + FONT;
      ctx.fillText('还没有每日挑战记录，按 D 开一局', W / 2, ry + 46);
    }

    const fy = ry + 26 + Math.max(1, range.length) * 30 + 14;
    ctx.textAlign = 'center';
    ctx.font = '12px ' + MONO;
    ctx.fillStyle = '#5f8bb0';
    ctx.fillText('7 天合计 ' + pad5(total) + '   ·   连续 ' + streak + ' 天   ·   区间最佳 ' +
      (bestDate ? bestDate.slice(5) + ' ' + pad5(bestScore) : '—'), W / 2, Math.min(H - 44, fy));
  }

  // ============================================================
  //  局外：技能树 / 商店（v1.3）
  // ============================================================
  function moveMeta(dc, dr) {
    const cur = META_NODES[metaSel];
    let best = -1, bd = 1e9;
    for (let i = 0; i < META_NODES.length; i++) {
      if (i === metaSel) continue;
      const n = META_NODES[i];
      const dcol = n.col - cur.col, drow = n.row - cur.row;
      if (dc !== 0 && (drow !== 0 || Math.sign(dcol) !== dc)) continue;
      if (dr !== 0 && (dcol !== 0 || Math.sign(drow) !== dr)) continue;
      const d = Math.abs(dcol) + Math.abs(drow);
      if (d > 0 && d < bd) { bd = d; best = i; }
    }
    if (best >= 0) metaSel = best;
  }

  function moveShop(dc, dr) {
    const cols = 3;
    const c = shopSel % cols, r = Math.floor(shopSel / cols);
    let nc = c + dc, nr = r + dr;
    if (nc < 0 || nc >= cols) nc = c;
    if (nr < 0) nr = r;
    const maxRow = Math.floor((SKINS.length - 1) / cols);
    if (nr > maxRow) nr = r;
    const idx = nr * cols + nc;
    if (idx >= 0 && idx < SKINS.length) shopSel = idx;
  }

  function shopAct(s) {
    if (skinOwned(s)) {
      if (curSkin().id === s.id) return;
      equipSkin(s);
      toasts.push({ text: '已装备 · ' + s.name, life: 1.4, max: 1.4, color: '#9fe8ff' });
      sfx.cardPick();
    } else if (skinIsStore(s)) {
      if (dust < s.cost) {
        sfx.warn();
        toasts.push({ text: '星元不够，还差 ' + (s.cost - dust), life: 1.6, max: 1.6, color: '#ff8fa3' });
        return;
      }
      if (buySkin(s)) {
        equipSkin(s);
        toasts.push({ text: '购买并装备 · ' + s.name, life: 1.9, max: 1.9, color: '#ffd34d' });
      }
    } else {
      const a = ACHI_BY_ID[s.need];
      sfx.warn();
      toasts.push({ text: '成就解锁：' + (a ? a.name : s.need), life: 1.8, max: 1.8, color: '#ffd34d' });
    }
  }

  function drawSkinIcon(x, y, s, sc) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sc, sc);

    // 尾焰
    const g0 = ctx.createLinearGradient(0, 12, 0, 36);
    g0.addColorStop(0, s.flame || s.body);
    g0.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g0;
    ctx.beginPath();
    ctx.moveTo(-4.5, 13); ctx.lineTo(4.5, 13); ctx.lineTo(0, 34);
    ctx.closePath();
    ctx.fill();

    // 和游戏内同一套机身路径
    const RP = [[0, -27], [5, -11], [12, -7], [23, 3], [22, 11], [9, 9], [7, 19]];
    const bg = ctx.createLinearGradient(0, -27, 0, 19);
    bg.addColorStop(0, s.trim);
    bg.addColorStop(0.2, s.body);
    bg.addColorStop(1, s.core);
    ctx.fillStyle = bg;
    ctx.shadowColor = s.glow;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(RP[0][0], RP[0][1]);
    for (let i = 1; i < RP.length; i++) ctx.lineTo(RP[i][0], RP[i][1]);
    ctx.lineTo(0, 15.5);
    for (let i = RP.length - 1; i >= 1; i--) ctx.lineTo(-RP[i][0], RP[i][1]);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = s.trim;
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // 装饰色块（按皮肤区分，图标里只画一小笔）
    ctx.fillStyle = s.trim;
    if (s.deco === 'wing') {
      ctx.beginPath(); ctx.moveTo(-22, 4); ctx.lineTo(-32, 0); ctx.lineTo(-21, 10); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(22, 4); ctx.lineTo(32, 0); ctx.lineTo(21, 10); ctx.closePath(); ctx.fill();
    } else if (s.deco === 'crystal') {
      for (let m = -1; m <= 1; m += 2) {
        ctx.beginPath();
        for (let k = 0; k < 6; k++) {
          const a = k * TAU / 6 + Math.PI / 6;
          const px = m * 16 + Math.cos(a) * 4.5, py = 2 + Math.sin(a) * 4.5;
          if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.stroke();
      }
    } else if (s.deco === 'orb') {
      ctx.beginPath(); ctx.arc(-16, 2, 2.8, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(16, 2, 2.8, 0, TAU); ctx.fill();
    } else if (s.deco === 'blade') {
      ctx.strokeStyle = s.trim;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(-23, 3); ctx.lineTo(-13, -11);
      ctx.moveTo(23, 3); ctx.lineTo(13, -11);
      ctx.stroke();
    }

    ctx.fillStyle = s.core;
    ctx.beginPath();
    ctx.ellipse(0, -8, 4.2, 7.4, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = s.eye;
    ctx.beginPath();
    ctx.ellipse(-1.1, -10.4, 1.5, 2.8, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawMeta() {
    ctx.fillStyle = 'rgba(3,7,16,0.97)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#a9ecff';
    ctx.font = 'bold 26px ' + FONT;
    ctx.fillText('技能树', W / 2, 40);

    ctx.fillStyle = '#8affc1';
    ctx.font = 'bold 15px ' + MONO;
    ctx.fillText('★ 星元 ' + dust, W / 2, 68);

    ctx.fillStyle = '#5f8bb0';
    ctx.font = '11px ' + FONT;
    ctx.fillText('击杀敌人赚星元 · 升级永久生效 · Esc 返回', W / 2, 92);
    drawBackBtn();

    const nx = [36, 226, 416];
    const nw = 150, nh = 62;
    const y0 = Math.max(150, Math.round(H * 0.235));
    const rowH = H > 900 ? 96 : 78;

    // 前置连线（先画，节点会盖住线头）
    for (let i = 0; i < META_NODES.length; i++) {
      const n = META_NODES[i];
      if (!n.need) continue;
      const p = META_BY_ID[n.need[0]];
      if (!p) continue;
      const x1 = nx[p.col] + nw / 2, y1 = y0 + p.row * rowH + nh / 2;
      const x2 = nx[n.col] + nw / 2, y2 = y0 + n.row * rowH + nh / 2;
      const ok = mlv(p.id) >= n.need[1];
      ctx.strokeStyle = ok ? 'rgba(138,255,193,0.55)' : 'rgba(90,120,145,0.32)';
      ctx.lineWidth = ok ? 2.5 : 1.5;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    metaRects = [];
    for (let i = 0; i < META_NODES.length; i++) {
      const n = META_NODES[i];
      const x = nx[n.col], y = y0 + n.row * rowH;
      metaRects.push({ x: x, y: y, w: nw, h: nh });
      const lv = mlv(n.id);
      const maxed = lv >= n.max;
      const unlocked = metaUnlocked(n);
      const sel = i === metaSel;
      const can = metaCanUp(n);

      ctx.fillStyle = sel ? 'rgba(95,208,255,0.16)' : maxed ? 'rgba(138,255,193,0.10)' : 'rgba(10,18,34,0.94)';
      ctx.fillRect(x, y, nw, nh);
      ctx.strokeStyle = sel ? '#9fe8ff' : maxed ? '#8affc1' : unlocked ? 'rgba(120,180,220,0.5)' : 'rgba(70,95,115,0.45)';
      ctx.lineWidth = sel ? 2 : 1.2;
      ctx.strokeRect(x + 0.5, y + 0.5, nw - 1, nh - 1);

      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 13px ' + FONT;
      ctx.fillStyle = unlocked ? (maxed ? '#8affc1' : '#eaf6ff') : '#4a657d';
      ctx.fillText(n.name, x + 10, y + 18);

      ctx.font = '11px ' + MONO;
      ctx.fillStyle = unlocked ? '#8affc1' : '#4a657d';
      ctx.fillText('Lv ' + lv + '/' + n.max, x + 10, y + 38);

      ctx.textAlign = 'right';
      ctx.font = 'bold 11px ' + MONO;
      if (maxed) {
        ctx.fillStyle = '#8affc1';
        ctx.fillText('MAX', x + nw - 10, y + 38);
      } else if (!unlocked) {
        ctx.fillStyle = '#4a657d';
        ctx.fillText('未解锁', x + nw - 10, y + 38);
      } else {
        ctx.fillStyle = can ? '#ffd34d' : '#8a6f30';
        ctx.fillText('★' + metaCost(n), x + nw - 10, y + 38);
      }

      for (let k = 0; k < n.max; k++) {
        ctx.fillStyle = k < lv ? '#8affc1' : 'rgba(255,255,255,0.12)';
        ctx.fillRect(x + 10 + k * 11, y + 48, 8, 6);
      }
    }

    // 详情面板
    const n = META_NODES[metaSel];
    const panelY = y0 + 3 * rowH + nh + 20;
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(36, panelY, W - 72, 76);
    ctx.strokeStyle = 'rgba(120,180,220,0.3)';
    ctx.lineWidth = 1;
    ctx.strokeRect(36.5, panelY + 0.5, W - 73, 75);

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 14px ' + FONT;
    ctx.fillStyle = '#eaf6ff';
    ctx.fillText(n.name, 52, panelY + 20);
    ctx.font = '12px ' + FONT;
    ctx.fillStyle = '#a8c4dd';
    ctx.fillText(n.desc, 52, panelY + 42);

    ctx.font = '11px ' + MONO;
    const lv = mlv(n.id);
    if (lv >= n.max) {
      ctx.fillStyle = '#8affc1';
      ctx.fillText('已满级', 52, panelY + 62);
    } else if (!metaUnlocked(n)) {
      const pn = META_BY_ID[n.need[0]];
      ctx.fillStyle = '#ff8fa3';
      ctx.fillText('需要「' + (pn ? pn.name : n.need[0]) + '」到达 Lv' + n.need[1], 52, panelY + 62);
    } else {
      ctx.fillStyle = metaCanUp(n) ? '#ffd34d' : '#ff8fa3';
      ctx.fillText('下一级 ★' + metaCost(n) + '   ·   Enter / 点击升级', 52, panelY + 62);
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = '#5f8bb0';
    ctx.font = '12px ' + FONT;
    ctx.fillText('方向键选择 · Enter 升级 · Esc 返回', W / 2, H - 26);
  }

  function render() {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#070d1e');
    bg.addColorStop(0.55, '#0a1024');
    bg.addColorStop(1, '#04060f');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    drawStars();

    ctx.save();
    if (shake.t > 0) {
      const k = shake.t / shake.dur;
      ctx.translate(vrand(-1, 1) * shake.mag * k, vrand(-1, 1) * shake.mag * k);
    }

    drawPowerups();
    drawEnemyBullets();
    drawEnemies();
    drawBoss();
    drawLaser();
    drawBullets();
    drawMissiles();
    drawRailCharge();
    drawDrones();
    if (gameState !== 'over') drawPlayer();
    drawParticles();
    drawRings();
    drawPoison();
    drawFloaters();
    drawBolts();

    ctx.restore();

    // 连击过热：屏幕四周泛金
    if (combo >= 15 && (gameState === 'playing' || gameState === 'paused')) {
      const gd = ctx.createRadialGradient(W / 2, H / 2, H * 0.30, W / 2, H / 2, H * 0.72);
      gd.addColorStop(0, 'rgba(255,190,60,0)');
      gd.addColorStop(1, 'rgba(255,190,60,0.14)');
      ctx.fillStyle = gd;
      ctx.fillRect(0, 0, W, H);
    }

    // 击杀白闪
    if (screenFlash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.12, screenFlash).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    if (gameState === 'playing' || gameState === 'paused' || gameState === 'card' || gameState === 'settings') drawHUD();
    if (gameState === 'start') drawStart();
    if (gameState === 'paused') drawPaused();
    if (gameState === 'over') drawOver();
    if (gameState === 'card') drawCardScreen();
    if (gameState === 'settings') drawSettings();
    if (gameState === 'stats') drawStats();
    if (gameState === 'meta') drawMeta();
    if (gameState === 'shop') drawShop();
    if (gameState === 'missions') drawMissions();
    drawToasts();
  }

  // ============================================================
  //  主循环
  // ============================================================
  let lastT = 0;

  function frame(ts) {
    requestAnimationFrame(frame);

    if (!lastT) lastT = ts;
    let dt = (ts - lastT) / 1000;
    lastT = ts;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;

    updateStars(dt);
    if (shake.t > 0) shake.t -= dt;

    // 成就提示条
    if (toasts.length) {
      for (let i = 0; i < toasts.length; i++) toasts[i].life -= dt;
      toasts = toasts.filter(function (t) { return t.life > 0; });
    }

    // 「退出本局」二次确认倒计时
    if (quitArm > 0) {
      quitArm -= dt;
      if (quitArm < 0) quitArm = 0;
    }

    let worldDt = dt;
    if (slowmo > 0) {
      slowmo -= dt;
      worldDt = dt * 0.28;
    }

    if (gameState === 'playing') {
      gameTime += worldDt;
      update(worldDt);
    } else if (gameState === 'over') {
      updateBullets(worldDt);
      updateParticles(worldDt);
    } else if (gameState === 'start') {
      updateParticles(worldDt);
    }

    render();
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
