        ctx.lineTo(8, -10);
        ctx.lineTo(22, -14);
        ctx.lineTo(26, 2);
        ctx.lineTo(16, 14);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = white ? '#ffffff' : '#2b1400';
        ctx.fillRect(-10, -6, 20, 8);
        ctx.fillStyle = white ? '#ffffff' : 'rgba(255,90,40,0.95)';
        ctx.fillRect(-10, 6, 20, 3);

        if (e.hp < e.maxHp) {
          const w = 36;
          ctx.fillStyle = 'rgba(0,0,0,0.55)';
          ctx.fillRect(-w / 2, -26, w, 4);
          ctx.fillStyle = '#ff8a3d';
          ctx.fillRect(-w / 2, -26, w * Math.max(0, e.hp / e.maxHp), 4);
        }
      }

      ctx.restore();

      // 治疗机：绿色治疗光束
      if (e.type === 'healer' && e.healPulse > 0) {
        ctx.globalAlpha = Math.max(0, e.healPulse / 0.5) * 0.45;
        ctx.strokeStyle = '#7dff9e';
        ctx.lineWidth = 1.5;
        for (let j = 0; j < enemies.length; j++) {
          const o = enemies[j];
          if (o === e || o.dead || o.hp >= o.maxHp) continue;
          if (dist2(o, e) > 210 * 210) continue;
          ctx.beginPath();
          ctx.moveTo(e.x, e.y);
          ctx.lineTo(o.x, o.y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }

      if (e.type === 'sniper' && e.charge > 0) {
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        ctx.strokeStyle = 'rgba(255,90,60,' + (0.25 + (1 - e.charge / 0.65) * 0.55).toFixed(2) + ')';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([7, 9]);
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.x + Math.cos(a) * 520, e.y + Math.sin(a) * 520);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 护盾机：破盾后才显示血条
      if (e.type === 'guard' && e.shieldHp <= 0 && e.hp < e.maxHp) {
        const w = 36;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(e.x - w / 2, e.y - 36, w, 4);
        ctx.fillStyle = '#63d2ff';
        ctx.fillRect(e.x - w / 2, e.y - 36, w * Math.max(0, e.hp / e.maxHp), 4);
      }
    }
  }

  function drawBoss() {
    if (!boss) return;
    const b = boss;
    const p2 = b.phase === 2;
    const blink = b.invuln > 0 && Math.floor(b.t * 16) % 2 === 0;

    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.globalAlpha = blink ? 0.5 : 1;
    const white = b.flash > 0;

    ctx.shadowColor = p2 ? 'rgba(255,90,230,0.95)' : 'rgba(255,80,160,0.8)';
    ctx.shadowBlur = p2 ? 28 : 20;
    ctx.fillStyle = white ? '#ffffff' : (p2 ? '#ff5cd6' : '#e0559f');
    ctx.beginPath();
    ctx.moveTo(0, 40);
    ctx.lineTo(-22, 26);
    ctx.lineTo(-46, 14);
    ctx.lineTo(-40, -16);
    ctx.lineTo(-14, -22);
    ctx.lineTo(14, -22);
    ctx.lineTo(40, -16);
    ctx.lineTo(46, 14);
    ctx.lineTo(22, 26);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    // 二阶段：机体外圈能量环
    if (p2) {
      const ring = 0.35 + Math.abs(Math.sin(b.t * 5)) * 0.35;
      ctx.strokeStyle = 'rgba(255,120,235,' + ring.toFixed(2) + ')';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, 52, 0, TAU);
      ctx.stroke();
    }

    const pulse = 0.6 + Math.abs(Math.sin(b.t * 4)) * 0.4;
    ctx.fillStyle = 'rgba(255,235,120,' + pulse.toFixed(2) + ')';
    ctx.beginPath();
    ctx.arc(0, 2, 11, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#3a0a22';
    ctx.beginPath();
    ctx.arc(0, 2, 5, 0, TAU);
    ctx.fill();

    ctx.fillStyle = '#2a0a1a';
    ctx.fillRect(-34, 8, 10, 14);
    ctx.fillRect(24, 8, 10, 14);

    ctx.restore();

    const bw = 300, bh = 9;
    const bx = (W - bw) / 2, by = 76;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(bx, by, bw, bh);
    const hpRatio = Math.max(0, b.hp / b.maxHp);
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    g.addColorStop(0, p2 ? '#ff6bd6' : '#ff4d88');
    g.addColorStop(1, p2 ? '#b46bff' : '#ffb347');
    ctx.fillStyle = g;
    ctx.fillRect(bx, by, bw * hpRatio, bh);
    ctx.fillStyle = p2 ? '#ffd6f5' : '#ffd9e8';
    ctx.font = 'bold 11px ' + MONO;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(p2 ? 'BOSS · 第二阶段' : 'BOSS', W / 2, by - 6);
  }

  function drawBullets() {
    const hot = player.fireLevel >= 4 || combo >= 15;
    const hotCore = hot ? '#fff3c0' : '#eafcff';
    const hotGlow = hot ? 'rgba(255,205,90,0.34)' : 'rgba(120,230,255,0.30)';
    const hotTrail = hot ? 'rgba(255,205,90,0.45)' : 'rgba(150,240,255,0.45)';

    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      let core = hotCore, glow = hotGlow, trail = hotTrail, ring = null;

      if (b.elem === 'burn') {
        core = '#ffe0b0'; glow = 'rgba(255,140,50,0.46)'; trail = 'rgba(255,110,40,0.58)'; ring = '#ff7a2f';
      } else if (b.elem === 'poison') {
        core = '#e2ffe8'; glow = 'rgba(110,255,140,0.46)'; trail = 'rgba(80,225,110,0.58)'; ring = '#4dff7a';
      } else if (b.elem === 'chain') {
        core = '#eafbff'; glow = 'rgba(110,210,255,0.52)'; trail = 'rgba(80,190,255,0.62)'; ring = '#5fd0ff';
      }

      ctx.fillStyle = trail;
      ctx.fillRect(b.x - b.r * 0.55, b.y, b.r * 1.1, 24);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r + (ring ? 6 : 4), 0, TAU);
      ctx.fill();
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.ellipse(b.x, b.y, b.r * 0.8, b.r * 1.6, 0, 0, TAU);
      ctx.fill();

      if (ring) {
        ctx.strokeStyle = ring;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r + 4, 0, TAU);
        ctx.stroke();

        // 叠满 3 层的进化弹：外圈脉动光环
        const up = (b.elem === 'burn' && perk('burn') >= 3)
          || (b.elem === 'poison' && perk('poison') >= 3)
          || (b.elem === 'chain' && perk('chain') >= 3);
        if (up) {
          ctx.globalAlpha = 0.8;
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r + 9 + Math.sin(performance.now() / 80) * 2, 0, TAU);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }
    }
  }

  function drawEnemyBullets() {
    for (let i = 0; i < enemyBullets.length; i++) {
      const b = enemyBullets[i];
      ctx.fillStyle = b.color;
      ctx.globalAlpha = 0.28;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r + 4, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.25, b.y - b.r * 0.25, b.r * 0.42, 0, TAU);
      ctx.fill();
    }
  }

  function drawMissiles() {
    for (let i = 0; i < missiles.length; i++) {
      const m = missiles[i];

      // 拖尾光点（越靠后越小越淡）
      const tr = m.trail || [];
      for (let k = 0; k < tr.length; k++) {
        const a = (k + 1) / tr.length;
        ctx.fillStyle = 'rgba(255,175,95,' + (a * 0.30).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(tr[k].x, tr[k].y, 1.4 + a * 3, 0, TAU);
        ctx.fill();
      }

      const ang = Math.atan2(m.vy, m.vx);
      ctx.save();
      ctx.translate(m.x, m.y);
      ctx.rotate(ang + Math.PI / 2);

      // 尾焰比原来长一截
      const g = ctx.createLinearGradient(0, 2, 0, 34);
      g.addColorStop(0, 'rgba(255,240,175,0.95)');
      g.addColorStop(0.45, 'rgba(255,150,60,0.75)');
      g.addColorStop(1, 'rgba(255,70,40,0)');
      ctx.fillStyle = g;
      ctx.fillRect(-4, 2, 8, 32);

      ctx.shadowColor = '#ffb060';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#ffe8c0';
      ctx.beginPath();
      ctx.moveTo(0, -9);
      ctx.lineTo(4.5, 4);
      ctx.lineTo(-4.5, 4);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }

  function drawLaser() {
    if (laserTime <= 0) return;
    const w = 54 + Math.sin(performance.now() / 35) * 7;
    const top = 0;
    const bottom = player.y;

    const g = ctx.createLinearGradient(0, bottom, 0, top);
    g.addColorStop(0, 'rgba(200,255,255,0.95)');
    g.addColorStop(0.35, 'rgba(110,225,255,0.7)');
    g.addColorStop(1, 'rgba(90,190,255,0.10)');
    ctx.fillStyle = g;
    ctx.fillRect(player.x - w / 2, top, w, bottom);

    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.fillRect(player.x - w / 7, top, (w / 7) * 2, bottom);

    ctx.globalAlpha = 0.3;
    ctx.fillStyle = 'rgba(120,230,255,0.6)';
    ctx.fillRect(player.x - w, top, w * 2, bottom);
    ctx.globalAlpha = 1;
  }

  function drawPowerups() {
    for (let i = 0; i < powerups.length; i++) {
      const p = powerups[i];
      const color = p.type === 'P' ? '#5fd0ff' : p.type === 'S' ? '#8affc1' : '#ff7ab8';
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.sin(p.t * 2.4) * 0.25);

      ctx.shadowColor = color;
      ctx.shadowBlur = 14;
      ctx.fillStyle = 'rgba(8,16,30,0.9)';
      ctx.beginPath();
      ctx.moveTo(0, -p.r);
      ctx.lineTo(p.r, 0);
      ctx.lineTo(0, p.r);
      ctx.lineTo(-p.r, 0);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.fillStyle = color;
      ctx.font = 'bold 14px ' + MONO;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.type, 0, 1);
      ctx.restore();
    }
  }

  function drawParticles() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      const s = p.size * (p.life / p.max);
      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
  }

  function drawRings() {
    for (let i = 0; i < rings.length; i++) {
      const r = rings[i];
      const a = Math.max(0, r.life / r.max);
      ctx.strokeStyle = r.color;
      ctx.globalAlpha = a * 0.8;
      ctx.lineWidth = 1.5 + a * 3.5;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, TAU);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawFloaters() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 15px ' + MONO;
    for (let i = 0; i < floaters.length; i++) {
      const f = floaters[i];
      ctx.globalAlpha = Math.max(0, f.life / f.max);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawPoison() {
    const now = performance.now() / 1000;
    for (let i = 0; i < poisonClouds.length; i++) {
      const c = poisonClouds[i];
      const a = Math.max(0, c.life / c.max);

      // 内部浓度
      const g = ctx.createRadialGradient(c.x, c.y, 4, c.x, c.y, c.r);
      g.addColorStop(0, 'rgba(120,255,140,' + (0.22 * a).toFixed(3) + ')');
      g.addColorStop(0.6, 'rgba(90,235,120,' + (0.10 * a).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(60,200,90,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, TAU);
      ctx.fill();

      // 边界：外圈实线 + 内圈滚动虚线，一眼看清范围
      ctx.strokeStyle = 'rgba(150,255,170,' + (0.55 * a).toFixed(3) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r - 1, 0, TAU);
      ctx.stroke();

      ctx.setLineDash([11, 9]);
      ctx.lineDashOffset = -now * 46 - (c.seed || 0) * 6;
      ctx.strokeStyle = 'rgba(205,255,215,' + (0.85 * a).toFixed(3) + ')';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r - 6, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineDashOffset = 0;

      // 边缘游走的孢子光点
      const n = 10;
      for (let k = 0; k < n; k++) {
        const ang = now * 0.9 + (k * TAU) / n + (c.seed || 0);
        const px = c.x + Math.cos(ang) * c.r;
        const py = c.y + Math.sin(ang) * c.r;
        const pr = 1.8 + Math.sin(now * 3 + k) * 0.9;
        ctx.fillStyle = 'rgba(190,255,205,' + (0.6 * a).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(px, py, pr, 0, TAU);
        ctx.fill();
      }
    }
  }

  function drawBolts() {
    ctx.lineJoin = 'round';
    for (let i = 0; i < bolts.length; i++) {
      const b = bolts[i];
      const a = Math.max(0, b.life / b.max);
      for (let L = 0; L < 3; L++) {
        ctx.strokeStyle = L === 0 ? '#3aa8ff' : L === 1 ? '#8fe6ff' : '#ffffff';
        ctx.globalAlpha = a * (L === 0 ? 0.18 : L === 1 ? 0.55 : 0.95);
        ctx.lineWidth = L === 0 ? 9 : L === 1 ? 4 : 1.6;
        ctx.beginPath();
        for (let s = 0; s < b.pts.length; s++) {
          const p = b.pts[s];
          if (s === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        for (let k = 0; k < b.branches.length; k++) {
          const br = b.branches[k];
          ctx.beginPath();
          ctx.moveTo(br.x1, br.y1);
          ctx.lineTo(br.x2, br.y2);
          ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  // ============================================================
  //  HUD
  // ============================================================
  function drawHUD() {
    const g = ctx.createLinearGradient(0, 0, 0, 112);
    g.addColorStop(0, 'rgba(3,8,20,0.88)');
    g.addColorStop(1, 'rgba(3,8,20,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, 112);

    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#eaf6ff';
    ctx.font = 'bold 24px ' + MONO;
    ctx.fillText(pad5(score), 16, 10);

    ctx.fillStyle = '#5f8bb0';
    ctx.font = '11px ' + MONO;
    ctx.fillText('BEST ' + pad5(best), 17, 38);

    ctx.fillStyle = '#8affc1';
    ctx.font = 'bold 12px ' + MONO;
    ctx.fillText('LV.' + level, 16, 60);

    const px = 62, py = 63, pw = 84, ph = 5;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = level >= MAX_LEVEL ? '#ffd34d' : '#8affc1';
    ctx.fillRect(px, py, pw * Math.min(1, xp / xpNext), ph);

    ctx.textAlign = 'right';
    ctx.fillStyle = player.fireLevel > 1 ? '#ffd34d' : '#5f8bb0';
    ctx.font = 'bold 12px ' + MONO;
    ctx.fillText('WPN ' + player.fireLevel, W - 16, 12);

    for (let i = 0; i < player.lives; i++) {
      const lx = W - 24 - i * 20;
      const ly = 40;
      ctx.save();
      ctx.translate(lx, ly);
      ctx.scale(0.42, 0.42);
      ctx.fillStyle = '#9fe8ff';
      ctx.beginPath();
      ctx.moveTo(0, -24);
      ctx.lineTo(8, -4);
      ctx.lineTo(19, 9);
      ctx.lineTo(8, 6);
      ctx.lineTo(6, 17);
      ctx.lineTo(-6, 17);
      ctx.lineTo(-8, 6);
      ctx.lineTo(-19, 9);
      ctx.lineTo(-8, -4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    if (player.shield > 0) {
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(110,215,255,0.9)';
      ctx.font = 'bold 11px ' + MONO;
      ctx.fillText('SHIELD ' + player.shield.toFixed(1) + 's', W / 2, 12);
    }

    const cells = 3, cellW = 30, cellGap = 3, ebx = 16, eby = 78, ebh = 8;
    const isLaser = perk('laser') > 0;
    const ready = Math.floor(bombCharge / 100);
    const color = isLaser ? '#9fe8ff' : '#ffe45e';

    for (let i = 0; i < cells; i++) {
      const x = ebx + i * (cellW + cellGap);
      const c = clamp((bombCharge - i * 100) / 100, 0, 1);
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      ctx.fillRect(x, eby, cellW, ebh);
      if (c > 0) {
        ctx.fillStyle = color;
        ctx.fillRect(x, eby, cellW * c, ebh);
      }
      ctx.strokeStyle = c >= 1 ? color : 'rgba(120,180,220,0.30)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, eby + 0.5, cellW - 1, ebh - 1);
    }

    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = 'bold 10px ' + MONO;
    ctx.fillStyle = ready > 0 ? color : '#5f8bb0';
    ctx.fillText(
      ready > 0 ? (isLaser ? 'LASER x' + ready + '  [空格]' : 'BOMB x' + ready + '  [空格]')
                : (isLaser ? 'LASER ' : 'BOMB ') + Math.floor(bombCharge % 100) + '%',
      ebx, eby + 11
    );

    // 元素弹概率
    const elemStacks = perk('burn') + perk('poison') + perk('chain');
    if (elemStacks > 0) {
      ctx.textAlign = 'left';
      ctx.font = 'bold 10px ' + MONO;
      ctx.fillStyle = '#b6ff7a';
      ctx.fillText('ELEM ' + Math.round(Math.min(0.72, 0.16 + 0.08 * elemStacks) * 100) + '%', ebx + 110, eby + 11);
    }

    // 每日挑战标记
    if (dailyActive && dailyRule) {
      ctx.textAlign = 'left';
      ctx.font = 'bold 10px ' + MONO;
      ctx.fillStyle = '#ffd34d';
      ctx.fillText('DAILY · ' + dailyRule.name, ebx, eby + 24);
    }

    if (laserTime > 0) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#9fe8ff';
      ctx.font = 'bold 12px ' + MONO;
      ctx.fillText('LASER ' + laserTime.toFixed(1) + 's', W / 2, 100);
    }

    if (combo >= 2 && comboTimer > 0) {
      const mult = Math.min(10, 1 + Math.floor(combo / 3));
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = Math.min(1, comboTimer / 0.5);
      ctx.fillStyle = mult > 1 ? '#ffd34d' : '#cfe6ff';
      ctx.font = 'bold 26px ' + MONO;
      ctx.fillText('COMBO ' + combo, W / 2, 128);
      if (mult > 1) {
        ctx.font = 'bold 14px ' + MONO;
        ctx.fillStyle = '#ff8fa3';
        ctx.fillText('x' + mult + ' 分数', W / 2, 152);
      }
      ctx.globalAlpha = 1;
    }
    if (isTouch) drawTouchButtons();
  }

  // ============================================================
  //  选卡界面
  // ============================================================
  function wrapText(text, maxChars) {
    const out = [];
    let line = '';
    for (let i = 0; i < text.length; i++) {
      line += text[i];
      if (line.length >= maxChars) { out.push(line); line = ''; }
    }
    if (line) out.push(line);
    return out;
  }

  function drawCardScreen() {
    ctx.fillStyle = 'rgba(3,7,16,0.82)';
    ctx.fillRect(0, 0, W, H);

    const narrow = isTouch || window.innerWidth < 760;
    const n = cardChoices.length;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffd34d';
    ctx.font = 'bold 15px ' + MONO;
    ctx.fillText('LEVEL ' + level, W / 2, narrow ? 96 : 118);

    ctx.fillStyle = '#eaf6ff';
    ctx.font = 'bold 26px ' + FONT;
    ctx.fillText('选择一个强化', W / 2, narrow ? 130 : 158);

    ctx.fillStyle = '#5f8bb0';
    ctx.font = '12px ' + MONO;
    ctx.fillText(narrow ? '点一下卡片就好' : '三选一 · 按 1 / 2 / 3 或直接点击', W / 2, narrow ? 158 : 188);

    cardRects = [];

    if (narrow) {
      const cw = 466, chh = 138, gap = 12;
      const x0 = (W - cw) / 2;
      const y0 = Math.max(192, Math.round((H - 3 * (chh + gap)) / 2));

      for (let i = 0; i < n; i++) {
        const c = cardChoices[i];
        const x = x0, y = y0 + i * (chh + gap);
        const rar = RARITY[c.rarity];
        const stacks = perk(c.id);
        cardRects.push({ x: x, y: y, w: cw, h: chh });

        ctx.save();
        ctx.shadowColor = rar.color;
        ctx.shadowBlur = 16;
        ctx.fillStyle = 'rgba(10,18,34,0.96)';
        ctx.fillRect(x, y, cw, chh);
        ctx.restore();
        ctx.strokeStyle = rar.color;
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 0.5, y + 0.5, cw - 1, chh - 1);
        ctx.fillStyle = rar.color;
        ctx.fillRect(x, y, 5, chh);

        ctx.textAlign = 'left';
        ctx.font = 'bold 10px ' + MONO;
        ctx.fillStyle = rar.color;
        ctx.fillText(rar.name, x + 22, y + 26);

        ctx.font = 'bold 21px ' + FONT;
        ctx.fillStyle = '#ffffff';
        ctx.fillText(c.name, x + 22, y + 58);

        ctx.font = '13px ' + FONT;
        ctx.fillStyle = '#a8c4dd';
        ctx.fillText(c.desc, x + 22, y + 88);

        ctx.font = '11px ' + MONO;
        if ((c.id === 'burn' || c.id === 'poison' || c.id === 'chain') && stacks >= 3) {
          ctx.fillStyle = '#ffd34d';
          ctx.fillText('★ 进化  ' + stacks + '/' + c.max, x + 22, y + 112);
        } else {
          ctx.fillStyle = stacks > 0 ? rar.color : '#3d5a75';
          ctx.fillText(stacks > 0 ? '已持有 ' + stacks + '/' + c.max : '未持有', x + 22, y + 112);
        }

        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(255,255,255,0.07)';
        ctx.fillRect(x + cw - 54, y + chh - 44, 34, 28);
        ctx.fillStyle = '#ffd34d';
        ctx.font = 'bold 17px ' + MONO;
        ctx.fillText(String(i + 1), x + cw - 37, y + chh - 30);
      }

      ctx.textAlign = 'center';
      ctx.fillStyle = '#5f8bb0';
      ctx.font = '12px ' + FONT;
      ctx.fillText('击杀敌人升级 · 每 5 级再来一次', W / 2, y0 + 3 * (chh + gap) + 16);
      return;
    }

    const cw = 132, chh = 232, gap = 14;
    const total = n * cw + (n - 1) * gap;
    const x0 = (W - total) / 2;
    const y0 = Math.max(236, Math.round((H - chh) / 2) - 24);

    for (let i = 0; i < n; i++) {
      const c = cardChoices[i];
      const x = x0 + i * (cw + gap);
      const rar = RARITY[c.rarity];
      const stacks = perk(c.id);

      cardRects.push({ x: x, y: y0, w: cw, h: chh });

      ctx.save();
      ctx.shadowColor = rar.color;
      ctx.shadowBlur = 18;
      ctx.fillStyle = 'rgba(10,18,34,0.96)';
      ctx.fillRect(x, y0, cw, chh);
      ctx.restore();

      ctx.strokeStyle = rar.color;
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 0.5, y0 + 0.5, cw - 1, chh - 1);

      ctx.fillStyle = rar.color;
      ctx.fillRect(x, y0, cw, 4);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.fillStyle = rar.color;
      ctx.font = 'bold 10px ' + MONO;
      ctx.fillText(rar.name, x + cw / 2, y0 + 28);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 18px ' + FONT;
      ctx.fillText(c.name, x + cw / 2, y0 + 62);

      ctx.fillStyle = '#a8c4dd';
      ctx.font = '12px ' + FONT;
      const lines = wrapText(c.desc, 9);
      for (let k = 0; k < lines.length; k++) {
        ctx.fillText(lines[k], x + cw / 2, y0 + 100 + k * 19);
      }

      if ((c.id === 'burn' || c.id === 'poison' || c.id === 'chain') && stacks >= 3) {
        ctx.fillStyle = '#ffd34d';
        ctx.font = 'bold 11px ' + MONO;
        ctx.fillText('★ 进化  ' + stacks + '/' + c.max, x + cw / 2, y0 + 170);
      } else if (stacks > 0) {
        ctx.fillStyle = rar.color;
        ctx.font = 'bold 11px ' + MONO;
        ctx.fillText('已持有 ' + stacks + '/' + c.max, x + cw / 2, y0 + 170);
      } else {
        ctx.fillStyle = '#3d5a75';
        ctx.font = '11px ' + MONO;
        ctx.fillText('未持有', x + cw / 2, y0 + 170);
      }

      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(x + cw / 2 - 18, y0 + 190, 36, 26);
      ctx.fillStyle = '#ffd34d';
      ctx.font = 'bold 16px ' + MONO;
      ctx.fillText(String(i + 1), x + cw / 2, y0 + 204);
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = '#5f8bb0';
    ctx.font = '12px ' + FONT;
    ctx.fillText('击杀敌人升级 · 每 5 级再来一次', W / 2, y0 + chh + 44);
  }

  function drawSettings() {
    ctx.fillStyle = 'rgba(3,7,16,0.86)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#a9ecff';
    ctx.font = 'bold 32px ' + FONT;
    ctx.fillText('设置', W / 2, 130);

    const rows = [
      ['音量', Math.round(settings.volume * 100) + '%'],
      ['背景音乐', settings.music ? '开' : '关'],
      ['敌机密度', settings.density.toFixed(2) + 'x']
    ];

    settingRects = [];

    const topY = Math.max(245, Math.round(H * 0.30));
    for (let i = 0; i < rows.length; i++) {
      const y = topY + i * 68;
      const active = i === settingIndex;
      settingRects.push({ x: 60, y: y - 26, w: W - 120, h: 52 });
      if (active) {
        ctx.fillStyle = 'rgba(90,190,255,0.10)';
        ctx.fillRect(60, y - 26, W - 120, 52);
        ctx.strokeStyle = 'rgba(110,215,255,0.5)';
        ctx.lineWidth = 1;
        ctx.strokeRect(60.5, y - 25.5, W - 121, 51);
      }
      ctx.textAlign = 'left';
      ctx.fillStyle = active ? '#eaf6ff' : '#7d9ab3';
      ctx.font = 'bold 18px ' + FONT;
      ctx.fillText(rows[i][0], 90, y);

      ctx.textAlign = 'right';
      ctx.fillStyle = active ? '#ffd34d' : '#5f8bb0';
      ctx.font = 'bold 18px ' + MONO;
      ctx.fillText(rows[i][1], W - 90, y);

      if (active) {
        ctx.textAlign = 'center';
        ctx.fillStyle = '#5fd0ff';
        ctx.font = '14px ' + MONO;
        ctx.fillText(i === 1 ? '← → 切换' : '← → 调整', W / 2, y + 22);
      }
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = '#5f8bb0';
    ctx.font = '13px ' + FONT;
    ctx.fillText(isTouch ? '点一行切换 · 点屏幕外 Esc 返回' : '↑↓ 选择 · ←→ 调整 · Esc 返回游戏', W / 2, H - 140);
    ctx.fillStyle = '#3d5a75';
    ctx.font = '12px ' + FONT;
    ctx.fillText('设置即时生效', W / 2, H - 108);
  }

  function adjustSetting(dir) {
    if (settingIndex === 0) {
      settings.volume = clamp(settings.volume + dir * 0.1, 0, 1);
      if (masterGain) masterGain.gain.value = settings.volume;
      sfx.pickup();
    } else if (settingIndex === 1) {
      settings.music = !settings.music;
      bgmOn = settings.music;
      if (bgmOn) startBGM(); else stopBGM();
    } else {
      settings.density = clamp(settings.density + dir * 0.25, 0.5, 2);
    }
  }

  // ============================================================
  //  开始 / 暂停 / 结束界面
  // ============================================================
  function drawStart() {
    ctx.fillStyle = 'rgba(3,7,16,0.55)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.save();
    ctx.shadowColor = 'rgba(80,180,255,0.9)';
    ctx.shadowBlur = 26;
    ctx.fillStyle = '#a9ecff';
    ctx.font = 'bold 46px ' + FONT;
    ctx.fillText('星际战机', W / 2, H * 0.24);
    ctx.restore();

    ctx.fillStyle = '#5f8bb0';
    ctx.font = '13px ' + MONO;
    ctx.fillText('S T A R   F I G H T E R', W / 2, H * 0.24 + 40);

    const lines = [
      '方向键 / WASD 移动，鼠标也能飞',
      '自动开火，击杀升级，每 5 级三选一',
      'P / Esc 暂停 · M 音乐开关'
    ];
    ctx.font = '15px ' + FONT;
    for (let i = 0; i < lines.length; i++) {
      ctx.fillStyle = i === 2 ? '#6d8faa' : '#cfe6ff';
      ctx.fillText(lines[i], W / 2, H * 0.42 + i * 30);
    }

    ctx.font = '13px ' + FONT;
    ctx.fillStyle = '#5fd0ff';
    ctx.fillText('P 加经验', W / 2 - 78, H * 0.62);
    ctx.fillStyle = '#8affc1';
    ctx.fillText('S 护盾', W / 2, H * 0.62);
    ctx.fillStyle = '#ff7ab8';
    ctx.fillText('H 加命', W / 2 + 78, H * 0.62);

    if (Math.floor(performance.now() / 500) % 2 === 0) {
      ctx.fillStyle = '#ffd34d';
      ctx.font = 'bold 17px ' + FONT;
      ctx.fillText('按 空格 或 点击屏幕 开始', W / 2, H * 0.75);
    }

    // 每日挑战按钮（固定种子 + 当天规则）
    const dRule = todayRule();
    const dBest = dailyBest();
    dailyBtn.x = W / 2 - 122;
    dailyBtn.y = Math.round(H * 0.815);
    dailyBtn.w = 244;
    dailyBtn.h = 46;

    ctx.fillStyle = 'rgba(255,211,77,0.10)';
    ctx.fillRect(dailyBtn.x, dailyBtn.y, dailyBtn.w, dailyBtn.h);
    ctx.strokeStyle = 'rgba(255,211,77,0.65)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(dailyBtn.x + 0.5, dailyBtn.y + 0.5, dailyBtn.w - 1, dailyBtn.h - 1);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd34d';
    ctx.font = 'bold 15px ' + FONT;
    ctx.fillText('每日挑战 · ' + dRule.name, W / 2, dailyBtn.y + 18);

    ctx.fillStyle = '#a88b3a';
    ctx.font = '10px ' + MONO;
    ctx.fillText(dRule.desc + (dBest ? '   ·   今日最佳 ' + pad5(dBest.score) : ''), W / 2, dailyBtn.y + 33);

    if (best > 0) {
      ctx.fillStyle = '#42627d';
      ctx.font = '12px ' + MONO;
      ctx.fillText('BEST ' + pad5(best), W / 2, H * 0.915);
    }

    ctx.fillStyle = '#42627d';
    ctx.font = '11px ' + MONO;
    ctx.fillText('成就 ' + achvCount() + '/' + ACHIEVEMENTS.length + '  ·  Tab 查看成就与排行  ·  D 每日挑战', W / 2, H * 0.955);

    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillStyle = '#2f4a61';
    ctx.font = '10px ' + MONO;
    ctx.fillText(GAME_VERSION, W - 10, H - 7);
  }

  function drawPaused() {
    ctx.fillStyle = 'rgba(3,7,16,0.72)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#a9ecff';
    ctx.font = 'bold 34px ' + FONT;
    ctx.fillText('已暂停', W / 2, H / 2 - 18);
    ctx.fillStyle = '#6d8faa';
    ctx.font = '14px ' + FONT;
    ctx.fillText('按 P 或 Esc 继续', W / 2, H / 2 + 26);
    ctx.fillStyle = '#3d5a75';
    ctx.font = '11px ' + MONO;
    ctx.fillText(GAME_VERSION, W / 2, H / 2 + 62);
  }

  function drawOver() {
    ctx.fillStyle = 'rgba(3,7,16,0.74)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.save();
    ctx.shadowColor = 'rgba(255,90,120,0.9)';
    ctx.shadowBlur = 24;
    ctx.fillStyle = '#ff8fa3';
    ctx.font = 'bold 38px ' + FONT;
    ctx.fillText('GAME OVER', W / 2, H * 0.19);
    ctx.restore();

    ctx.fillStyle = '#cfe6ff';
    ctx.font = '13px ' + MONO;
    ctx.fillText('SCORE', W / 2, H * 0.28);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 42px ' + MONO;
    ctx.fillText(pad5(score), W / 2, H * 0.335);

    ctx.fillStyle = '#5f8bb0';
    ctx.font = '14px ' + MONO;
    ctx.fillText('BEST  ' + pad5(best), W / 2, H * 0.41);

    ctx.fillStyle = '#8affc1';
    ctx.font = 'bold 14px ' + MONO;
    ctx.fillText('LV.' + level + '   WPN ' + player.fireLevel + '   ' + Math.floor(gameTime) + 's', W / 2, H * 0.465);

    if (isNewBest) {
      if (Math.floor(performance.now() / 400) % 2 === 0) {
        ctx.fillStyle = '#ffd34d';
        ctx.font = 'bold 16px ' + FONT;
        ctx.fillText('★ 新纪录 ★', W / 2, H * 0.515);
      }
    }

    if (unlockedThisRun.length) {
      ctx.fillStyle = '#ffd34d';
      ctx.font = 'bold 12px ' + MONO;
      ctx.fillText('本局解锁 ' + unlockedThisRun.length + ' 个成就', W / 2, H * 0.575);
      const show = Math.min(4, unlockedThisRun.length);
      for (let i = 0; i < show; i++) {
        const a = ACHI_BY_ID[unlockedThisRun[i]];
        if (!a) continue;
        ctx.fillStyle = 'rgba(255,211,77,0.88)';
        ctx.font = '12px ' + FONT;
        ctx.fillText('☆ ' + a.name, W / 2, H * 0.62 + i * 20);
      }
    }

    if (Math.floor(performance.now() / 500) % 2 === 0) {
      ctx.fillStyle = '#ffd34d';
      ctx.font = 'bold 16px ' + FONT;
      ctx.fillText('空格 / R 重来  ·  Tab 看成就与排行', W / 2, H * 0.86);
    }
  }

  // ============================================================
  //  渲染
  // ============================================================
  // 僚机
  function drawDrones() {
    const n = Math.min(2, perk('drone'));
    if (n <= 0) return;
    for (let i = 0; i < n; i++) {
      const a = droneAngle + i * Math.PI;
      const dx = player.x + Math.cos(a) * 36;
      const dy = player.y + Math.sin(a) * 24 - 4;
      ctx.save();
      ctx.translate(dx, dy);
      ctx.rotate(a + Math.PI / 2);
      ctx.fillStyle = '#8affc1';
      ctx.shadowColor = '#8affc1';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(0, -8); ctx.lineTo(6, 6); ctx.lineTo(0, 3); ctx.lineTo(-6, 6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.shadowBlur = 0;
  }

  // 成就提示条
  function drawToasts() {
    for (let i = 0; i < toasts.length; i++) {
      const t = toasts[i];
      const a = Math.max(0, Math.min(1, t.life / 0.5));
      ctx.globalAlpha = a;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const w = Math.min(540, 40 + t.text.length * 13);
      const y = 168 + i * 34;
      ctx.fillStyle = 'rgba(8,16,30,0.94)';
      ctx.fillRect(W / 2 - w / 2, y - 13, w, 26);
      ctx.strokeStyle = t.color;
      ctx.lineWidth = 1.2;
      ctx.strokeRect(W / 2 - w / 2 + 0.5, y - 12.5, w - 1, 25);
      ctx.fillStyle = t.color;
      ctx.font = 'bold 13px ' + FONT;
      ctx.fillText(t.text, W / 2, y);
    }
    ctx.globalAlpha = 1;
  }

  // 触屏专用大按钮
  function drawTouchButtons() {
    if (!isTouch) return;
    const ready = bombCharge >= 100;

    // 右上角暂停
    ctx.fillStyle = 'rgba(10,20,36,0.62)';
    ctx.strokeStyle = 'rgba(120,190,240,0.38)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(W - 34, 34, 20, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(180,225,255,0.9)';
    ctx.fillRect(W - 41, 26, 5, 16);
    ctx.fillRect(W - 32, 26, 5, 16);

    // 右下角大招
    const isLaser = perk('laser') > 0;
    const c = isLaser ? '#9fe8ff' : '#ffe45e';
    ctx.fillStyle = ready ? 'rgba(255,228,94,0.18)' : 'rgba(10,20,36,0.62)';
    ctx.strokeStyle = ready ? c : 'rgba(120,180,220,0.32)';
    ctx.beginPath();
    ctx.arc(W - 66, H - 54, 34, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 12px ' + MONO;
    ctx.fillStyle = ready ? c : '#4a657d';
    ctx.fillText(isLaser ? 'LASER' : 'BOMB', W - 66, H - 58);
    ctx.font = 'bold 10px ' + MONO;
    ctx.fillText(Math.floor(bombCharge / 100) + 'x', W - 66, H - 42);
  }

  // 成就 + 本地排行榜
  function drawStats() {
    ctx.fillStyle = 'rgba(3,7,16,0.96)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#a9ecff';
    ctx.font = 'bold 26px ' + FONT;
    ctx.fillText('记录与成就', W / 2, 42);

    ctx.fillStyle = '#5f8bb0';
    ctx.font = '11px ' + MONO;
    ctx.fillText('成就 ' + achvCount() + ' / ' + ACHIEVEMENTS.length, W / 2, 70);

    ctx.font = '11px ' + MONO;
    ctx.fillStyle = '#8affc1';
    ctx.fillText('累计击杀 ' + totalKills + '   ·   Boss ' + totalBosses + '   ·   BEST ' + pad5(best), W / 2, 92);

    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffd34d';
    ctx.font = 'bold 12px ' + MONO;
    ctx.fillText('本地 TOP 5', 46, 118);

    const bw = W - 92;
    for (let i = 0; i < 5; i++) {
      const y = 138 + i * 22;
      const b = board[i];
      ctx.fillStyle = i === 0 ? 'rgba(255,211,77,0.12)' : 'rgba(255,255,255,0.04)';
      ctx.fillRect(46, y - 10, bw, 20);
      ctx.font = '11px ' + MONO;
      ctx.fillStyle = b ? '#cfe6ff' : '#2b4257';
      ctx.textAlign = 'left';
      ctx.fillText(String(i + 1) + '.', 54, y);
      if (b) {
        ctx.textAlign = 'right';
        ctx.fillText(pad5(b.score), 240, y);
        ctx.textAlign = 'left';
        ctx.fillStyle = '#5f8bb0';
        ctx.fillText('LV.' + b.level + '   ' + Math.floor(b.time / 60) + 'm' + (b.time % 60) + 's', 300, y);
      } else {
        ctx.textAlign = 'center';
        ctx.fillStyle = '#2b4257';
        ctx.fillText('—— 虚位以待 ——', 46 + bw / 2, y);
      }
    }

    const gridTop = Math.max(286, Math.round(H * 0.40));
    for (let i = 0; i < ACHIEVEMENTS.length; i++) {
      const a = ACHIEVEMENTS[i];
      const got = !!achvSet[a.id];
      const col = i >= 9 ? 1 : 0;
      const row = i % 9;
      const x = 50 + col * 254;
      const y = gridTop + row * 40;
      ctx.fillStyle = got ? 'rgba(255,211,77,0.10)' : 'rgba(255,255,255,0.03)';
      ctx.fillRect(x, y - 15, 240, 34);
      ctx.textAlign = 'left';
      ctx.font = 'bold 12px ' + FONT;
      ctx.fillStyle = got ? '#ffd34d' : '#4a657d';
      ctx.fillText((got ? '★ ' : '☆ ') + a.name, x + 8, y - 2);
      ctx.font = '10px ' + FONT;
      ctx.fillStyle = got ? '#a8c4dd' : '#33495c';
      ctx.fillText(a.desc, x + 8, y + 13);
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = '#5f8bb0';
    ctx.font = '12px ' + FONT;
    ctx.fillText('Tab / Esc 返回', W / 2, H - 22);
  }

  function render() {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#070d1e');
    bg.addColorStop(0.55, '#0a1024');
    bg.addColorStop(1, '#04060f');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    drawStars();

    ctx.save();
    if (shake.t > 0) {
      const k = shake.t / shake.dur;
      ctx.translate(vrand(-1, 1) * shake.mag * k, vrand(-1, 1) * shake.mag * k);
    }

    drawPowerups();
    drawEnemyBullets();
    drawEnemies();
    drawBoss();
    drawLaser();
    drawBullets();
    drawMissiles();
    drawDrones();
    if (gameState !== 'over') drawPlayer();
    drawParticles();
    drawRings();
    drawPoison();
    drawFloaters();
    drawBolts();

    ctx.restore();

    // 连击过热：屏幕四周泛金
    if (combo >= 15 && (gameState === 'playing' || gameState === 'paused')) {
      const gd = ctx.createRadialGradient(W / 2, H / 2, H * 0.30, W / 2, H / 2, H * 0.72);
      gd.addColorStop(0, 'rgba(255,190,60,0)');
      gd.addColorStop(1, 'rgba(255,190,60,0.14)');
      ctx.fillStyle = gd;
      ctx.fillRect(0, 0, W, H);
    }

    // 击杀白闪
    if (screenFlash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.12, screenFlash).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    if (gameState === 'playing' || gameState === 'paused' || gameState === 'card' || gameState === 'settings') drawHUD();
    if (gameState === 'start') drawStart();
    if (gameState === 'paused') drawPaused();
    if (gameState === 'over') drawOver();
    if (gameState === 'card') drawCardScreen();
    if (gameState === 'settings') drawSettings();
    if (gameState === 'stats') drawStats();
    drawToasts();
  }

  // ============================================================
  //  主循环
  // ============================================================
  let lastT = 0;

  function frame(ts) {
    requestAnimationFrame(frame);

    if (!lastT) lastT = ts;
    let dt = (ts - lastT) / 1000;
    lastT = ts;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;

    updateStars(dt);
    if (shake.t > 0) shake.t -= dt;

    // 成就提示条
    if (toasts.length) {
      for (let i = 0; i < toasts.length; i++) toasts[i].life -= dt;
      toasts = toasts.filter(function (t) { return t.life > 0; });
    }

    let worldDt = dt;
    if (slowmo > 0) {
      slowmo -= dt;
      worldDt = dt * 0.28;
    }

    if (gameState === 'playing') {
      gameTime += worldDt;
      update(worldDt);
    } else if (gameState === 'over') {
      updateBullets(worldDt);
      updateParticles(worldDt);
    } else if (gameState === 'start') {
      updateParticles(worldDt);
    }

    render();
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
