<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>星际战机 · Star Fighter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, #0b1733 0%, #05080f 55%, #02040a 100%);
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block; border-radius: 12px;
    box-shadow: 0 0 80px rgba(60, 140, 255, .18), 0 0 160px rgba(120, 60, 255, .10);
    cursor: crosshair;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
(function () {
  'use strict';

  // ============================================================
  //  基础常量
  // ============================================================
  let W = 600, H = 720;   // 逻辑分辨率：宽度固定 600，高度按窗口比例动态计算（手机铺满）
  const TAU = Math.PI * 2;
  const FONT = 'system-ui, "Microsoft YaHei", "PingFang SC", sans-serif';
  const MONO = 'ui-monospace, Consolas, "Courier New", monospace';
  const MAX_LEVEL = Infinity;
  const GAME_VERSION = 'v1.8';   // 改玩法/数值时手动 +0.1，方便手机上确认跑的是不是新版
  const isTouch = (function () {
    try { return ("ontouchstart" in window) || (navigator.maxTouchPoints > 0); }
    catch (e) { return false; }
  })();

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const winW = Math.max(1, window.innerWidth || 600);
    const winH = Math.max(1, window.innerHeight || 720);

    // 宽度锁 600，高度跟着窗口比例走：手机竖屏变成长条，桌面还是接近 5:6
    W = 600;
    H = Math.round(Math.min(1320, Math.max(720, W * (winH / winW))));

    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    const scale = Math.min(winW / W, winH / H);
    canvas.style.width = Math.round(W * scale) + 'px';
    canvas.style.height = Math.round(H * scale) + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ============================================================
  //  工具
  // ============================================================
  // 逻辑随机（每日挑战时换成固定种子）与视觉随机（永远用 Math.random）分开，
  // 这样爆炸粒子/闪电抖动不会影响“每天同一套敌人和卡池”的可复现性
  let gRandom = Math.random;
  const rand = (a, b) => a + gRandom() * (b - a);
  const vrand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const dist2 = (a, b) => (a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y);
  const pad5 = (n) => String(n).padStart(5, '0');

  function lsGet(key, def) {
    try {
      const v = localStorage.getItem(key);
      return v === null ? def : v;
    } catch (e) { return def; }
  }
  function lsSet(key, val) {
    try { localStorage.setItem(key, String(val)); } catch (e) { /* 忽略 */ }
  }
  function lsJson(key, def) {
    try {
      const v = JSON.parse(localStorage.getItem(key));
      return v === null || v === undefined ? def : v;
    } catch (e) { return def; }
  }

  function loadBest() { return Number(lsGet("starfighter_best", 0)) || 0; }
  function saveBest(v) { lsSet("starfighter_best", v); }

  // ============================================================
  //  成就 / 累计数据 / 本地排行榜
  // ============================================================
  const ACHIEVEMENTS = [
    { id: 'firstBlood', name: '初次击坠',    desc: '累计击坠 1 架敌机' },
    { id: 'kill100',    name: '百人斩',      desc: '累计击坠 100 架敌机' },
    { id: 'kill1000',   name: '千机克星',    desc: '累计击坠 1000 架敌机' },
    { id: 'combo50',    name: '连击大师',    desc: '单局连击达到 50' },
    { id: 'combo100',   name: '狂暴连击',    desc: '单局连击达到 100' },
    { id: 'lv30',       name: '渐入佳境',    desc: '单局到达 LV.30' },
    { id: 'lv60',       name: '精英飞行员',  desc: '单局到达 LV.60' },
    { id: 'boss1',      name: '屠龙者',      desc: '击杀 1 个 Boss' },
    { id: 'boss10',     name: 'Boss 终结者', desc: '累计击杀 10 个 Boss' },
    { id: 'score50k',   name: '五万分',      desc: '单局得分达到 50,000' },
    { id: 'survive3',   name: '三分钟',      desc: '单局存活 3 分钟' },
    { id: 'survive6',   name: '六分钟老兵',  desc: '单局存活 6 分钟' },
    { id: 'ironwall',   name: '铁壁',        desc: '单局连续 60 秒不受伤' },
    { id: 'elemental',  name: '元素使',      desc: '同局同时持有燃烧/毒素/闪电' },
    { id: 'alchemy',    name: '炼金术士',    desc: '触发 1 次元素反应' },
    { id: 'collector',  name: '收藏家',      desc: '单局获得 10 张卡' },
    { id: 'bigBoom',    name: '核爆',        desc: '单局释放 3 次大招' },
    { id: 'guardBreak', name: '破盾者',      desc: '打爆 1 面敌机护盾' },
    { id: 'trinity',    name: '三位一体',    desc: '触发 1 次元素奇点（三连锁）' },
    { id: 'finalForm',  name: '终局猎手',    desc: '击杀一个进入终局形态的 Boss' }
  ];
  const ACHI_BY_ID = Object.create(null);
  for (let i = 0; i < ACHIEVEMENTS.length; i++) ACHI_BY_ID[ACHIEVEMENTS[i].id] = ACHIEVEMENTS[i];

  const achvSet = Object.create(null);
  (function () {
    const arr = lsJson("starfighter_achv", []);
    if (Array.isArray(arr)) for (let i = 0; i < arr.length; i++) achvSet[arr[i]] = true;
  })();

  function achvCount() {
    let n = 0;
    for (let i = 0; i < ACHIEVEMENTS.length; i++) if (achvSet[ACHIEVEMENTS[i].id]) n++;
    return n;
  }

  function saveAchv() {
    const out = [];
    for (let i = 0; i < ACHIEVEMENTS.length; i++) {
      const id = ACHIEVEMENTS[i].id;
      if (achvSet[id]) out.push(id);
    }
    lsSet("starfighter_achv", JSON.stringify(out));
  }

  function unlock(id) {
    if (achvSet[id]) return false;
    achvSet[id] = true;
    saveAchv();
    const a = ACHI_BY_ID[id];
    toasts.push({ text: "★ 成就解锁  " + (a ? a.name : id), life: 3.4, max: 3.4, color: "#ffd34d" });
    unlockedThisRun.push(id);
    sfx.achv();
    return true;
  }

  let totalKills = Number(lsGet("starfighter_kills", 0)) || 0;
  let totalBosses = Number(lsGet("starfighter_bosses", 0)) || 0;

  // ============================================================
  //  成就奖励：飞机皮肤 / 弹道特效 / 成就解锁卡池
  // ============================================================
  // deco：机身专属装饰（v1.6 每款皮肤一种）；flame：引擎尾焰颜色
  const SKINS = [
    { id: 'aurora',  name: '极光', need: null,        cost: 0, body: '#a9ecff', glow: 'rgba(120,220,255,0.85)', core: '#0d3c6e', eye: 'rgba(150,230,255,0.92)', trim: '#8affc1', deco: 'ring',     flame: 'rgba(180,240,255,0.95)' },
    { id: 'crimson', name: '赤焰', need: 'combo50',   cost: 0, body: '#ff9f9f', glow: 'rgba(255,110,120,0.88)', core: '#5c1020', eye: 'rgba(255,215,205,0.92)', trim: '#ffd34d', deco: 'blade',    flame: 'rgba(255,150,120,0.95)' },
    { id: 'emerald', name: '翡翠', need: 'combo100',  cost: 0, body: '#9dffc4', glow: 'rgba(110,255,170,0.88)', core: '#0c3a24', eye: 'rgba(200,255,220,0.92)', trim: '#5fd0ff', deco: 'orb',      flame: 'rgba(160,255,200,0.95)' },
    { id: 'gold',    name: '金鹰', need: 'score50k',  cost: 0, body: '#ffe08a', glow: 'rgba(255,200,70,0.92)',  core: '#4a3000', eye: 'rgba(255,246,205,0.95)', trim: '#ff7ab8', deco: 'wing',     flame: 'rgba(255,220,120,0.95)' },
    { id: 'void',    name: '虚空', need: 'boss10',    cost: 0, body: '#c9a8ff', glow: 'rgba(170,120,255,0.92)', core: '#241040', eye: 'rgba(232,214,255,0.95)', trim: '#ff5cd6', deco: 'voidring', flame: 'rgba(200,160,255,0.95)' },
    // ---- 商店款（星元购买，v1.3）----
    { id: 'neon',    name: '霓虹', need: null, cost: 1200, body: '#ff7ae0', glow: 'rgba(255,120,230,0.92)', core: '#3a0b33', eye: 'rgba(255,220,250,0.95)', trim: '#5fd0ff', deco: 'neon',     flame: 'rgba(255,140,230,0.95)' },
    { id: 'ice',     name: '寒霜', need: null, cost: 1800, body: '#cfe9ff', glow: 'rgba(160,220,255,0.95)', core: '#12344f', eye: 'rgba(235,250,255,0.96)', trim: '#9fe8ff', deco: 'crystal',  flame: 'rgba(210,240,255,0.95)' },
    { id: 'magma',   name: '熔岩', need: null, cost: 2600, body: '#ff8a4d', glow: 'rgba(255,120,50,0.95)',  core: '#4a1204', eye: 'rgba(255,230,190,0.95)', trim: '#ffd166', deco: 'crack',    flame: 'rgba(255,170,90,0.95)' },
    { id: 'phantom', name: '幻影', need: null, cost: 4000, body: '#b9c6ff', glow: 'rgba(150,140,255,0.92)', core: '#1a1a3a', eye: 'rgba(240,240,255,0.95)', trim: '#c08cff', deco: 'after',    flame: 'rgba(190,190,255,0.95)' }
  ];
  const TRAILS = [
    { id: 'std',    name: '标准',   need: null },
    { id: 'plasma', name: '等离子', need: 'kill1000' },
    { id: 'prism',  name: '棱镜',   need: 'elemental' }
  ];

  function hasReward(need) { return !need || !!achvSet[need]; }

  // 商店皮肤要单独记录「已购买」，成就皮肤仍然看成就
  function skinIsStore(s) { return !s.need && s.cost > 0; }

  const ownedSkinSet = Object.create(null);
  (function () {
    const arr = lsJson('starfighter_owned', []);
    if (Array.isArray(arr)) for (let i = 0; i < arr.length; i++) ownedSkinSet[arr[i]] = true;
  })();

  function skinOwned(s) {
    if (s.need) return !!achvSet[s.need];
    if (s.cost > 0) return !!ownedSkinSet[s.id];
    return true;
  }

  function ownedSkinCount() {
    let n = 0;
    for (let i = 0; i < SKINS.length; i++) if (skinOwned(SKINS[i])) n++;
    return n;
  }
  function ownedTrailCount() {
    let n = 0;
    for (let i = 0; i < TRAILS.length; i++) if (hasReward(TRAILS[i].need)) n++;
    return n;
  }

  let skinIdx = 0;
  let trailIdx = 0;

  function findIdx(list, id) {
    for (let i = 0; i < list.length; i++) if (list[i].id === id) return i;
    return -1;
  }

  function loadLooks() {
    const si = findIdx(SKINS, lsGet('starfighter_skin', 'aurora'));
    const ti = findIdx(TRAILS, lsGet('starfighter_trail', 'std'));
    skinIdx = si >= 0 ? si : 0;
    trailIdx = ti >= 0 ? ti : 0;
    if (!skinOwned(SKINS[skinIdx])) skinIdx = 0;
    if (!hasReward(TRAILS[trailIdx].need)) trailIdx = 0;
  }

  function curSkin() { return SKINS[skinIdx]; }
  function curTrail() { return TRAILS[trailIdx]; }

  function lookUsable(item, isSkin) {
    return isSkin ? skinOwned(item) : hasReward(item.need);
  }

  function cycleLook(list, isSkin, dir) {
    let idx = isSkin ? skinIdx : trailIdx;
    for (let k = 0; k < list.length; k++) {
      idx = (idx + dir + list.length) % list.length;
      if (lookUsable(list[idx], isSkin)) break;
    }
    if (!lookUsable(list[idx], isSkin)) return;
    if (isSkin) skinIdx = idx; else trailIdx = idx;
    lsSet(isSkin ? 'starfighter_skin' : 'starfighter_trail', list[idx].id);
    toasts.push({ text: (isSkin ? '皮肤 ' : '弹道 ') + list[idx].name, life: 1.6, max: 1.6, color: '#9fe8ff' });
    sfx.cardPick();
  }

  function cycleSkin(dir) { cycleLook(SKINS, true, dir || 1); }
  function cycleTrail(dir) { cycleLook(TRAILS, false, dir || 1); }

  function nextLockedReward() {
    for (let i = 0; i < SKINS.length; i++) {
      const s = SKINS[i];
      if (s.need && !achvSet[s.need]) return s;
    }
    for (let i = 0; i < TRAILS.length; i++) if (!hasReward(TRAILS[i].need)) return TRAILS[i];
    return null;
  }

  // ============================================================
  //  局外成长：星元 / 技能树（v1.3）
  // ============================================================
  let dust = Math.max(0, Math.floor(Number(lsGet('starfighter_dust', 0)) || 0));
  let dustEarned = 0;      // 本局赚到的星元（结算显示用）

  // 3 列 × 4 行的技能树（v1.6 补满 12 格）；need: [前置节点, 需要等级]
  const META_NODES = [
    { id: 'dmg',     name: '火力校准', desc: '基础伤害 +8%/级',           max: 5, cost: [100, 160, 240, 340, 460], need: null,           col: 0, row: 0 },
    { id: 'bullets', name: '额外弹道', desc: '开局多 1 条直弹（最多 2 条）', max: 2, cost: [300, 800],            need: ['dmg', 2],     col: 1, row: 0 },
    { id: 'bossDmg', name: '破甲弹头', desc: '对 Boss 伤害 +10%/级',      max: 3, cost: [400, 700, 1100],         need: ['bullets', 1], col: 2, row: 0 },
    { id: 'reroll',  name: '战术刷新', desc: '每局选卡刷新 +1 次',        max: 3, cost: [200, 400, 700],          need: null,           col: 0, row: 1 },
    { id: 'xp',      name: '学习协议', desc: '击杀经验 +10%/级',          max: 4, cost: [120, 200, 300, 420],     need: ['reroll', 1],  col: 1, row: 1 },
    { id: 'luck',    name: '寻宝雷达', desc: '道具掉落率 +15%/级',        max: 3, cost: [150, 260, 400],          need: ['xp', 1],      col: 2, row: 1 },
    { id: 'speed',   name: '推进器',   desc: '移动速度 +6%/级',           max: 4, cost: [80, 140, 220, 320],      need: null,           col: 0, row: 2 },
    { id: 'slow',    name: '时滞力场', desc: '敌方子弹速度 -5%/级',       max: 4, cost: [150, 240, 350, 480],     need: ['speed', 1],   col: 1, row: 2 },
    { id: 'dustUp',  name: '星元萃取', desc: '星元获取 +12%/级（最多 +72%）', max: 6, cost: [180, 280, 400, 540, 700, 900], need: ['slow', 1], col: 2, row: 2 },
    { id: 'lives',   name: '备用机体', desc: '初始命数 +1（最多 +2）',     max: 2, cost: [260, 600],               need: ['speed', 2],   col: 0, row: 3 },
    // ---- v1.6 新增两个节点，把 3×4 的格子补满 ----
    { id: 'rarity',  name: '高阶卡池', desc: '稀有 / 史诗卡出现率 +18%/级', max: 3, cost: [350, 600, 950],         need: ['xp', 2],      col: 1, row: 3 },
    { id: 'guard',   name: '开局装甲', desc: '每局前 N 次受伤免疫',       max: 2, cost: [450, 950],               need: ['dustUp', 2],  col: 2, row: 3 }
  ];
  const META_BY_ID = Object.create(null);
  for (let i = 0; i < META_NODES.length; i++) META_BY_ID[META_NODES[i].id] = META_NODES[i];

  const metaLvls = Object.create(null);
  (function () {
    const m = lsJson('starfighter_meta', {});
    if (m && typeof m === 'object') {
      for (const k in m) {
        const v = Math.floor(Number(m[k]) || 0);
        if (v > 0) metaLvls[k] = v;
      }
    }
  })();

  function mlv(id) { return metaLvls[id] || 0; }
  function metaCost(n) { return n.cost[mlv(n.id)] || 0; }
  function metaUnlocked(n) { return !n.need || mlv(n.need[0]) >= n.need[1]; }
  function metaCanUp(n) { return mlv(n.id) < n.max && metaUnlocked(n) && dust >= metaCost(n); }

  function saveMeta() {
    lsSet('starfighter_dust', dust);
    lsSet('starfighter_meta', JSON.stringify(metaLvls));
  }

  function addDust(n) {
    const g = Math.max(1, Math.round(n * (1 + 0.12 * mlv('dustUp'))));
    dust += g;
    dustEarned += g;
    return g;
  }

  function upgradeMeta(n) {
    if (!metaCanUp(n)) return false;
    dust -= metaCost(n);
    metaLvls[n.id] = mlv(n.id) + 1;
    saveMeta();
    sfx.cardPick();
    return true;
  }

  function buySkin(s) {
    if (!skinIsStore(s) || skinOwned(s) || dust < s.cost) return false;
    dust -= s.cost;
    ownedSkinSet[s.id] = true;
    lsSet('starfighter_owned', JSON.stringify(Object.keys(ownedSkinSet)));
    saveMeta();
    sfx.cardPick();
    return true;
  }

  function equipSkin(s) {
    if (!skinOwned(s)) return false;
    const i = findIdx(SKINS, s.id);
    if (i < 0) return false;
    skinIdx = i;
    lsSet('starfighter_skin', s.id);
    return true;
  }

  loadLooks();

  // ============================================================
  //  本地排行榜（v1.7：从「TOP5 只看分数」升级成 3 个榜 × TOP10）
  //  runs = 每次结算的一条战绩，三个榜只是排序字段不同
  // ============================================================
  const RUN_KEEP = 30;          // 存档保留多少条（足够三个榜各自排）

  function normRun(r) {
    if (!r || typeof r !== 'object') return null;
    return {
      id: Number(r.id) || 0,
      score: Math.max(0, Math.floor(Number(r.score) || 0)),
      level: Math.max(1, Math.floor(Number(r.level) || 1)),
      time: Math.max(0, Math.floor(Number(r.time) || 0)),
      kills: Math.max(0, Math.floor(Number(r.kills) || 0)),
      boss: Math.max(0, Math.floor(Number(r.boss) || 0)),
      combo: Math.max(0, Math.floor(Number(r.combo) || 0)),
      fire: Math.max(1, Math.floor(Number(r.fire) || 1)),
      date: typeof r.date === 'string' ? r.date : '',
      daily: !!r.daily,
      skin: typeof r.skin === 'string' ? r.skin : 'aurora'
    };
  }

  // 读取战绩；如果新版存档不存在，就把旧版 starfighter_board（只有 score/level/time）迁移过来
  let runs = (function () {
    const raw = lsJson('starfighter_runs', null);
    if (Array.isArray(raw) && raw.length) {
      const out = [];
      for (let i = 0; i < raw.length; i++) { const r = normRun(raw[i]); if (r) out.push(r); }
      return out;
    }
    const old = lsJson('starfighter_board', []);
    const out = [];
    if (Array.isArray(old)) {
      for (let i = 0; i < old.length; i++) { const r = normRun(old[i]); if (r) out.push(r); }
    }
    return out;
  })();

  function saveRuns() {
    lsSet('starfighter_runs', JSON.stringify(runs));
  }

  const BOARD_TABS = [
    { id: 'score', name: '总分', color: '#ffd34d' },
    { id: 'kills', name: '击杀', color: '#ff8fa3' },
    { id: 'combo', name: '连击', color: '#8affc1' }
  ];
  let boardTab = 0;
  let boardTabs = [];          // 三个 tab 的命中矩形（drawStatsBoard 里赋值）
  const BOARD_SIZE = 10;       // 每个榜显示前 10

  function boardSorted(key) {
    const arr = runs.slice();
    arr.sort(function (a, b) {
      if (key === 'kills' && b.kills !== a.kills) return b.kills - a.kills;
      if (key === 'combo' && b.combo !== a.combo) return b.combo - a.combo;
      if (b.score !== a.score) return b.score - a.score;
      return b.id - a.id;      // 同分时新纪录靠前
    });
    return arr;
  }

  function boardTop(key, n) {
    return boardSorted(key).slice(0, n || BOARD_SIZE);
  }

  function saveTotals() {
    lsSet("starfighter_kills", totalKills);
    lsSet("starfighter_bosses", totalBosses);
  }

  // 本局战绩（resetGame 清零）
  let lastRunId = 0;
  let lastRunRank = 0;         // 本局在总分榜的名次，0 = 没进榜

  function submitScore() {
    const rec = {
      id: Date.now(),
      score: score, level: level, time: Math.floor(gameTime),
      kills: killsThisRun, boss: bossesThisRun, combo: maxCombo,
      fire: player.fireLevel, date: dayKey(), daily: dailyActive, skin: curSkin().id
    };
    lastRunId = rec.id;
    runs.push(rec);
    if (runs.length > RUN_KEEP) {          // 超出就按总分裁掉最差的
      runs.sort(function (a, b) { return b.score - a.score; });
      runs.length = RUN_KEEP;
    }
    saveRuns();
    const rank = boardSorted('score').findIndex(function (r) { return r.id === rec.id; });
    lastRunRank = rank >= 0 ? rank + 1 : 0;   // 被裁掉就是 0（没进榜）
  }

  // ============================================================
  //  每日挑战：固定种子 + 当天固定规则
  // ============================================================
  const DAILY_RULES = [
    { id: 'glass', name: '玻璃大炮', desc: '只有 1 条命，伤害 ×2' },
    { id: 'rush',  name: '狂奔',     desc: '敌人提速 30%，得分 ×1.5' },
    { id: 'ammo',  name: '弹药短缺', desc: '射速 -20%，单发伤害 +3' },
    { id: 'elem',  name: '元素狂欢', desc: '开局送 3 种元素各 1 层' },
    { id: 'dry',   name: '断货',     desc: '道具不掉落，经验 +60%' },
    { id: 'dense', name: '虫海',     desc: '敌机密度 ×1.6，得分 ×1.3' }
  ];

  const runMods = { dmg: 1, enemySpeed: 1, score: 1, fire: 1, drop: 1, xp: 1, density: 1 };
  let dailyActive = false;
  let dailyDate = '';
  let dailyRule = null;
  let dailyDensityBackup = 1.3;
  let rngCalls = 0;
  const realRandom = Math.random;

  function dayKey(d) {
    const t = d || new Date();
    return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  }

  function seedFrom(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function todayRule() {
    return DAILY_RULES[seedFrom(dayKey()) % DAILY_RULES.length];
  }

  function resetMods() {
    runMods.dmg = 1; runMods.enemySpeed = 1; runMods.score = 1;
    runMods.fire = 1; runMods.drop = 1; runMods.xp = 1; runMods.density = 1;
  }

  function stopDaily() {
    if (!dailyActive) return;
    dailyActive = false;
    dailyRule = null;
    dailyDate = '';
    gRandom = realRandom;
    settings.density = dailyDensityBackup;
    resetMods();
  }

  function startDaily() {
    if (dailyActive) stopDaily();
    initAudio();
    resetGame();

    dailyActive = true;
    dailyDate = dayKey();
    dailyRule = todayRule();
    const seedFn = mulberry32(seedFrom('starfighter-' + dailyDate));
    rngCalls = 0;
    gRandom = function () { rngCalls++; return seedFn(); };
    resetMods();

    const r = dailyRule;
    dailyDensityBackup = settings.density;   // 先备份玩家当前设置，退出每日时恢复
    if (r.id === 'glass') { player.lives = 1; player.maxLives = 1; runMods.dmg = 2; }
    else if (r.id === 'rush') { runMods.enemySpeed = 1.3; runMods.score = 1.5; }
    else if (r.id === 'ammo') { runMods.fire = 1.2; }
    else if (r.id === 'elem') { perks.burn = 1; perks.poison = 1; perks.chain = 1; }
    else if (r.id === 'dry') { runMods.drop = 0; runMods.xp = 1.6; }
    else if (r.id === 'dense') {
      runMods.density = 1.6; runMods.score = 1.3;
      settings.density = 1.6;
    }

    player.fireLevel = weaponLevelFor(level);
    gameState = 'playing';
    sfx.start();
    startBGM();
    floaters.push({ x: W / 2, y: H * 0.34, text: '每日挑战 · ' + r.name, life: 2.2, max: 2.2, color: '#ffd34d' });
  }

  // ---- 每日挑战存档：只留最近 7 天，提供 7 天记录 / 区间排行 / 连续天数（v1.2）----
  const DAILY_KEEP = 7;

  function dailyRec() {
    const rec = lsJson('starfighter_daily', {});
    return rec && typeof rec === 'object' ? rec : {};
  }

  function dailyBest() {
    return dailyRec()[dayKey()] || null;
  }

  // 最近 7 天，按日期从新到旧（可传入已解析的存档，避免每帧重复 JSON.parse）
  function dailyHistory(recArg) {
    const rec = recArg || dailyRec();
    const keys = Object.keys(rec).sort().slice(-DAILY_KEEP).reverse();
    const out = [];
    for (let i = 0; i < keys.length; i++) {
      const v = rec[keys[i]] || {};
      out.push({ date: keys[i], score: Number(v.score) || 0, level: Number(v.level) || 1 });
    }
    return out;
  }

  // 区间排行：把 7 天里的成绩按分数排，名次 1~7
  function dailyRange(recArg) {
    const arr = dailyHistory(recArg);
    arr.sort(function (a, b) { return b.score - a.score; });
    for (let i = 0; i < arr.length; i++) arr[i].rank = i + 1;
    return arr;
  }

  // 连续挑战天数（今天没打就从昨天开始数）
  function dailyStreak(recArg) {
    const rec = recArg || dailyRec();
    let streak = 0;
    const d = new Date();
    for (let i = 0; i < DAILY_KEEP; i++) {
      const key = dayKey(d);
      if (rec[key]) streak++;
      else if (i > 0) break;
      d.setDate(d.getDate() - 1);
    }
    return streak;
  }

  function saveDailyBest() {
    if (!dailyActive) return;
    const rec = dailyRec();
    const key = dailyDate || dayKey();
    if (!rec[key] || score > rec[key].score) {
      rec[key] = { score: score, level: level };
    }
    const keys = Object.keys(rec).sort();
    while (keys.length > DAILY_KEEP) delete rec[keys.shift()];
    lsSet('starfighter_daily', JSON.stringify(rec));
  }

  // ============================================================
  //  每日任务（v1.5）：每天 3 个，进度跨局累计，完成给星元
  // ============================================================
  const MISSION_COUNT = 3;
  const MISSION_BONUS = 220;        // 3 个全清额外奖励（v1.6 从 300 下调）
  const MISSION_REWARD_SCALE = 0.75; // 任务奖励统一缩放（v1.6 配合「降低星元产出」）

  // kind: add = 累加（跨局累计） / max = 取单局最大值
  const MISSION_POOL = [
    { id: 'kill',    name: '清场',     kind: 'add', unit: '架', desc: '累计击坠',  color: '#ff8fa3', target: [120, 200, 300],       reward: [120, 180, 240] },
    { id: 'combo',   name: '连击',     kind: 'max', unit: '层', desc: '单局连击',  color: '#ffd34d', target: [20, 30, 45],          reward: [110, 160, 220] },
    { id: 'boss',    name: '屠龙',     kind: 'add', unit: '个', desc: '击杀 Boss', color: '#ff9a3c', target: [1, 2, 3],             reward: [200, 300, 400] },
    { id: 'powerup', name: '补给',     kind: 'add', unit: '个', desc: '拾取道具',  color: '#5fd0ff', target: [8, 12, 18],           reward: [90, 130, 180] },
    { id: 'special', name: '火力全开', kind: 'add', unit: '次', desc: '释放大招',  color: '#ffe45e', target: [4, 6, 9],             reward: [90, 130, 180] },
    { id: 'level',   name: '成长',     kind: 'max', unit: '级', desc: '单局等级',  color: '#8affc1', target: [20, 30, 45],          reward: [110, 160, 220] },
    { id: 'score',   name: '得分',     kind: 'max', unit: '分', desc: '单局得分',  color: '#c08cff', target: [15000, 25000, 40000], reward: [120, 180, 240] },
    { id: 'noHit',   name: '铁壁',     kind: 'max', unit: '秒', desc: '单局无伤',  color: '#9fe8ff', target: [50, 75, 100],         reward: [140, 200, 280] }
  ];
  const MISSION_BY_ID = Object.create(null);
  for (let i = 0; i < MISSION_POOL.length; i++) MISSION_BY_ID[MISSION_POOL[i].id] = MISSION_POOL[i];

  let missionState = null;      // { date, prog:{id:值}, done:{id:bool}, bonus:bool }
  let missionCache = null;      // 当天 3 个任务（含实时进度），避免每帧重算洗牌
  let missionCacheDate = '';

  // 日期种子决定今天哪 3 个任务 + 各自的强度档位（同一天固定，跨设备也一致）
  function buildMissions(dateStr) {
    const rng = mulberry32(seedFrom('starfighter-mission-' + dateStr));
    const pool = MISSION_POOL.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    const out = [];
    for (let i = 0; i < MISSION_COUNT && i < pool.length; i++) {
      const d = pool[i];
      const tier = Math.floor(rng() * d.target.length);
      out.push({
        id: d.id, name: d.name, desc: d.desc, unit: d.unit, color: d.color, kind: d.kind,
        tier: tier, target: d.target[tier],
        reward: Math.round(d.reward[tier] * MISSION_REWARD_SCALE / 5) * 5   // 取 5 的倍数，显示与发放一致
      });
    }
    return out;
  }

  function freshMission(dateStr) {
    const list = buildMissions(dateStr);
    const prog = Object.create(null), done = Object.create(null);
    for (let i = 0; i < list.length; i++) { prog[list[i].id] = 0; done[list[i].id] = false; }
    return { date: dateStr, prog: prog, done: done, bonus: false };
  }

  function loadMission() {
    const today = dayKey();
    const raw = lsJson('starfighter_mission', null);
    if (!raw || raw.date !== today || !raw.prog || !raw.done) return freshMission(today);
    const st = { date: today, prog: Object.create(null), done: Object.create(null), bonus: !!raw.bonus };
    for (const k in raw.prog) {
      const v = Math.floor(Number(raw.prog[k]) || 0);
      if (v > 0) st.prog[k] = v;
    }
    for (const k in raw.done) if (raw.done[k]) st.done[k] = true;
    return st;
  }

  missionState = loadMission();

  function saveMission() {
    lsSet('starfighter_mission', JSON.stringify(missionState));
  }

  // 跨天自动换一批（0 点刷新）；换天时旧进度直接作废
  function ensureMissionDay() {
    const today = dayKey();
    if (missionState && missionState.date === today) return false;
    missionState = freshMission(today);
    missionCache = null;
    missionCacheDate = '';
    saveMission();
    toasts.push({ text: '新的一天 · 每日任务已刷新', life: 2.6, max: 2.6, color: '#ffd34d' });
    return true;
  }

  // 当天 3 个任务 + 实时进度（drawMissions 每帧调用，所以走缓存）
  function missionList() {
    if (!missionCache || missionCacheDate !== missionState.date) {
      missionCache = buildMissions(missionState.date);
      missionCacheDate = missionState.date;
    }
    for (let i = 0; i < missionCache.length; i++) {
      const m = missionCache[i];
      const raw = Math.floor(missionState.prog[m.id] || 0);
      m.done = !!missionState.done[m.id];
      m.prog = m.done ? m.target : clamp(raw, 0, m.target);
    }
    return missionCache;
  }

  function missionDoneCount() {
    const list = missionList();
    let n = 0;
    for (let i = 0; i < list.length; i++) if (list[i].done) n++;
    return n;
  }

  function missionFind(id) {
    const list = missionList();
    for (let i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  // 完成：立刻给星元（不走 addDust，奖励固定不被「星元萃取」放大）
  function completeMission(m) {
    if (!m || missionState.done[m.id]) return;
    missionState.done[m.id] = true;
    missionState.prog[m.id] = m.target;
    dust += m.reward;
    dustEarned += m.reward;
    toasts.push({ text: '✓ 任务完成 · ' + m.name + '  +' + m.reward + ' ★', life: 2.8, max: 2.8, color: m.color });
    if (gameState === 'playing') {
      floaters.push({ x: player.x, y: player.y - 88, text: '+' + m.reward + ' ★', life: 1.5, max: 1.5, color: m.color });
    }
    sfx.achv();
    vibrate([15, 20, 15]);
    if (!missionState.bonus && missionDoneCount() >= MISSION_COUNT) {
      missionState.bonus = true;
      dust += MISSION_BONUS;
      dustEarned += MISSION_BONUS;
      toasts.push({ text: '★ 今日任务全清  +' + MISSION_BONUS + ' ★', life: 3.4, max: 3.4, color: '#ffd34d' });
      sfx.milestone();
    }
    saveMission();
    saveMeta();
  }

  // 累加型（击杀 / Boss / 道具 / 大招）
  function missionAdd(id, n) {
    const m = missionFind(id);
    if (!m || m.done) return;
    const cur = missionState.prog[id] || 0;
    const next = Math.min(m.target, cur + (n || 1));
    if (next <= cur) return;
    missionState.prog[id] = next;
    if (next >= m.target) completeMission(m);
  }

  // 最大值型（连击 / 等级 / 得分 / 无伤秒数）
  function missionMax(id, v) {
    const m = missionFind(id);
    if (!m || m.done) return;
    const val = Math.min(m.target, Math.floor(v || 0));
    const cur = missionState.prog[id] || 0;
    if (val <= cur) return;
    missionState.prog[id] = val;
    if (val >= m.target) completeMission(m);
  }

  // 0.25 秒一次（跟成就判定同一节流点），只喂「取最大值」类任务
  function missionTick() {
    ensureMissionDay();
    missionMax('score', score);
    missionMax('level', level);
    missionMax('noHit', Math.floor(gameTime - lastHurtAt));
  }

  // ============================================================
  //  设置 + 音量总线
  // ============================================================
  const settings = { volume: 0.9, music: true, density: 1.3, vibrate: true };
  let masterGain = null;

  // 手机震动：不支持就直接忽略（桌面浏览器没有 navigator.vibrate）
  function vibrate(pattern) {
    if (!settings.vibrate) return;
    try {
      if (navigator.vibrate) navigator.vibrate(pattern);
    } catch (e) { /* 忽略 */ }
  }

  function outNode() { return masterGain || actx.destination; }

  // ============================================================
  //  音效（Web Audio 实时合成）
  // ============================================================
  let actx = null, noiseBuf = null;

  function initAudio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      const len = Math.floor(actx.sampleRate * 0.8);
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      masterGain = actx.createGain();
      masterGain.gain.value = settings.volume;
      masterGain.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
  }

  function tone(freq, freq2, dur, type, vol) {
    if (!actx) return;
    const t0 = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(Math.max(1, freq), t0);
    if (freq2 && freq2 !== freq) o.frequency.exponentialRampToValueAtTime(Math.max(1, freq2), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(outNode());
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  }

  function noise(dur, vol, cut) {
    if (!actx || !noiseBuf) return;
    const t0 = actx.currentTime;
    const src = actx.createBufferSource();
    src.buffer = noiseBuf;
    const f = actx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(cut, t0);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, cut * 0.12), t0 + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(Math.max(0.0002, vol), t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(outNode());
    src.start(t0);
    src.stop(t0 + dur + 0.03);
  }

  // ============================================================
  //  背景音乐（纯 Web Audio 合成的循环芯片乐）
  // ============================================================
  const BGM_STEP = 0.16;
  const BGM_LEAD = [

  ];
  const BGM_BASS = [

  let bgmTimer = null;
  let bgmNext = 0;
  let bgmStep = 0;
  let bgmOn = true;
  let bgmLayer = 0;      // 0 基础 / 1 加反拍镲 / 2 加军鼓 / 3 加琶音（连击越高层越多）

  function bgmNote(freq, t, dur, type, vol) {
    if (!actx) return;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);

    o.stop(t + dur + 0.03);
  }

  function bgmLead(freq, t, dur, vol) {
    if (!actx) return;
    for (let k = 0; k < 2; k++) {
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(freq, t);
      o.detune.setValueAtTime(k === 0 ? -7 : 7, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(outNode());
      o.start(t);
      o.stop(t + dur + 0.02);
    }
  }

  function bgmHat(t, volK) {
    if (!actx || !noiseBuf) return;
    const srcBuf = actx.createBufferSource();
    srcBuf.buffer = noiseBuf;
    const f = actx.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = 6000;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.05 * (volK === undefined ? 1 : volK), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
    srcBuf.connect(f); f.connect(g); g.connect(outNode());
    srcBuf.start(t);
    srcBuf.stop(t + 0.05);
  }

  // 分层 2：军鼓（带通噪声）
  function bgmSnare(t, volK) {
    if (!actx || !noiseBuf) return;
    const src = actx.createBufferSource();
    src.buffer = noiseBuf;
    const f = actx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = 1750;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.08 * (volK === undefined ? 1 : volK), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    src.connect(f); f.connect(g); g.connect(outNode());
    src.start(t);
    src.stop(t + 0.13);
  }

  // 分层 3：高音琶音
  const BGM_ARP = [880, 1046.5, 1318.5, 1046.5, 987.8, 1174.7, 1479.98, 1174.7];
  function bgmArp(t, i) {
    const f = BGM_ARP[i % BGM_ARP.length];
    bgmNote(f, t, 0.055, 'square', 0.016);
  }

  function bgmKick(t) {
    if (!actx) return;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(120, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.28, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g).connect(outNode());
    o.start(t);
    o.stop(t + 0.16);
  }

  function bgmTick() {
    if (!actx || !bgmOn) return;
    const now = actx.currentTime;
    if (bgmNext < now - 0.5) bgmNext = now + 0.05;   // 切走标签页回来别猛追
    while (bgmNext < now + 0.35) {
      const i = bgmStep % BGM_LEAD.length;
      if (BGM_LEAD[i]) bgmLead(BGM_LEAD[i], bgmNext, 0.14, 0.050);
      if (BGM_BASS[i]) bgmNote(BGM_BASS[i], bgmNext, 0.15, 'sawtooth', 0.085);
      if (i % 4 === 0) bgmKick(bgmNext);
      if (i % 2 === 1) bgmHat(bgmNext);

      // 连击分层：15 反拍镲 / 30 军鼓 + 加花镲 / 60 高音琶音
      if (bgmLayer >= 1 && i % 2 === 0) bgmHat(bgmNext, 0.62);
      if (bgmLayer >= 2 && i % 8 === 2) bgmSnare(bgmNext, 1);
      if (bgmLayer >= 2 && i % 4 === 3) bgmHat(bgmNext, 0.9);
      if (bgmLayer >= 3) bgmArp(bgmNext, i);

      bgmStep++;
      bgmNext += BGM_STEP;
    }
  }

  function startBGM() {
    if (!actx || bgmTimer) return;
    bgmNext = actx.currentTime + 0.1;
    bgmStep = 0;
    bgmTimer = setInterval(bgmTick, 120);
  }

    player.invuln = 2;
    player.shield = 0;
    player.guard = mlv('guard');       // 局外：开局装甲（前 N 次受伤免疫）
    player.fireLevel = 1;
    player.fireCd = 0;

    pointer.x = W / 2;
    pointer.y = H - 110;
    pointer.active = false;

    ensureMissionDay();   // 跨天时换一批每日任务（进度跨局保留，不在这里清）
  }

  // 游戏中退出到主界面（v1.4）：星元/累计保留，本局成绩不记录
  function quitToStart() {
    quitArm = 0;
    saveMeta();
    saveTotals();
    saveMission();        // 每日任务进度跨局保留
    stopDaily();
    stopBGM();
    resetGame();          // 清场，避免主界面残留敌机 / Boss / 弹幕
    gameState = 'start';
    sfx.pause();
  }

  // 第一次调只是上膛（按钮变红 + 提示），2.5 秒内再来一次才真的退
  function requestQuit() {
    if (quitArm > 0) { quitToStart(); return; }
    quitArm = 2.5;
    sfx.warn();
    vibrate(25);
  }

  function startGame() {
    stopDaily();
    initAudio();
    resetGame();
    gameState = 'playing';
    sfx.start();
    startBGM();
  }

  function gameOver() {
    if (perk('rebirth') > 0 && !rebirthUsed) {
      rebirthUsed = true;
      player.lives = 2;
      player.invuln = 3;
      player.shield = 3;
      bombCharge = Math.min(300, bombCharge + 100);
      explode(player.x, player.y, '#ffd34d', 60, 2.4);
      rings.push({ x: player.x, y: player.y, r: 20, maxR: 280, life: 0.8, max: 0.8, color: '#ffd34d' });
      floaters.push({ x: player.x, y: player.y - 74, text: '凤凰核心！', life: 1.8, max: 1.8, color: '#ffd34d' });
      shake.mag = 16; shake.t = shake.dur;
      sfx.heal();
      return;
    }

    gameState = 'over';
    stopBGM();
    if (score > best) { best = score; saveBest(best); isNewBest = true; }
    submitScore();
    saveDailyBest();
    saveTotals();
    saveMeta();      // 星元 / 局外升级落盘
    saveMission();   // 每日任务进度落盘
    checkAchv();
    explode(player.x, player.y, '#9fe8ff', 70, 2.6);
    shake.mag = 18; shake.t = shake.dur;
    sfx.gameOver();
    vibrate([90, 60, 140]);
  }

  // ============================================================
  //  经验与升级
  // ============================================================
  function addXp(amount) {
    if (level >= MAX_LEVEL) { score += 20; return; }
    xp += amount * (1 + 0.25 * perk('exp')) * runMods.xp * (1 + 0.1 * mlv('xp'));   // 局外：学习协议

    while (xp >= xpNext && level < MAX_LEVEL) {
      xp -= xpNext;
      level++;
      xpNext = Math.round(8 + 0.5 * (level - 1) + 0.0002 * (level - 1) * (level - 1) * (level - 1));
      player.fireLevel = weaponLevelFor(level);
      if (level % 5 === 0) pendingCards++;
      if (level % 10 === 0) slowmo = 0.35;
      floaters.push({
        x: player.x, y: player.y - 44,
        text: 'LV.' + level, life: 1.1, max: 1.1, color: '#8affc1'
      });
      sfx.levelUp();
    }
    if (level >= MAX_LEVEL) xp = 0;
  }

  // ============================================================
  //  选卡
  // ============================================================
  // 局外「高阶卡池」：把普通卡的权重挪给稀有 / 史诗（每级 +18% 出现率）
  function cardWeight(rarity) {
    const rr = mlv('rarity');
    const base = RARITY[rarity].weight;
    if (rr <= 0) return base;
    if (rarity === 'common') return Math.max(16, base - 6 * rr);
    if (rarity === 'rare') return base + 3 * rr;
    return base + 3 * rr;   // epic
  }

  function drawCards(n) {
    const picked = [];
    let pool = CARDS.filter(function (c) {
      if (c.lock && !achvSet[c.lock]) return false;   // 成就奖励：未解锁的卡不进池
      return perk(c.id) < c.max;
    });

    while (picked.length < n && pool.length > 0) {
      let total = 0;
      for (let i = 0; i < pool.length; i++) total += cardWeight(pool[i].rarity);
      let r = gRandom() * total;
      let idx = 0;
      for (let i = 0; i < pool.length; i++) {
        r -= cardWeight(pool[i].rarity);
        if (r <= 0) { idx = i; break; }
      }
      picked.push(pool[idx]);
      pool.splice(idx, 1);
    }
    return picked;
  }

  function openCards() {
    if (pendingCards <= 0) return;
    gameState = 'card';
    cardChoices = drawCards(3);
    cardRects = [];
    laserTime = 0;
    sfx.cardOpen();
    if (cardChoices.length === 0) {   // 卡池全满时的兜底，避免卡住
      pendingCards = 0;
      gameState = 'playing';
    }
  }

  // 局外「战术刷新」给的刷新次数：重抽三张，不消耗选卡机会
  function rerollCards() {
    if (gameState !== 'card' || rerollLeft <= 0) return;
    rerollLeft--;
    cardChoices = drawCards(3);
    cardRects = [];
    sfx.cardOpen();
    if (cardChoices.length === 0) { pendingCards = 0; gameState = 'playing'; }
  }

  function pickCard(i) {
    if (gameState !== 'card') return;
    const c = cardChoices[i];
    if (!c) return;

    perks[c.id] = (perks[c.id] || 0) + 1;
    cardsThisRun++;
    player.fireLevel = weaponLevelFor(level);
    pendingCards--;

    sfx.cardPick();
    explode(player.x, player.y, RARITY[c.rarity].color, 30, 1.6);
    rings.push({ x: player.x, y: player.y, r: 10, maxR: 180, life: 0.6, max: 0.6, color: RARITY[c.rarity].color });

    cardChoices = [];
    cardRects = [];
    // ⚠️ v1.8 修复：清掉指针，否则选完卡后飞机会被「点卡片那个手指/鼠标」拽过去
    pointer.active = false;

    if (pendingCards > 0) openCards();
    else gameState = 'playing';
  }

  // ============================================================
  //  输入
  // ============================================================
  window.addEventListener('keydown', function (e) {
    keys[e.code] = true;
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].indexOf(e.code) >= 0) {
      e.preventDefault();
    }
    initAudio();

    if (e.code === 'KeyM') {
      bgmOn = !bgmOn;
      settings.music = bgmOn;
      if (bgmOn) startBGM(); else stopBGM();
      return;
    }

    if (e.code === 'Tab') {
      if (gameState === 'stats') { gameState = statsFrom; sfx.pause(); }
      else if (gameState !== 'settings' && gameState !== 'card') {
        openStats(gameState);
      }
      return;
    }

    if (gameState === 'stats') {
      if (e.code === 'Escape' || e.code === 'Space' || e.code === 'Enter') {
        gameState = statsFrom;
        sfx.pause();
      } else if (e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'KeyA' || e.code === 'KeyD') {
        statsPage = (statsPage + 1) % 3;      // v1.7：排行榜 / 成就墙 / 每日 7 天
        sfx.pause();
      } else if (e.code === 'Digit1' || e.code === 'Digit2' || e.code === 'Digit3' || e.code === 'Numpad1' || e.code === 'Numpad2' || e.code === 'Numpad3') {
        if (statsPage % 3 === 0) {            // 只在排行榜页生效
          boardTab = Number(e.code.slice(-1)) - 1;
          sfx.pause();
        }
      }
      return;
    }

    if (gameState === 'meta') {
      if (e.code === 'Escape') { gameState = metaFrom; sfx.pause(); return; }
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveMeta(-1, 0);
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') moveMeta(1, 0);
      else if (e.code === 'ArrowUp' || e.code === 'KeyW') moveMeta(0, -1);
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') moveMeta(0, 1);
      else if (e.code === 'Enter' || e.code === 'Space') upgradeMeta(META_NODES[metaSel]);
      return;
    }

    if (gameState === 'shop') {
      if (e.code === 'Escape') { gameState = shopFrom; sfx.pause(); return; }
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveShop(-1, 0);
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') moveShop(1, 0);
      else if (e.code === 'ArrowUp' || e.code === 'KeyW') moveShop(0, -1);
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') moveShop(0, 1);
      else if (e.code === 'Enter' || e.code === 'Space') shopAct(SKINS[shopSel]);
      return;
    }

    if (gameState === 'missions') {
      if (e.code === 'Escape' || e.code === 'KeyJ') { gameState = missionFrom; sfx.pause(); }
      return;
    }

    if (gameState === 'settings') {
      if (e.code === 'Escape') { gameState = 'playing'; quitArm = 0; sfx.pause(); return; }
      if (e.code === 'KeyQ') { requestQuit(); return; }
      if (e.code === 'ArrowUp' || e.code === 'KeyW') settingIndex = (settingIndex + 3) % 4;
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') settingIndex = (settingIndex + 1) % 4;
      else if (e.code === 'ArrowLeft' || e.code === 'KeyA') adjustSetting(-1);
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') adjustSetting(1);
      return;
    }

    if (gameState === 'card') {
      if (e.code === 'Digit1' || e.code === 'Numpad1') pickCard(0);
      else if (e.code === 'Digit2' || e.code === 'Numpad2') pickCard(1);
      else if (e.code === 'Digit3' || e.code === 'Numpad3') pickCard(2);
      else if (e.code === 'KeyR') rerollCards();
      return;
    }

    if (e.code === 'KeyD' && (gameState === 'start' || gameState === 'over')) {
      startDaily();
      return;
    }
    // C / V：切换已解锁的皮肤与弹道特效（只能在非游戏界面换）
    if (e.code === 'KeyC' && (gameState === 'start' || gameState === 'over')) {
      cycleSkin(1);
      return;
    }
    if (e.code === 'KeyV' && (gameState === 'start' || gameState === 'over')) {
      cycleTrail(1);
      return;
    }
    // T 技能树 / B 商店（局外，v1.3）
    if (e.code === 'KeyT' && (gameState === 'start' || gameState === 'over')) {
      metaFrom = gameState;
      gameState = 'meta';
      metaSel = 0;
      sfx.cardOpen();
      return;
    }
    if (e.code === 'KeyB' && (gameState === 'start' || gameState === 'over')) {
      shopFrom = gameState;
      gameState = 'shop';
      shopSel = findIdx(SKINS, curSkin().id);
      if (shopSel < 0) shopSel = 0;
      sfx.cardOpen();
      return;
    }
    // J 每日任务（v1.5）
    if (e.code === 'KeyJ' && (gameState === 'start' || gameState === 'over')) {
      missionFrom = gameState;
      gameState = 'missions';
      sfx.cardOpen();
      return;
    }
    if (e.code === 'Space' || e.code === 'Enter') {
      if (gameState === 'start' || gameState === 'over') {
        if (dailyActive) startDaily(); else startGame();
      }
      else if (gameState === 'playing') triggerSpecial();
    }
    if (e.code === 'KeyR' && gameState === 'over') {
      if (dailyActive) startDaily(); else startGame();
    }
    if (e.code === 'Escape') {
      if (gameState === 'playing') { gameState = 'settings'; settingIndex = 0; quitArm = 0; sfx.pause(); }
      else if (gameState === 'paused') { gameState = 'playing'; quitArm = 0; sfx.pause(); }
      return;
    }
    if (e.code === 'KeyQ' && gameState === 'paused') {
      requestQuit();
      return;
    }
    if (e.code === 'KeyP') {
      if (gameState === 'playing') { gameState = 'paused'; quitArm = 0; sfx.pause(); }
      else if (gameState === 'paused') { gameState = 'playing'; quitArm = 0; sfx.pause(); }
    }
  });

  window.addEventListener('keyup', function (e) {
    keys[e.code] = false;
  });

  function toGame(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return {
      x: ((clientX - r.left) / r.width) * W,
      y: ((clientY - r.top) / r.height) * H
    };
  }

  // 屏幕上的可点区域（触屏和鼠标共用）。返回 true 表示这次点击已被 UI 吃掉
  function pickHudHit(p) {
    if (gameState !== 'playing' && gameState !== 'paused') return false;

    // 右下角：大招
    if (p.x > W - 132 && p.y > H - 104) {
      if (gameState === 'playing') triggerSpecial();
      return true;
    }
    // 右上角：暂停
    if (p.x > W - 66 && p.y < 64) {
      if (gameState === 'playing') { gameState = 'paused'; quitArm = 0; sfx.pause(); }
      else { gameState = 'playing'; quitArm = 0; sfx.pause(); }
      return true;
    }
    return false;
  }

  function hitRects(p, rects) {
    for (let i = 0; i < rects.length; i++) {
      const r = rects[i];
      if (!r || r.w <= 0 || r.h <= 0) continue;   // 还没画出来的按钮不参与命中（首帧前是 0 尺寸）
      if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) return i;
    }
    return -1;
  }

  // 打开排行榜/成就页（v1.8：手机没有 Tab 键，三个界面都有按钮调这里）
  function openStats(from) {
    statsFrom = from;
    gameState = 'stats';
    statsPage = 0;        // 每次打开先落在排行榜页
    sfx.cardOpen();
  }

  function uiClick(p) {
    if (gameState === 'paused') {
      if (hitRects(p, [quitBtn]) === 0) { requestQuit(); return true; }
      if (hitRects(p, [pauseStatsBtn]) === 0) { openStats('paused'); return true; }
      return false;
    }
    if (gameState === 'card') {
      if (hitRects(p, [rerollBtn]) === 0) { rerollCards(); return true; }
      const i = hitRects(p, cardRects);
      if (i >= 0) pickCard(i);
      return true;
    }
    if (gameState === 'meta') {
      if (hitRects(p, [backBtn]) === 0) { gameState = metaFrom; sfx.pause(); return true; }
      const i = hitRects(p, metaRects);
      if (i >= 0) { metaSel = i; upgradeMeta(META_NODES[i]); }
      return true;
    }
    if (gameState === 'shop') {
      if (hitRects(p, [backBtn]) === 0) { gameState = shopFrom; sfx.pause(); return true; }
      const i = hitRects(p, shopRects);
      if (i >= 0) { shopSel = i; shopAct(SKINS[i]); }
      return true;
    }
    if (gameState === 'missions') {
      if (hitRects(p, [backBtn]) === 0) { gameState = missionFrom; sfx.pause(); return true; }
      return true;
    }
    if (gameState === 'settings') {
      if (hitRects(p, [quitBtn]) === 0) { requestQuit(); return true; }
      const i = hitRects(p, settingRects);
      if (i >= 0) { settingIndex = i; adjustSetting(1); }
      return true;
    }
    if (gameState === 'stats') {
      if (statsPage % 3 === 0) {
        const ti = hitRects(p, boardTabs);
        if (ti >= 0) { boardTab = ti; sfx.pause(); return true; }   // 点 tab 只切榜，不退出
      }
      gameState = statsFrom;
      sfx.pause();
      return true;
    }
    if (gameState === 'over') {
      if (hitRects(p, [overStatsBtn]) === 0) { openStats('over'); return true; }
      return false;
    }
    if (gameState === 'start') {
      if (hitRects(p, [statsBtn]) === 0) { openStats('start'); return true; }
      if (hitRects(p, [dailyBtn]) === 0) { startDaily(); return true; }
      if (hitRects(p, [metaBtn]) === 0) { metaFrom = 'start'; gameState = 'meta'; metaSel = 0; sfx.cardOpen(); return true; }
      if (hitRects(p, [shopBtn]) === 0) {
        shopFrom = 'start';
        gameState = 'shop';
        shopSel = findIdx(SKINS, curSkin().id);
        if (shopSel < 0) shopSel = 0;
        sfx.cardOpen();
        return true;
      }
      if (hitRects(p, [missionBtn]) === 0) {
        missionFrom = 'start';
        gameState = 'missions';
        sfx.cardOpen();
        return true;
      }
      return false;
    }
    return false;
  }

  canvas.addEventListener('mousemove', function (e) {
    const p = toGame(e.clientX, e.clientY);
    pointer.x = p.x;
    pointer.y = p.y;
    // 只有游戏进行中鼠标才牵引战机；选卡/菜单里移动鼠标不激活，避免「选完卡飞机冲向鼠标」
    pointer.active = gameState === 'playing';
  });

  canvas.addEventListener('mousedown', function (e) {
    initAudio();
    const p = toGame(e.clientX, e.clientY);
    if (pickHudHit(p)) return;
    if (uiClick(p)) return;
    if (gameState === 'start' || gameState === 'over') {
      if (dailyActive) startDaily(); else startGame();
    }
  });

  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    initAudio();
    const t = e.touches[0];
    const p = toGame(t.clientX, t.clientY);
    // 点按钮 / 选卡 / 开始游戏：这一下只算 UI 操作，手指松开前不牵引战机
    if (pickHudHit(p) || uiClick(p)) {
      touchLock = true;
      lockX = p.x; lockY = p.y;
      return;
    }
    if (gameState === 'start' || gameState === 'over') {
      if (dailyActive) startDaily(); else startGame();
      touchLock = true;
      lockX = p.x; lockY = p.y;
      return;
    }

    pointer.x = p.x;
    pointer.y = p.y - 46;
    pointer.active = true;
    touchLock = false;
  }, { passive: false });

  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (gameState !== 'playing') return;   // 选卡/菜单里滑动绝不改 pointer
    const t = e.touches[0];
    const p = toGame(t.clientX, t.clientY);
    if (touchLock) {
      // 点完 UI 的小抖动不算操控；明显拖动（>40 逻辑像素）才接管
      if (Math.abs(p.x - lockX) + Math.abs(p.y - lockY) < 40) return;
      touchLock = false;
    }
    pointer.x = p.x;
    pointer.y = p.y - 46;
    pointer.active = true;
  }, { passive: false });

  canvas.addEventListener('touchend', function () {
    touchLock = false;
  }, { passive: true });

  canvas.addEventListener('touchcancel', function () {
    touchLock = false;
  }, { passive: true });

  // ============================================================
  //  星空
  // ============================================================
  function updateStars(dt) {
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      s.y += (26 + s.z * 240) * dt;
      if (s.y > H + 2) { s.y = -2; s.x = vrand(0, W); s.z = vrand(0.15, 1); }
    }
  }

  // ============================================================
  //  玩家
  // ============================================================
  function updatePlayer(dt) {
    if (player.invuln > 0) player.invuln -= dt;
    if (player.shield > 0) player.shield -= dt;

    let dx = 0, dy = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
    if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
    if (keys['ArrowDown'] || keys['KeyS']) dy += 1;

    const sp = moveSpeed();
    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy) || 1;
      player.x += (dx / len) * sp * dt;
      player.y += (dy / len) * sp * dt;
      pointer.active = false;
    } else if (pointer.active) {
      const k = Math.min(1, dt * 16);
      player.x += (pointer.x - player.x) * k;
      player.y += (pointer.y - player.y) * k;
    }

    player.x = clamp(player.x, 20, W - 20);
    player.y = clamp(player.y, 70, H - 26);
  }

  // 元素（特殊）子弹：不是每发都有，按元素卡总层数掷概率，颜色由 drawBullets() 区分
  function rollElement() {
    const burn = perk('burn');
    const poison = perk('poison');
    const chain = perk('chain');
    const stacks = burn + poison + chain;
    if (stacks <= 0) return null;

    const chance = Math.min(0.72, 0.16 + 0.08 * stacks);
    if (gRandom() >= chance) return null;

    const pool = [];
    if (burn > 0) pool.push({ k: 'burn', w: burn });
    if (poison > 0) pool.push({ k: 'poison', w: poison });
    if (chain > 0) pool.push({ k: 'chain', w: chain });

    let total = 0;
    for (let i = 0; i < pool.length; i++) total += pool[i].w;
    let r = gRandom() * total;
    for (let i = 0; i < pool.length; i++) {
      r -= pool[i].w;
      if (r <= 0) return pool[i].k;
    }
    return pool[0].k;
  }

  function playerShoot() {
    const bx = player.x, by = player.y - 24;
    const L = player.fireLevel;
    const pierce = perk('pierce');
    // 1 级只出一条弹，靠伤害和弹体大小补回来
    const solo = L === 1;
    const add = function (x, y, vx, vy, soloBoost) {
      bullets.push({
        x: x, y: y, vx: vx, vy: vy,
        r: soloBoost ? 7 : 5,
        dmg: bulletDamage() * (soloBoost ? 3.2 : 1),
        elem: rollElement(),
        pierce: pierce, hitList: []
      });
    };

    // 正前方直弹：每级只 +1 发，斜弹留到 5 级
    let straight = 1;
    if (L === 2) straight = 2;
    else if (L === 3) straight = 3;
    else if (L === 4) straight = 4;
    else if (L === 5) straight = 5 + Math.min(1, Math.floor(Math.max(0, level - 151) / 40));
    else if (L >= 6) straight = 6 + Math.min(2, Math.floor(Math.max(0, level - 260) / 50));

    for (let i = 0; i < straight; i++) {
      const off = (i - (straight - 1) / 2) * 10;
      add(bx + off, by + Math.abs(off) * 0.3, 0, -950, solo);
    }

    // 局外「额外弹道」：每级 +1 条直弹（左右交替），走正常伤害倍率
    const extraStraight = Math.min(2, mlv('bullets'));
    for (let i = 0; i < extraStraight; i++) {
      const side = i % 2 === 0 ? -1 : 1;
      const off = 20 + Math.floor(i / 2) * 12;
      add(bx + side * off, by + 8, 0, -950, false);
    }

    // 5 级起补两发斜射
    if (L >= 5) {
      const vx = L >= 6 ? 330 : 280;
      add(bx - 16, by + 14, -vx, -860);
      add(bx + 16, by + 14, vx, -860);
    }

    const extra = perk('multishot');
    for (let i = 0; i < extra; i++) {
      const off = 24 + i * 9;
      add(bx - off, by + 16, -130 - i * 45, -850);
      add(bx + off, by + 16, 130 + i * 45, -850);
    }

    sfx.shoot();
  }

  // ============================================================
  //  敌机
  // ============================================================
  // 伤害统一入口：护盾机先吃护盾，护盾没破就完全不掉血
  function applyDamage(e, dmg) {
    if (!e || e.dead) return 0;
    if (e.shieldHp > 0) {
      e.shieldHp -= dmg;
      if (e.shieldHp <= 0) {
        e.shieldHp = 0;
        explode(e.x, e.y, '#63d2ff', 18, 1.4);
        rings.push({ x: e.x, y: e.y, r: 6, maxR: 70, life: 0.4, max: 0.4, color: '#63d2ff' });
        sfx.shieldBreak();
        unlock('guardBreak');
        e.flash = 0.18;
      }
      return 0;
    }
    e.hp -= dmg;
    return dmg;
  }

  const ENEMY_DEF = {
    scout:    { w: 26, h: 26, r: 13, hp: 3,  score: 10, xp: 8,  color: '#ff5f6d' },
    fighter:  { w: 34, h: 32, r: 17, hp: 14, score: 30, xp: 20, color: '#c86bff' },
    heavy:    { w: 52, h: 46, r: 26, hp: 40, score: 80, xp: 42, color: '#ffb347' },
    splitter: { w: 42, h: 38, r: 21, hp: 26, score: 55, xp: 30, color: '#6ef7a8' },
    sniper:   { w: 30, h: 42, r: 16, hp: 18, score: 45, xp: 26, color: '#ff8a3d' },
    guard:    { w: 46, h: 46, r: 22, hp: 34, score: 75, xp: 38, color: '#63d2ff' },
    bomber:   { w: 38, h: 38, r: 19, hp: 20, score: 60, xp: 32, color: '#ff6b3d' },
    healer:   { w: 36, h: 40, r: 18, hp: 22, score: 70, xp: 36, color: '#7dff9e' }
  };

  function makeEnemy(type, x, y) {
    const def = ENEMY_DEF[type];
    const diff = 1 + gameTime * 0.012;
    const hpScale = 1 + Math.pow(Math.min(level, 220) / 60, 2);
    const baseHp = Math.round((def.hp + level * 0.2) * hpScale);
    const shieldMax = type === 'guard' ? Math.round(baseHp * 1.15) : 0;
    return {
      type: type,
      x: x, y: y,
      w: def.w, h: def.h, r: def.r,
      hp: baseHp,
      maxHp: baseHp,
      shieldHp: shieldMax,
      shieldMax: shieldMax,
      score: def.score,
      xp: def.xp,
      color: def.color,
      vy: ({ scout: rand(81, 124), fighter: 63, heavy: 41, splitter: 54, sniper: 50, guard: 40, bomber: 72, healer: 46 }[type] || 50) * diff * runMods.enemySpeed,
      fireCd: rand(0.8, 2.2),
      t: 0,
      seed: rand(0, TAU),
      flash: 0,
      charge: 0,
      burn: 0,
      burnDps: 0,
      armed: 0,
      healCd: rand(1.4, 2.6),
      healPulse: 0,
      marks: [0, 0, 0],   // 元素印记剩余秒数：0 燃烧 / 1 毒素 / 2 闪电，三种同时在 → 元素奇点
      dead: false
    };
  }

  function spawnEnemy() {
    const p = gRandom();
    const t = gameTime;

    let type = 'scout';
    if (t > 30 && p < 0.020) type = 'guard';
    else if (t > 25 && p < 0.040) type = 'heavy';
    else if (t > 22 && p < 0.060) type = 'healer';
    else if (t > 15 && p < 0.090) type = 'bomber';
    else if (t > 20 && p < 0.130) type = gRandom() < 0.5 ? 'splitter' : 'sniper';
    else if (t > 10 && p < 0.440) type = 'fighter';

    spawnStats[type] = (spawnStats[type] || 0) + 1;
    enemies.push(makeEnemy(type, rand(40, W - 40), -40));
  }

  // 编队：一排小飞机斜着冲下来，专门用来刷连击
  function spawnFormation() {
    const n = 6;
    const cx = rand(110, W - 110);
    const dir = gRandom() < 0.5 ? -1 : 1;
    for (let i = 0; i < n; i++) {
      const off = (i - (n - 1) / 2);
      const e = makeEnemy('scout', cx + off * 46 * dir, -40 - Math.abs(off) * 26);
      e.vy *= 1.35;
      e.hp = Math.round((3 + level * 0.15) * (1 + Math.pow(Math.min(level, 220) / 60, 2)));
      e.maxHp = e.hp;
      e.fireCd = 999;
      e.score = 6;
      e.t = i * 0.1;
      enemies.push(e);
    }
    sfx.warn();
    formationTimer = 15 + rand(0, 4);
  }

  // 自爆机：冲进玩家附近后引爆，会连锁炸到旁边的敌机
  function bomberBlast(e) {
    const R = 108;
    explode(e.x, e.y, '#ff9a3c', 36, 2.2);
    explode(e.x, e.y, '#ffd166', 18, 1.4);
    rings.push({ x: e.x, y: e.y, r: 12, maxR: R, life: 0.45, max: 0.45, color: '#ff8a3d' });
    shake.mag = 14; shake.t = shake.dur;
    sfx.boom(0.3, 0.5, 900);
    screenFlash = Math.min(0.12, screenFlash + 0.05);

    if (blastDepth < 3) {
      blastDepth++;
      const dmg = 16 + level * 0.6;
      for (let i = 0; i < enemies.length; i++) {
        const o = enemies[i];
        if (o.dead || o === e) continue;
        if (dist2(o, e) < (R + o.r) * (R + o.r)) {
          applyDamage(o, dmg);
          o.flash = 0.12;
          if (o.hp <= 0) { o.dead = true; killEnemy(o); }
        }
      }
      if (boss && dist2(boss, e) < (R + boss.r) * (R + boss.r)) hurtBoss(dmg);
      blastDepth--;
    }

    if (dist2(e, player) < (R * 0.62) * (R * 0.62)) hitPlayer();
  }

  function updateEnemies(dt) {
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.t += dt;
      if (e.flash > 0) e.flash -= dt;
      if (e.marks) {
        for (let m = 0; m < 3; m++) if (e.marks[m] > 0) e.marks[m] -= dt;
      }

      if (e.type === 'scout') {
        e.y += e.vy * dt;
        e.x += Math.sin(e.t * 2.2 + e.seed) * 42 * dt;
      } else if (e.type === 'fighter') {
        e.y += e.vy * dt;
        e.x += Math.sin(e.t * 1.5 + e.seed) * 130 * dt;
      } else if (e.type === 'bomber') {
        const d = Math.sqrt(dist2(e, player));
        if (e.armed > 0) {
          e.armed -= dt;
          e.x += (player.x - e.x) * Math.min(1, dt * 1.2);
          e.y += (player.y - e.y) * Math.min(1, dt * 1.2);
          if (e.armed <= 0) { e.dead = true; bomberBlast(e); continue; }
        } else if (d < 150 && e.y > 20) {
          e.armed = 0.95;
          sfx.warn();
        } else {
          e.y += e.vy * dt;
        }
      } else if (e.type === 'healer') {
        e.y += e.vy * dt;
        e.x += Math.sin(e.t * 1.1 + e.seed) * 70 * dt;
        if (e.healPulse > 0) e.healPulse -= dt;
        e.healCd -= dt;
        if (e.healCd <= 0 && e.y > 40 && e.y < H - 120) {
          e.healCd = 2.6;
          e.healPulse = 0.5;
          const R = 210;
          let healed = 0;
          for (let j = 0; j < enemies.length; j++) {
            const o = enemies[j];
            if (o === e || o.dead || o.hp >= o.maxHp) continue;
            if (dist2(o, e) < R * R) {
              o.hp = Math.min(o.maxHp, o.hp + o.maxHp * 0.22 + 6);
              healed++;
            }
          }
          if (healed > 0) {
            sfx.heal();
            rings.push({ x: e.x, y: e.y, r: 8, maxR: R, life: 0.5, max: 0.5, color: '#7dff9e' });
          }
        }
      } else {
        e.y += e.vy * dt;
      }
      e.x = clamp(e.x, 16, W - 16);

      // 燃烧持续伤害
      if (e.burn > 0) {
        e.burn -= dt;
        applyDamage(e, e.burnDps * dt);
        if (Math.random() < dt * 14) {
          particles.push({
            x: e.x + rand(-8, 8), y: e.y + rand(-10, 10),
            vx: rand(-18, 18), vy: rand(-80, -34),
            life: 0.42, max: 0.42, color: Math.random() < 0.4 ? "#ffd166" : "#ff7a2f",
            size: rand(2.5, 5)
          });
        }
        if (e.hp <= 0 && !e.dead) { e.dead = true; killEnemy(e); }
      }

      if (e.type === 'sniper') {
        if (e.charge > 0) {
          e.charge -= dt;
          if (e.charge <= 0) {
            const ang = Math.atan2(player.y - e.y, player.x - e.x);
            enemyBullets.push({
              x: e.x, y: e.y + 12,
              vx: Math.cos(ang) * 470, vy: Math.sin(ang) * 470,
              r: 6, color: '#ff5f3c'
            });
            e.fireCd = rand(2.6, 3.8);
          }
        } else {
          e.fireCd -= dt;
          if (e.fireCd <= 0 && e.y > 20 && e.y < H - 160) e.charge = 0.65;
        }
      } else if (e.type === 'bomber' || e.type === 'healer') {
        // 这两类不开炮
      } else if (e.type === 'guard') {
        e.fireCd -= dt;
        if (e.fireCd <= 0 && e.y > 20 && e.y < H - 160) {
          const base = Math.atan2(player.y - e.y, player.x - e.x);
          for (let k = -1; k <= 1; k++) {
            const a = base + k * 0.22;
            enemyBullets.push({
              x: e.x, y: e.y + 14,
              vx: Math.cos(a) * 210, vy: Math.sin(a) * 210,
              r: 5, color: '#63d2ff'
            });
          }
          e.fireCd = rand(1.6, 2.4);
        }
      } else {
        e.fireCd -= dt;
        if (e.fireCd <= 0 && e.y > 10 && e.y < H - 140) {
          enemyFire(e);
          e.fireCd = e.type === 'scout' ? rand(2.4, 3.5)
                   : e.type === 'fighter' ? rand(1.9, 2.7)
                   : rand(1.7, 2.4);
        }
      }
    }
    enemies = enemies.filter(function (e) { return e.y < H + 70 && !e.dead; });
  }

  function enemyFire(e) {
    const speed = 165 + Math.min(85, gameTime * 2.2);

    if (e.type === 'scout') {
      enemyBullets.push({ x: e.x, y: e.y + 13, vx: 0, vy: speed, r: 5, color: '#ff7a8a' });
    } else if (e.type === 'fighter') {
      for (let i = -1; i <= 1; i++) {
        const a = Math.PI / 2 + i * 0.24;
        enemyBullets.push({
          x: e.x, y: e.y + 14,
          vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
          r: 5, color: '#ffb45f'
        });
      }
    } else {
      const base = Math.atan2(player.y - e.y, player.x - e.x);
      for (let i = -2; i <= 2; i++) {
        const a = base + i * 0.20;
        enemyBullets.push({
          x: e.x, y: e.y + 16,
          vx: Math.cos(a) * speed * 0.9, vy: Math.sin(a) * speed * 0.9,
          r: 6, color: '#ff6f3c'
        });
      }
    }
  }

  function killEnemy(e) {
    if (e.type === 'splitter') {
      for (let i = 0; i < 2; i++) {
        const c = makeEnemy('scout', e.x + (i ? 20 : -20), e.y + 6);
        c.hp = Math.max(2, Math.round(e.maxHp * 0.22));
        c.maxHp = c.hp;
        spawnQueue.push(c);
      }
    }

    // 自爆机被击毁也会炸，连锁威胁身边敌机
    if (e.type === 'bomber' && blastDepth < 3) {
      e.dead = true;
      bomberBlast(e);
    }

    totalKills++;
    killsThisRun++;
    // v1.6 下调星元产出：/3 → /5（小机 2、战机 6、重装 16）
    addDust(Math.max(1, Math.round(e.score / 5)));
    if (totalKills % 10 === 0) { saveTotals(); saveMeta(); }
    combo++;
    comboTimer = comboDuration();
    if (combo > maxCombo) maxCombo = combo;
    missionAdd('kill', 1);
    missionMax('combo', combo);
    checkComboMilestone();

    const mult = Math.min(10, 1 + Math.floor(combo / 3));
    const gain = Math.round(e.score * mult * (1 + 0.2 * perk('scavenger')) * runMods.score);
    score += gain;

    const charge = (e.type === 'heavy' || e.type === 'guard') ? 20 : e.type === 'fighter' ? 11 : 6;
    bombCharge = Math.min(300, bombCharge + charge);
    addXp(e.xp);

    healCounter++;
    const lsNeed = Math.max(10, 25 - 5 * (perk('lifesteal') - 1));
    if (perk('lifesteal') > 0 && healCounter >= lsNeed) {
      healCounter = 0;
      if (player.lives < player.maxLives) {
        player.lives++;
        sfx.heal();
        floaters.push({ x: player.x, y: player.y - 60, text: '+1 命', life: 1.1, max: 1.1, color: '#ff7ab8' });
      }
    }

    const big = e.type === 'heavy' || e.type === 'guard';
    explode(e.x, e.y, e.color, big ? 46 : 26, big ? 1.9 : 1.3);
    explode(e.x, e.y, '#ffffff', big ? 16 : 9, 1.15);
    rings.push({ x: e.x, y: e.y, r: 5, maxR: big ? 100 : 60, life: 0.45, max: 0.45, color: e.color });
    floaters.push({
      x: e.x, y: e.y - 16,
      text: '+' + gain + (mult > 1 ? ' x' + mult : ''),
      life: 0.8, max: 0.8,
      color: mult > 1 ? '#ffd34d' : '#cfe6ff'
    });

    screenFlash = Math.min(0.06, screenFlash + 0.02);
    hitstop = Math.min(0.09, hitstop + (big ? 0.07 : 0.035));
    shake.mag = big ? 13 : 5;
    shake.t = shake.dur;
    sfx.boom(big ? 0.24 : 0.14, big ? 0.45 : 0.25, 1500);
    sfx.comboHit(combo);
    if (combo % 25 === 0) sfx.milestone();
    maybeDrop(e);

    const boom = perk('explosive');
    if (boom > 0) {
      const radius = 66;
      const dmg = 7 * boom;
      for (let i = 0; i < enemies.length; i++) {
        const o = enemies[i];
        if (o.dead || o === e) continue;
        if (dist2(o, e) < radius * radius) {
          applyDamage(o, dmg);
          o.flash = 0.1;
          if (o.hp <= 0) { o.dead = true; killEnemy(o); }
        }
      }
      if (boss && dist2(boss, e) < radius * radius) hurtBoss(dmg);
      rings.push({ x: e.x, y: e.y, r: 8, maxR: radius, life: 0.3, max: 0.3, color: '#ff9a3c' });
    }
  }

  // 闪电连锁：命中一个敌人时，把伤害弹到附近的其它敌人
  function makeBolt(x1, y1, x2, y2) {
    const pts = [];
    const seg = 8;
    for (let i = 0; i <= seg; i++) {
      const t = i / seg;
      const j = (i === 0 || i === seg) ? 0 : vrand(-15, 15);
      pts.push({ x: x1 + (x2 - x1) * t + j, y: y1 + (y2 - y1) * t - j * 0.6 });
    }
    const branches = [];
    const n = 1 + Math.floor(Math.random() * 2);
    for (let k = 0; k < n; k++) {
      const bi = 2 + Math.floor(Math.random() * 4);
      const bp = pts[Math.min(bi, pts.length - 2)];
      const ang = Math.atan2(y2 - y1, x2 - x1) + vrand(-1.4, 1.4);
      const len = vrand(26, 58);
      branches.push({ x1: bp.x, y1: bp.y, x2: bp.x + Math.cos(ang) * len, y2: bp.y + Math.sin(ang) * len });
    }
    return { pts: pts, branches: branches, life: 0.3, max: 0.3 };
  }

  // 目标是否泡在毒云里
  function inPoison(o) {
    for (let i = 0; i < poisonClouds.length; i++) {
      const c = poisonClouds[i];
      if (dist2(o, c) < c.r * c.r) return true;
    }
    return false;
  }

  // ============================================================
  //  元素反应：燃烧 + 毒素 = 毒爆 / 燃烧 + 闪电 = 燃链 / 毒素 + 闪电 = 导电
  // ============================================================
  function markElem(e, kind) {
    if (!e.marks) e.marks = [0, 0, 0];
    const i = kind === 'burn' ? 0 : kind === 'poison' ? 1 : 2;
    e.marks[i] = 1.15;
    // 环境也算印记：身上正烧着 / 泡在毒云里，同样刷新（三连锁才打得出来）
    if (e.burn > 0) e.marks[0] = Math.max(e.marks[0], 0.9);
    if (inPoison(e)) e.marks[1] = Math.max(e.marks[1], 0.9);
  }

  // 三元素印记同时在身 → 元素奇点（普通反应有 0.45 秒冷却会挡住它，所以独立判定）
  function checkTrinity(e, x, y) {
    if (!e.marks || trinityCd > 0) return false;
    if (!(e.marks[0] > 0 && e.marks[1] > 0 && e.marks[2] > 0)) return false;
    e.marks[0] = 0; e.marks[1] = 0; e.marks[2] = 0;
    trinityCd = 1.4;
    reaction('奇点', x, y, e);
    return true;
  }

  function reaction(kind, x, y, e) {
    if (kind !== '奇点' && reactionCd > 0) return;
    reactionCd = 0.45;
    reactionTotal++;

    const pw = reactionPower();

    if (kind === '奇点') {
      trinityTotal++;
      // 三连锁：范围最大、三种元素一起上、回充大招、短促慢动作
      const total = perk('burn') + perk('poison') + perk('chain');
      const R = 190 + 18 * Math.min(3, total);
      const dmg = (30 + 9 * total) * pw;
      explode(x, y, '#ffffff', 44, 2.6);
      explode(x, y, '#ff7a2f', 28, 2.0);
      explode(x, y, '#4dff7a', 28, 2.0);
      explode(x, y, '#5fd0ff', 28, 2.0);
      rings.push({ x: x, y: y, r: 14, maxR: R * 1.25, life: 0.75, max: 0.75, color: '#ffffff' });
      rings.push({ x: x, y: y, r: 8, maxR: R, life: 0.55, max: 0.55, color: '#b6ff7a' });
      for (let i = 0; i < enemies.length; i++) {
        const o = enemies[i];
        if (o.dead) continue;
        if (dist2(o, { x: x, y: y }) < (R + o.r) * (R + o.r)) {
          applyDamage(o, dmg);
          o.burn = Math.max(o.burn, 3.0);
          o.burnDps = (3 + 2.2 * perk('burn')) * elemPower() * 1.5;
          o.marks = [0, 0, 0];
          o.flash = 0.16;
          if (o.hp <= 0) { o.dead = true; killEnemy(o); }
        }
      }
      if (boss && dist2(boss, { x: x, y: y }) < (R + boss.r) * (R + boss.r)) hurtBoss(dmg * 1.2);
      poisonClouds.push({
        x: x, y: y, r: 110, life: 1.6, max: 1.6,
        dps: (6 + 2.5 * perk('poison')) * elemPower(), seed: Math.random() * 10
      });
      bombCharge = Math.min(300, bombCharge + 40);
      hitstop = Math.max(hitstop, 0.07);
      slowmo = Math.max(slowmo, 0.10);
      screenFlash = Math.min(0.18, screenFlash + 0.12);
      shake.mag = 20; shake.t = shake.dur;
      vibrate([18, 26, 18, 26, 46]);
      unlock('trinity');
    } else if (kind === '毒爆') {
      const R = 96;
      const dmg = (10 + 5 * perk('poison') + 3 * perk('burn')) * pw;
      explode(x, y, '#9dff6e', 22, 1.6);
      explode(x, y, '#ff7a2f', 14, 1.2);
      rings.push({ x: x, y: y, r: 10, maxR: R, life: 0.4, max: 0.4, color: '#b6ff7a' });
      for (let i = 0; i < enemies.length; i++) {
        const o = enemies[i];
        if (o.dead) continue;
        if (dist2(o, { x: x, y: y }) < (R + o.r) * (R + o.r)) {
          applyDamage(o, dmg);
          o.burn = Math.max(o.burn, 1.8);
          o.burnDps = (3 + 2.2 * perk('burn')) * elemPower();
          o.flash = 0.12;
          if (o.hp <= 0) { o.dead = true; killEnemy(o); }
        }
      }
      if (boss && dist2(boss, { x: x, y: y }) < (R + boss.r) * (R + boss.r)) hurtBoss(dmg);
      poisonClouds.push({
        x: x, y: y, r: 88, life: 2.2, max: 2.2,
        dps: (5 + 2.5 * perk('poison')) * elemPower(), seed: Math.random() * 10
      });
    } else if (kind === '燃链') {
      const around = 150;
      for (let i = 0; i < enemies.length; i++) {
        const o = enemies[i];
        if (o.dead || o === e) continue;
        if (dist2(o, e) < around * around) {
          o.burn = Math.max(o.burn, 2.4);
          o.burnDps = (3 + 2.2 * perk('burn')) * elemPower();
        }
      }
      explode(e.x, e.y, '#ffb347', 12, 1.2);
    } else if (kind === '导电') {
      for (let i = 0; i < poisonClouds.length; i++) {
        const c = poisonClouds[i];
        if (dist2(c, e) > (c.r + 40) * (c.r + 40)) continue;
        c.r = Math.min(130, c.r * 1.6);
        c.life = Math.max(c.life, 1.2);
        for (let j = 0; j < enemies.length; j++) {
          const o = enemies[j];
          if (o.dead) continue;
          if (dist2(o, c) < c.r * c.r) {
            applyDamage(o, c.dps * 0.9 * pw);
            if (o.hp <= 0) { o.dead = true; killEnemy(o); }
          }
        }
      }
      explode(e.x, e.y, '#8fe6ff', 16, 1.4);
    }

    const isT = kind === '奇点';
    floaters.push({
      x: x, y: y - 26,
      text: isT ? '★ 元素奇点 ★' : kind,
      life: isT ? 1.6 : 1.0, max: isT ? 1.6 : 1.0,
      color: isT ? '#ffffff' : '#b6ff7a'
    });
    if (isT) sfx.trinity(); else sfx.reaction();
    if (!isT) { shake.mag = 8; shake.t = shake.dur; }
    checkAchv();
  }

  // 燃烧弹进化：命中炸开一小片火，顺带点燃附近敌机（不重复结算源目标）
  function fireballBlast(x, y, src) {
    const R = 46;
    for (let i = 0; i < enemies.length; i++) {
      const o = enemies[i];
      if (o.dead || o === src) continue;
      if (dist2(o, { x: x, y: y }) > (R + o.r) * (R + o.r)) continue;
      applyDamage(o, 7 * elemPower());
      o.burn = Math.max(o.burn, 2.2);
      o.burnDps = (3 + 2.2 * perk('burn')) * elemPower();
      o.flash = 0.1;
      if (o.hp <= 0) { o.dead = true; killEnemy(o); }
    }
    if (boss && dist2(boss, { x: x, y: y }) < (R + boss.r) * (R + boss.r)) hurtBoss(7 * elemPower());
    explode(x, y, '#ff9a3c', 10, 1.2);
    rings.push({ x: x, y: y, r: 6, maxR: R, life: 0.3, max: 0.3, color: '#ff8a3d' });
  }

  function tryChain(src, fx, fy) {
    const stacks = perk('chain');
    if (stacks <= 0 || chainCd > 0 || src.dead) return;
    chainCd = 0.16;

    const evolved = stacks >= 3;        // 叠满 3 层：电弧弹
    const radius = 150 + stacks * 45 + (evolved ? 70 : 0);
    const r2 = radius * radius;
    const cand = [];

    for (let i = 0; i < enemies.length; i++) {
      const o = enemies[i];
      if (o === src || o.dead) continue;
      const d = dist2(o, src);
      if (d < r2) cand.push({ o: o, d: d });
    }
    if (boss && boss !== src && dist2(boss, src) < r2) {
      cand.push({ o: boss, d: dist2(boss, src) });
    }
    cand.sort(function (a, b) { return a.d - b.d; });

    const maxHits = Math.min(stacks + (evolved ? 2 : 0), cand.length, evolved ? 5 : 3);
    const baseDmg = Math.max(1, Math.round((1 + perk('dmg')) * (0.45 + 0.2 * stacks) * (evolved ? 1.35 : 1)));
    let hit = 0;

    for (let i = 0; i < maxHits; i++) {
      const t = cand[i].o;
      const dmg = Math.max(1, baseDmg - i);
      applyDamage(t, dmg);
      t.flash = 0.12;
      hit++;

      bolts.push(makeBolt(src.x, src.y, t.x, t.y));

      // 元素反应：链击把火焰带过去 / 链击落进毒云
      if (perk('burn') > 0 && t.burn > 0) reaction('燃链', t.x, t.y, t);
      if (perk('poison') > 0 && inPoison(t)) reaction('导电', t.x, t.y, t);

      if (t.hp <= 0) {
        if (t === boss) killBoss();
        else { t.dead = true; killEnemy(t); }
      }
    }
    if (hit > 0) sfx.zap();
  }

  function updatePoison(dt) {
    if (poisonCd > 0) poisonCd -= dt;
    for (let i = 0; i < poisonClouds.length; i++) {
      const c = poisonClouds[i];
      c.life -= dt;
      for (let j = 0; j < enemies.length; j++) {
        const e = enemies[j];
        if (e.dead) continue;
        if (dist2(e, c) < (c.r + e.r) * (c.r + e.r)) {
          applyDamage(e, c.dps * elemPower() * dt);
          if (e.hp <= 0) { e.dead = true; killEnemy(e); }
        }
      }
      if (boss && dist2(boss, c) < (c.r + boss.r) * (c.r + boss.r)) hurtBoss(c.dps * elemPower() * dt);
    }
    poisonClouds = poisonClouds.filter(function (c) { return c.life > 0; });
  }

  // 僚机：绕着玩家转的小飞机，每 droneInterval() 秒追最近目标打一发（编队卡可到 4 台）
  function updateDrones(dt) {
    const n = droneCount();
    if (n <= 0) return;
    droneAngle += dt * (1.7 + 0.5 * Math.min(1, perk('swarm')));
    droneCd -= dt;
    if (droneCd > 0) return;
    droneCd = droneInterval();

    for (let i = 0; i < n; i++) {
      const a = droneAngle + i * (TAU / n);
      const dx = player.x + Math.cos(a) * 36;
      const dy = player.y + Math.sin(a) * 24 - 4;

      let best = null, bd = 1e9;
      for (let j = 0; j < enemies.length; j++) {
        if (enemies[j].dead) continue;
        const d = (enemies[j].x - dx) * (enemies[j].x - dx) + (enemies[j].y - dy) * (enemies[j].y - dy);
        if (d < bd) { bd = d; best = enemies[j]; }
      }
      let ang = -Math.PI / 2;
      if (best) ang = Math.atan2(best.y - dy, best.x - dx);
      else if (boss) ang = Math.atan2(boss.y - dy, boss.x - dx);

      bullets.push({
        x: dx, y: dy,
        vx: Math.cos(ang) * 760, vy: Math.sin(ang) * 760,
        r: 3.5, dmg: 3 + 0.5 * perk('dmg') + 2 * perk('swarm'),
        pierce: 0, hitList: [], drone: true
      });
    }
    sfx.missile();
  }

  // 蓄力主炮：抽到 card 后每 5.5/4.3 秒蓄力，蓄满打出一发贯穿光柱（v1.2 新武器）
  function updateRailgun(dt) {
    if (perk('railgun') <= 0) { railCd = 2.5; railCharge = 0; return; }
    railCd -= dt;
    const wind = 0.8;
    if (railCd > 0 && railCd <= wind) {
      railCharge = clamp(1 - railCd / wind, 0, 1);
      if (Math.random() < dt * 26) {
        particles.push({
          x: player.x + vrand(-34, 34), y: player.y + vrand(-10, 6),
          vx: 0, vy: -vrand(40, 120),
          life: 0.3, max: 0.3, color: '#9fe8ff', size: vrand(2, 4)
        });
      }
    } else {
      railCharge = 0;
    }

    if (railCd <= 0) {
      railCd = railgunCd();
      railCharge = 0;
      const dmg = (14 + 4 * perk('dmg') + 4 * perk('railgun')) * runMods.dmg;
      bullets.push({
        x: player.x, y: player.y - 26,
        vx: 0, vy: -1500,
        r: 10, dmg: dmg, pierce: 99, hitList: [], rail: true
      });
      rings.push({ x: player.x, y: player.y - 20, r: 6, maxR: 92, life: 0.25, max: 0.25, color: '#9fe8ff' });
      shake.mag = 7; shake.t = shake.dur;
      sfx.rail();
    }
  }

  // 闪电 / 电弧的生命周期
  function updateBolts(dt) {
    for (let i = 0; i < bolts.length; i++) bolts[i].life -= dt;
    bolts = bolts.filter(function (b) { return b.life > 0; });
  }

  // ============================================================
  //  Boss（v1.6：3 种轮换 × 3 阶段 × 各自的专属机制）
  // ============================================================
  const BOSS_TYPES = [
    { id: 'wraith',   name: '幽灵母舰', hpMul: 1.00, vx: 85,  body: '#e0559f', hot: '#ff5cd6', shot: '#ff5ea8', accent: '#ffe45e', mech: '幻影分身' },
    { id: 'sentinel', name: '圣盾要塞', hpMul: 1.15, vx: 72,  body: '#3f9fc8', hot: '#6fe2ff', shot: '#5fd0ff', accent: '#c9f6ff', mech: '环身盾牌' },
    { id: 'devourer', name: '吞噬者',   hpMul: 1.30, vx: 100, body: '#d9673a', hot: '#ff8a3d', shot: '#ff8a3d', accent: '#ffe08a', mech: '吞噬领域' }
  ];

  // ---- 圣盾要塞：环身盾牌 ----
  function makeBossShields(b) {
    const n = b.phase >= 3 ? 6 : b.phase === 2 ? 5 : 4;
    const per = Math.max(14, Math.round(b.maxHp * 0.055));
    b.shields = [];
    for (let i = 0; i < n; i++) b.shields.push({ hp: per, maxHp: per, r: 15, dead: false });
    b.broken = 0;
  }

  // 盾牌在椭圆轨道上绕 Boss 转（每帧按 b.t 算，不存坐标）
  function bossShieldPos(b, i) {
    const n = b.shields.length;
